CPU4-columns have a mechanism to integrate activity, and thus motion\nEvidence. Neuronal terminals of Megalopta CPU4-cells in the PB and the noduli appear of mixed type, indicating both input and\noutput. In the noduli, our EM-work in bumblebees shows that arborization patterns of CPU4-cells are highly overlapping, in particular\nbetween the 19 cells from the same fiber bundle (corresponding to one PB-column), generating a sufficiently large population of cells\nfor memory formation and the spatial proximity needed for column-intrinsic circuits. Furthermore, synaptic connections exist be-\ntween small EM-profiles within the noduli, most likely corresponding to CPU4-cells, while individual CPU4-cells contain both input\nand output synapses in the noduli. Finally, preliminary recordings in Megalopta have shown responses to translational optic flow in\nCPU4-cells (data not shown), while in locusts these cells show context dependent responses to compass stimuli [19].\n*Memory – assumption 2: Pontine cells of the CX use inhibition to balance the memory in the CPU4 populations, causing\nthe overall activity on the right brain hemisphere and the left brain hemisphere to remain the same\nEvidence. Pontine cells are highly conserved and are found across all species examined [34, 35, 45–47]. They have a pattern of\nmidline crossing connectivity uniquely suited to bridge output regions of CPU4-cells and contralateral input regions of CPU1-cells.\nThese cells have been shown to contain neuromodulators in locusts (CCAP (crustacean cardioactive peptide) [47] and nitric oxide\n[45, 46]) and thus could act through inhibitory metabotropic receptors. Finally, preliminary intracellular recordings from Megalopta\npontine cells have revealed pronounced, yet non-stereotypical responses to translational optic flow (data not shown).\n**Steering – assumption 1: Activity is summed for CPU1 on each hemisphere to drive steering\nEvidence. Anatomically, CPU1-neurons converge in highly overlapping regions of the LAL in all species examined [30–33]. Further-\nmore, in Monarch butterflies and locusts, neurons potentially postsynaptic to CPU1-cells occupy identical regions of the LAL and\nconnect to posterior regions of the brain that provide input to descending pathways [10, 19]. Additionally, polarized-light tuning\nhas been found in locust neurons interconnecting the LALs of the right and left brain hemisphere [19]. Highly similar cells are involved\nin generating steering in response to pheromone pulses in the moth Bombyx mori [36, 37].\n*Steering – assumption 2: CPU4-cells have no influence on steering when the animal is not in a homing state\nEvidence. The decoupling of memory and steering is necessary during behavioral episodes where memory does not drive behavior.\nThis occurs either at the output or input of CPU1-neurons, thus disabling memory to either reach CPU1-cells or the motor circuit of\nthe LAL. Even though there is no direct evidence for this strong state-dependent switch in active synaptic transmission, there is\nstrong evidence for state-dependent changes in neural signaling in the CX in general [19, 64], combined with a rich variety of neuro-\nmodulator expression in this region [65, 66].\nProbing the limits of the path integration circuit\nTo explore the effects of altering different model parameters on the path integration performance, a set of values were chosen for\neach parameter and N = 2000 homing tasks were completed for each value: 1000 trials at default neural activity noise variance", "translation": "直接支持证据。强支持假设标***，较弱支持标**，缺少支持（即预测）标*。\n***连接假设1：TB1通过相互抑制形成环形吸引子；神经元对之间距离越大，抑制权重越强。\n证据：TB1在邻接其输出纤维的PB柱中没有输入纤维，因此相邻TB1不能互连；输入纤维在离输出最远的柱中密度最高。蝗虫CPU1（可能在TB1突触后）响应与TB1最反相，提示TB1可能抑制。蝗虫TB1还含咽侧体抑制素（Allatostatin）[7]，该肽已知有抑制性受体。\n***连接假设2：TB1在分枝重叠区与CPU1和CPU4形成突触。\n证据：蝗虫TB1、CPU1均参与偏振调谐映射，CPU1与TB1输出柱反相[7]。两者解剖极性鲜明，PB记录的CPU1还有明确突触后电位[72]。TB1输出是昆虫中保守且最显著的PB柱状输出分枝[7,20,31–33]，故极可能为所有在PB有输入的柱状细胞（含CPU4）的突触前细胞。蝗虫CPU4的偏振敏感性依赖条件，PB最可能为信息源[19]。PB中另一主要输出类型、可能位于TB1突触前的是CL1a[19,20,30,33]。也可设想由CL1a连接CPU1、CPU4而形成类似性质的网络，但更复杂且需更多假设。\n**连接假设3：CPU4按分枝模式所反映的方式与CPU1形成突触。\n证据：CBU中CPU1为突触后，CPU4形态明确为突触前[30–33]。蝗虫与帝王蝶中依据曲张或光滑末梢推断的极性，在果蝇突触前标记蛋白映射中均得到跨物种支持（如比较[30]、[32]）。这使CPU1及高度相似的CPU2成为跨物种共有的CPU4潜在靶细胞。另一同样可能接收CPU4的类型是桥接细胞，直接连接CBU同、对侧柱[30,33–35,45]；它们也可能靶向CPU1。因此CPU4与CPU1可直接、间接或两者兼有地相连。两类连接兼用时模型最稳健，也最简约地解释解剖数据：所有极性适当的重叠分枝同样可能对应突触。\n*记忆假设1：CPU4柱具有整合活动、从而整合运动的机制。\n证据：Megalopta的CPU4在PB、小结的末梢为混合型，提示兼有输入、输出。熊蜂电镜显示CPU4分枝高度重叠，尤其同束19个细胞（对应一个PB柱），既有足够大的群体形成记忆，也具柱内回路所需的空间邻近。小结中很可能属于CPU4的小型电镜轮廓间存在突触；单个CPU4在小结兼有输入、输出突触。Megalopta初步记录显示CPU4响应平移视流（数据未展示），蝗虫中则对罗盘刺激呈依赖情境的响应[19]。\n*记忆假设2：CX桥接细胞通过抑制平衡两侧CPU4群体记忆，使左右半球总体活动保持相同。\n证据：桥接细胞高度保守，全部已研究物种均有[34,35,45–47]；其中线交叉连接独特地适于连接CPU4输出区和对侧CPU1输入区。蝗虫中其含甲壳动物心脏活性肽CCAP[47]、一氧化氮[45,46]等神经调质，故可经抑制性代谢型受体作用。Megalopta初步细胞内记录也显示其对平移视流有明显但非固定模式的响应（数据未展示）。\n**转向假设1：各半球CPU1活动求和以驱动转向。\n证据：所有已研究物种的CPU1均汇聚于LAL高度重叠的区域[30–33]。帝王蝶和蝗虫中，潜在CPU1突触后神经元占据相同LAL区，连接至向下行通路供给输入的脑后部区域[10,19]。连接左右LAL的蝗虫神经元具有偏振调谐[19]。家蚕高度相似的细胞参与对信息素脉冲的转向响应[36,37]。\n*转向假设2：动物未处于归巢状态时，CPU4不影响转向。\n证据：记忆不驱动行为的阶段必须使记忆与转向解耦。作用可在CPU1输入或输出端发生，使记忆无法到达CPU1或LAL运动回路。虽无这种强烈状态依赖突触开关的直接证据，但CX信号的状态变化有充分证据[19,64]，该区也表达丰富的神经调质[65,66]。\n路径积分回路极限测试\n为探究参数改变的效果，各参数选定一组取值；每值完成N=2000次归巢，其中1000次为默认活动噪声方差", "status": "translated", "notes": [], "sentence_ids": ["P025-BODY-S001", "P025-BODY-S002", "P025-BODY-S003", "P025-BODY-S004", "P025-BODY-S005", "P025-BODY-S006", "P025-BODY-S007", "P025-BODY-S008", "P025-BODY-S009", "P025-BODY-S010", "P025-BODY-S011", "P025-BODY-S012", "P025-BODY-S013", "P025-BODY-S014", "P025-BODY-S015", "P025-BODY-S016", "P025-BODY-S017", "P025-BODY-S018", "P025-BODY-S019", "P025-BODY-S020", "P025-BODY-S021", "P025-BODY-S022", "P025-BODY-S023", "P025-BODY-S024", "P025-BODY-S025", "P025-BODY-S026", "P025-BODY-S027", "P025-BODY-S028", "P025-BODY-S029", "P025-BODY-S030", "P025-BODY-S031", "P025-BODY-S032", "P025-BODY-S033", "P025-BODY-S034", "P025-BODY-S035", "P025-BODY-S036", "P025-BODY-S037", "P025-BODY-S038", "P025-BODY-S039"], "min_font_pt": 9, "reading_order": 149}], "assets": [], "analysis": []}, {"page": 26, "original": "image-074.jpg", "background": "image-075.jpg", "blocks": [{"id": "P026-A", "page": 26, "bbox": [53.1, 99, 544.1, 152], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 99, 544.1, 152], "source": "s 2 = 0.1 and 1000 at no noise. Small changes to weight matrices between cells were tested by modifying s 2 ˛ {0, 0.01, 0.02, 0.05,\nr w\n0.1, 0.2}. Perturbations to the angular offset of the speed neurons were made by changing the preference angle between 0 and ð p=2Þ\nso that f = ðxp=16Þ where x ˛ {0,...,8}. Experiments were carried out with a rotation-dependent offset to the preference angle of the\nTN\ncompass input neurons (TL and CL). Peak activity would pre-empt the preference angle, similar to the tuning found in real recordings\nas shown in Figure 1G. A gradually increasing angle of perturbation was used:", "translation": "σ_r²=0.1，另1000次无噪声。通过σ_w²∈{0,0.01,0.02,0.05,0.1,0.2}扰动权重矩阵。速率神经元角偏移测试将偏好角在0至π/2间改变：φ_TN=xπ/16，x∈{0,…,8}。另使罗盘输入TL、CL的偏好角随旋转方向偏移，峰值活动如图1G实测般提前出现。逐渐增加角扰动：", "status": "translated", "notes": [], "sentence_ids": ["P026-A-S001", "P026-A-S002", "P026-A-S003", "P026-A-S004", "P026-A-S005"], "min_font_pt": 9, "reading_order": 154}, {"id": "P026-B", "page": 26, "bbox": [53.1, 182, 544.1, 202], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 182, 544.1, 202], "source": "where x ˛ {0,...,8}. Finally, TN input was smoothed to mimic delayed responses seen in Figure 2D. An exponential moving average\nwas used so that:", "translation": "其中x∈{0,…,8}。最后以指数移动平均平滑TN输入，模拟图2D所示延迟响应：", "status": "translated", "notes": [], "sentence_ids": ["P026-B-S001", "P026-B-S002"], "min_font_pt": 9, "reading_order": 155}, {"id": "P026-C", "page": 26, "bbox": [53.1, 229, 544.1, 274], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 229, 544.1, 274], "source": "where n˛ fð1=1Þ ; ð1=2Þ ; ð1=5Þ ; ð1=10Þ ; ð1=20Þ ; ð1=50Þg.\nFurthermore, to test the effects of saturated speed signals, we increased the speed of the agent, with the intention of saturating the\nactivity of TN neurons. Acceleration was increased in 5 equal increments up to three times the amount in our default settings, which\nwas initially set to provide a full range of neural activity.", "translation": "ν∈{1/1,1/2,1/5,1/10,1/20,1/50}。\n为测试速率信号饱和，增大智能体速率使TN活动趋于饱和；加速度以5个等幅增量，最高加至默认值三倍。默认值原设为覆盖完整神经活动范围。", "status": "translated", "notes": [], "sentence_ids": ["P026-C-S001", "P026-C-S002", "P026-C-S003"], "min_font_pt": 9, "reading_order": 156}, {"id": "P026-D", "page": 26, "bbox": [53.1, 285, 544.1, 339], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 285, 544.1, 339], "source": "Testing of the model in an agent simulation\nEach trial was evaluated at five values of noise: s 2 ˛ {0, 0.1, 0.2, 0.3, 0.4}. The effect of these noise levels on the sigmoid I/O functions\nr\nfor all neurons is illustrated in Figure S5A. As a control, attempting to find home using a random walk with similar parameters to the\noutbound route generation mechanism was also included. N = 100 trials were run at twenty distances ranging between 10 and 10,000\nsteps. The trials distances were equally spaced on a logarithmic scale:", "translation": "智能体仿真测试\n在σ_r²∈{0,0.1,0.2,0.3,0.4}五个噪声水平测试（各神经元sigmoid输入输出变化见图S5A）。对照为采用类似外出路径参数随机游走寻找巢穴。在10–10,000步之间20个距离上运行N=100次试验，距离在对数尺度等间隔：", "status": "translated", "notes": [], "sentence_ids": ["P026-D-S001", "P026-D-S002", "P026-D-S003"], "min_font_pt": 9, "reading_order": 157}, {"id": "P026-E", "page": 26, "bbox": [53.1, 364, 544.1, 464], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 364, 544.1, 464], "source": "where x ˛{0,1, ., 20}. In each trial a unique route was generated up to a turning point. For each route the agent was given the same\nnumber of return steps as the outbound steps. The closest distance (in steps) that the agent obtained from the nest during this length-\nlimited return path was used to quantify the homing success (Figure 7A). Accuracy can also be evaluated by whether the agent was\nheading the right way toward the nest shortly after it began homing, a commonly used technique when conducting field experiments\nwith homing insects [73]. Homing direction was determined by measuring the angle when the agent exited a perimeter with 20 step\nradius around the turning point. The homing angle and correct angle between the nest and the turning point was compared (Fig-\nure 7B). Location estimate was decoded directly from the built-up memory representation of CPU4-neurons (before the addition\nof output noise) by summing the two CPU4 subpopulations as shown in Figure S6. Finally, to show that the agent was moving toward\nthe nest in a relatively straight manner we measured the tortuosity of the return route, using the formula:", "translation": "x∈{0,1,…,20}。每次生成一条独特外出路径至折返点，允许返程步数等于外出步数；在这条限长返程上离巢最近距离（步数）量化归巢成功（图7A）。还可看归巢开始后不久是否指向巢穴，这是归巢昆虫野外实验常用方法[73]。测量智能体离开以折返点为中心、半径20步圆周时的方向，与折返点至巢穴的正确方向比较（图7B）。位置估计直接从CPU4累积记忆（加输出噪声前）解码，按图S6将两CPU4亚群相加。最后以返程曲折度说明其是否近似直线归巢：", "status": "translated", "notes": [], "sentence_ids": ["P026-E-S001", "P026-E-S002", "P026-E-S003", "P026-E-S004", "P026-E-S005", "P026-E-S006"], "min_font_pt": 9, "reading_order": 158}, {"id": "P026-F", "page": 26, "bbox": [53.1, 495, 544.1, 517], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 495, 544.1, 517], "source": "where L is the straight distance to the nest, and C is the distance toward the nest that the agent has covered after L steps, i.e.,\nC = L – d , where d is the distance of the agent from the nest after L steps (Figure 7C).\nL L", "translation": "L为至巢直线距离，C为走L步后朝巢推进距离，即C=L−d_L；d_L是L步后距巢距离（图7C）。", "status": "translated", "notes": [], "sentence_ids": ["P026-F-S001"], "min_font_pt": 9, "reading_order": 159}, {"id": "P026-G", "page": 26, "bbox": [53.1, 527, 544.1, 749], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 527, 544.1, 749], "source": "Testing of the model in a robotic implementation\nWe have implemented the CX model on a custom robot platform which combines a Dangu Rover 5 chassis with a motorboard,\nArduino Mega 2560 and a Nexus 5 Android smart-phone. Visual input is obtained from the front camera of the phone with a 360(cid:1)\nlens attachment, and preprocessed to produce a 10x90 pixel image capturing approximately ± 20(cid:1) elevation around the horizon.\nSpeed input is calculated using optic flow on the low-resolution greyscale image obtained from the phone. We apply the dense\noptic flow ‘Farneback’ algorithm using the OpenCV calcOpticFlowFarneback function, which produces a motion vector for every\npixel. We create two filters for the preferred optic flow for each pixel column, corresponding to the preferences observed in the\ndata for left and right TN-neurons, i.e., the horizontal flow expected from translation in the direction ± p/4 respectively. These filters\nare multiplied with the observed vector for each pixel and the sum taken over the whole image to obtain the speed. In testing, this\nspeed measure is noisy and dependent on the distance of objects from the robot, but on average scales linearly with the speed of the\nrobot and proved sufficient for path integration.\nCompass information is taken from the phone’s GAME_ROTATION_VECTOR which uses a combination of gyroscope and accel-\nerometer to estimate the phone’s yaw, pitch and roll. Mounted flat on the robot and operating on a flat floor, the yaw output provided a\nreliable heading direction with negligible drift or cumulative error over the run lengths used to test the system, although in future a\ncompass sense with an absolute external reference would be needed to emulate the celestial compass used by bees.\nThe computational CX model described above was re-coded in Java to run on the phone, using the sensory inputs as described,\nbut with no other modifications. A preprogrammed random path drives the robot on its outbound route, while the home vector ac-\ncumulates in CPU4 memory neurons. To return home, the motor output (the difference in activity of left and right CPU1 steering neu-\nrons) is translated into action by veering left or right (setting wheel speeds in the ratio 1:10) if the respective activity difference exceeds\na threshold, and otherwise driving straight.", "translation": "机器人实现测试\n我们在定制机器人实现CX模型，平台由Dangu Rover 5底盘、电机板、Arduino Mega 2560及Nexus 5 Android手机组成。视觉输入来自手机前摄及360°镜头附件，预处理成10×90像素图，捕获地平线上下约±20°。\n对低分辨率灰度图计算视流以获得速率。用OpenCV calcOpticFlowFarneback的Farneback稠密视流算法求每像素运动向量。为各像素列建立两个偏好视流滤波器，对应左右TN细胞实测偏好，即沿±π/4方向平移时的预期水平视流。滤波器与各像素实测向量相乘，对全图求和得速率。虽噪声较大且依赖物体距离，平均仍随机器人速率线性变化，足以用于路径积分。\n罗盘信息来自手机GAME_ROTATION_VECTOR，结合陀螺仪和加速度计估计偏航、俯仰和滚转。手机平放、机器人在平地运行时，偏航提供可靠方向，在本测试时程内漂移或累积误差可忽略；未来仍需绝对外部参照的罗盘来模拟蜂的天体罗盘。\n上述CX模型用Java重写在手机运行，使用这些感觉输入，其他不变。机器人按预编随机路径外出，同时CPU4累积归巢向量。返回时，将左右CPU1活动差转成动作：若对应差值超过阈值，令左右轮速比1:10以向左或右偏转，否则直行。", "status": "translated", "notes": [], "sentence_ids": ["P026-G-S001", "P026-G-S002", "P026-G-S003", "P026-G-S004", "P026-G-S005", "P026-G-S006", "P026-G-S007", "P026-G-S008", "P026-G-S009", "P026-G-S010", "P026-G-S011", "P026-G-S012"], "min_font_pt": 9, "reading_order": 160}], "assets": [{"id": "P026-E01", "page": 26, "kind": "equation", "bbox": [234, 152, 370, 174], "source_bbox": [234, 152, 370, 174], "source": "原页26公式组1", "asset": "assets\\equation-26-01.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-076.png"}, {"id": "P026-E02", "page": 26, "kind": "equation", "bbox": [230, 208, 380, 222], "source_bbox": [230, 208, 380, 222], "source": "原页26公式组2", "asset": "assets\\equation-26-02.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-077.png"}, {"id": "P026-E03", "page": 26, "kind": "equation", "bbox": [270, 342, 325, 358], "source_bbox": [270, 342, 325, 358], "source": "原页26公式组3", "asset": "assets\\equation-26-03.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-078.png"}, {"id": "P026-E04", "page": 26, "kind": "equation", "bbox": [285, 467, 310, 490], "source_bbox": [285, 467, 310, 490], "source": "原页26公式组4", "asset": "assets\\equation-26-04.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-079.png"}], "analysis": []}, {"page": 27, "original": "image-080.jpg", "background": "image-081.jpg", "blocks": [{"id": "P027-A", "page": 27, "bbox": [59.8, 100, 550.8, 209], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 100, 550.8, 209], "source": "Mathematical framework\nAn intuitive way to understand how our CX model achieves path integration is to think in terms of the addition of sinusoids at the\nfundamental frequency, i.e., with a period of 2p, similar to a theoretical solution to path integration proposed by [48]. Due to the lateral\ninhibition of the TB1 (compass) cells, the activity bump across these neurons in the protocerebral bridge is roughly sinusoidal and can\nbe used to encode an allocentric heading. We propose that the amplitude of this activity bump is scaled in a speed dependent\nmanner by TN (speed) neurons and is repeatedly added at the CPU4 (memory) neurons where these two signals converge. A theo-\nretical outline of why this works is given below, before elaborating on how this fits in with the architecture of the CX.\nAny point in R2 (standard vector space of real numbers in two dimensions) can be expressed as a sinusoid representing polar co-\nordinates, where the amplitude captures the radial coordinate and the phase shift captures the angular coordinate. A population of\ncells using a sinusoid to encode a location could be described as:", "translation": "数学框架\n理解CX模型实现路径积分的一种直观方式，是考虑基频正弦波（周期2π）的相加，类似[48]的理论方案。由于TB1罗盘细胞侧抑制，PB中的活动隆起近似正弦，可编码世界参照航向。我们提出，TN速率神经元按速率缩放其振幅，并在两信号汇聚的CPU4记忆神经元中反复相加。下面先给出理论原理，再解释如何对应CX结构。\nR²（二维实数标准向量空间）的任一点均可用表示极坐标的正弦波编码：振幅表示径向坐标，相移表示角坐标。用正弦波编码位置的细胞群可写为：", "status": "translated", "notes": [], "sentence_ids": ["P027-A-S001", "P027-A-S002", "P027-A-S003", "P027-A-S004", "P027-A-S005", "P027-A-S006"], "min_font_pt": 9, "reading_order": 166}, {"id": "P027-B", "page": 27, "bbox": [59.8, 230, 550.8, 263], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 230, 550.8, 263], "source": "where A represents the distance traveled, a represents the heading and each cell has its own preference angle q. A property of this\nrepresentation is that any linear combination of two sinusoids with the same period results in another sinusoid with same period, but\ndifferent amplitude and phase shift:", "translation": "A为已行进距离，α为航向，每个细胞有自身偏好角θ。同周期两正弦波的任意线性组合，仍是周期相同而振幅、相位不同的正弦波：", "status": "translated", "notes": [], "sentence_ids": ["P027-B-S001", "P027-B-S002"], "min_font_pt": 9, "reading_order": 167}, {"id": "P027-C", "page": 27, "bbox": [59.8, 316, 550.8, 329], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 316, 550.8, 329], "source": "For any x,y ˛ R we can write x = R cosð j Þ and y = R sinð j Þ with j˛ ½0; 2p Þ and R > 0.", "translation": "对任意实数x、y，可写x=R cosψ、y=R sinψ，其中ψ∈[0,2π)、R>0。", "status": "translated", "notes": [], "sentence_ids": ["P027-C-S001"], "min_font_pt": 9, "reading_order": 168}, {"id": "P027-D", "page": 27, "bbox": [59.8, 358, 550.8, 372], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 358, 550.8, 372], "source": "To find R and c we can use the Pythagorean identity:", "translation": "为求R与ψ，可利用勾股恒等式：", "status": "translated", "notes": [], "sentence_ids": ["P027-D-S001"], "min_font_pt": 9, "reading_order": 169}, {"id": "P027-E", "page": 27, "bbox": [59.8, 489, 550.8, 749], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 489, 550.8, 749], "source": "After summing two sinusoids representing consecutive movement vectors the resulting amplitude and phase shift correspond to a\nsinusoid matching a vector that is the sum of both (Figure S6C). Therefore, by summing the corresponding activity of both cell groups\nwe retain a population code that remains accurately pointing to the new location.\nThese properties prove to be useful in several ways for the CX. A single sinusoid (TB1) is repeatedly subtracted (due to inhibition) to\nform a consistent memory representing a home vector (CPU4). Different speeds can also be captured by modulating the amplitude of\nthe sinusoid (TN).\nMotion on a plane can be tracked by measuring the velocity component (speed) along vectors at two offset angles (qh ± 4TN),\nforming a basis. In general, the motion may be holonomic, that is the head direction (origin of egocentric coordinate system) and di-\nrection of motion may not be aligned. The two velocity components are stored in two separate memories, the two duplicate popu-\nlations of CPU4, and could be summed and decoded by re-aligning the sinusoids correctly. In our case, we propose the modulation\nof the sinusoid happens by inhibition, meaning that the shape of the compass (TB) cannot be inverted (multiplied by a negative\nconstant). Because of this only partial holonomic motion can be accurately integrated, with a direction of motion between\nf (cid:3) ð p=4Þ and f + ð p=4Þ as defined in the Methods section when describing the Speed Layer 1. Another way to think about\nTN TN\nthis circuit is as a re-projection from an egocentric basis defined with respect to the heading angle at qh ± 4TN to an allocentric\none defined with respect to the angle of the sun at qTB1 ± 4TN, where all CPU4 cells with input from the same TB1 cell store motion\nprojected on to their basis vector, at ð p=4Þ intervals (8 columns) creating a redundant memory.\nBy element-wise multiplying two discrete sinusoids and summing the output, you can determine how much their phase is aligned.\nThe offset between current heading (TB1) and desired heading (CPU4) is estimated through inhibition of the CPU4 activity from con-\nnecting TB1 cells.\nAs the animal rotates, the TB1 sinusoid is shifted with respect to the memory. A low response indicates high overlap as all highly\nactive cells are suppressed by the TB1 inhibition, meaning current and desired heading are similar. However, due to the CPU4-\nTB1-CPU1 connectivity pattern, when comparing CPU4 to the TB1 signal, the two populations that make up the composite\nmemory are each shifted by one column, increasing the existing offset of both memories caused by the TN cell preferences to", "translation": "将表示连续运动向量的两个正弦波相加后，所得振幅与相移对应的向量就是两运动向量之和（图S6C）。（译注—已核实：上方ψ的中间推导把atan2写成四个逗号分隔参数；按前文x、y定义及下一行完整公式，应为atan2(A sinα+B sinβ, A cosα+B cosβ)。原式作为图像保留。）因此，对两细胞群相应活动求和，可保持准确指向新位置的群体码。\n这些性质对CX有多方面用途：单个TB1正弦信号因抑制反复相减，形成表示归巢向量的稳定CPU4记忆；TN调制正弦振幅则可编码不同速率。\n在两个有角度偏移的向量（θ_h±φ_TN）上测量速度分量，构成一组基，即可追踪平面运动。一般情况下可有全向运动，即头方向（自身参照坐标原点）与运动方向不一致。两分量存于两个独立记忆，即两份CPU4群体，正确对齐正弦波后可求和解码。本模型通过抑制调制正弦波，因此罗盘TB波形不能反转（不能乘负常数）。故只能精确积分部分全向运动，方向范围为φ_TN−π/4至φ_TN+π/4，如“速率第1层”所定义。也可将回路理解为重投影：从相对航向θ_h±φ_TN的自身参照基，投影到相对太阳角θ_TB1±φ_TN的世界参照基；接收同一TB1输入的CPU4，把运动存为其基向量的投影，以π/4间隔的8柱构成冗余记忆。\n将两个离散正弦波逐元素相乘再求和，可以判断相位对齐程度。相连TB1对CPU4活动的抑制，用于估计当前航向（TB1）与期望航向（CPU4）偏差。\n动物旋转时，TB1正弦波相对记忆移动。响应低表示重叠高：高活动细胞均被TB1抑制，意味着当前与期望航向相近。但由于CPU4–TB1–CPU1的连接模式，在比较时，复合记忆的两个群体各偏移一柱，使TN偏好造成的既有偏移增加到", "status": "translated", "notes": [{"type": "verified_error", "sentence_id": "P027-E-N001-S", "text": "（译注—已核实：上方ψ的中间推导把atan2写成四个逗号分隔参数；按前文x、y定义及下一行完整公式，应为atan2(A sinα+B sinβ, A cosα+B cosβ)。原式作为图像保留。）", "basis": "译注—已核实：上方ψ的中间推导把atan2写成四个逗号分隔参数；按前文x、y定义及下一行完整公式，应为atan2(A sinα+B sinβ, A cosα+B cosβ)。原式作为图像保留。", "sources": []}], "sentence_ids": ["P027-E-S001", "P027-E-S002", "P027-E-S003", "P027-E-S004", "P027-E-S005", "P027-E-S006", "P027-E-S007", "P027-E-S008", "P027-E-S009", "P027-E-S010", "P027-E-S011", "P027-E-S012", "P027-E-S013", "P027-E-S014", "P027-E-N001-S"], "min_font_pt": 9, "reading_order": 170}], "assets": [{"id": "P027-E01", "page": 27, "kind": "equation", "bbox": [280, 211, 345, 225], "source_bbox": [280, 211, 345, 225], "source": "原页27公式组1", "asset": "assets\\equation-27-01.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-082.png"}, {"id": "P027-E02", "page": 27, "kind": "equation", "bbox": [130, 265, 551, 314], "source_bbox": [130, 265, 551, 314], "source": "原页27公式组2", "asset": "assets\\equation-27-02.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-083.png"}, {"id": "P027-E03", "page": 27, "kind": "equation", "bbox": [185, 330, 465, 351], "source_bbox": [185, 330, 465, 351], "source": "原页27公式组3", "asset": "assets\\equation-27-03.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-084.png"}, {"id": "P027-E04", "page": 27, "kind": "equation", "bbox": [190, 374, 470, 435], "source_bbox": [190, 374, 470, 435], "source": "原页27公式组4", "asset": "assets\\equation-27-04.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-085.png"}, {"id": "P027-E05", "page": 27, "kind": "equation", "bbox": [165, 449, 550, 483], "source_bbox": [165, 449, 550, 483], "source": "原页27公式组5", "asset": "assets\\equation-27-05.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-086.png"}], "analysis": []}, {"page": 28, "original": "image-087.jpg", "background": "image-088.jpg", "blocks": [{"id": "P028-A", "page": 28, "bbox": [53.1, 99, 544.1, 154], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 99, 544.1, 154], "source": "approximately ± ð p=2Þ. Therefore, a strong alignment with one CPU4 sub-population means the desired heading is approximately\nð p=2Þ to the left, and with the other ð p=2Þ to the right. These two values are combined to drive steering as can be seen in Figures\nS6D–S6F. In the case of f = ð p=4Þ we can prove that the circuit steers correctly. The compound memory can be expressed as\nTN\na function f(q), the sum of two memory sinusoids in the same coordinate space (Figure S6E), where the peak indicates the desired\nheading:", "translation": "约±π/2。因此，与一个CPU4亚群高度对齐，表示期望航向约在左侧π/2；与另一个对齐，则在右侧π/2。两值结合驱动转向（图S6D–S6F）。当φ_TN=π/4时，可证明回路正确转向。复合记忆f(θ)为同一坐标空间内两记忆正弦波之和（图S6E），峰值给出期望航向：", "status": "translated", "notes": [], "sentence_ids": ["P028-A-S001", "P028-A-S002", "P028-A-S003", "P028-A-S004", "P028-A-S005"], "min_font_pt": 9, "reading_order": 173}, {"id": "P028-B", "page": 28, "bbox": [53.1, 175, 544.1, 187], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 175, 544.1, 187], "source": "To find the stationary points which implicitly defines the q corresponding to the desired heading:", "translation": "求驻点即可隐式确定期望航向对应的θ：", "status": "translated", "notes": [], "sentence_ids": ["P028-B-S001"], "min_font_pt": 9, "reading_order": 174}, {"id": "P028-C", "page": 28, "bbox": [53.1, 275, 544.1, 493], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 275, 544.1, 493], "source": "The correct heading is found when both sinusoids are offset by ± p/2 and are equal. This is the case due to the combined f = ð p=4Þ\nTN\nand the additional p/4 columnar offset. However, the circuit still operates robustly with different 4TN values (See results below). At a\ncellular scale, the steering mechanism can also be understood by observing the activity of a single TB1 compass cell, the corre-\nsponding pairs of CPU1 steering cells, and both CPU4 memory cells that connect to them, (Figure S6B). When TB1i = qh - p, it is\nmost inactive, so the CPU4 synapsing on to the corresponding CPU1 will be least suppressed. As the two CPU4 are ± p/2 offset\nfrom the TB1 cell, the memory cells that capture the portion of the home vector pointing in qh ± p/2 will be weighted the most\nwhen steering. If the CPU4 with a preference angle of qh - p/2 is higher than that of the with preference qh + p/2, the agent will\nturn to the left to head home and vice versa. The pontine cells projecting from CPU4 to CPU1 act as an inhibitory stabilizer. In effect\nthis normalizes both memory sinusoids, ensuring they have the same mean activity, meaning one will not dominate due to unbal-\nanced charging by different TN neurons.\nA useful side-effect of this representation is that it becomes trivial to extract a polar coordinate from the population code, e.g., for a\nwaggle dance, by finding the cells with peak activity, while retaining many of the attractive properties of a Cartesian coordinate sys-\ntem [74]. For species that migrate or just want to move in a fixed direction for a while, a permanent or semi-permanent bump in the\nCPU4 cells would cause them to move consistently in that direction. If retrieving previously visited locations and putting them to\nCPU4 memory is possible, then this could be done as either a homebound or outward vector, depending on whether the stored mem-\nory is added or subtracted from a zero-state memory. In addition, a sequence of known paths that link together known landmarks\ncould be sequentially added to memory, resulting in a total home vector, similarly to the addition during normal path integration,\nmeaning the animal could perform shortcuts over previously unvisited terrain. The state of the home vector upon return to the\nnest could potentially also be used as an error signal. By inhibiting a stored vector with the remaining home vector, both the outbound\nand inbound PI estimates could be combined in a weighted manner to provide a more accurate waggle dance.", "translation": "两个正弦波各偏移±π/2且相等时，便找到正确航向。这由φ_TN=π/4加上额外π/4柱偏移实现；其他φ_TN值下回路仍稳健（见下文结果）。从单细胞层面，也可观察一个TB1罗盘细胞、相应CPU1转向细胞对及与它们连接的两个CPU4来理解（图S6B）。当TB1_i=θ_h−π时，其活动最低，突触连接到相应CPU1的CPU4受到的抑制最少。两CPU4相对该TB1偏移±π/2，因此编码指向θ_h±π/2的归巢向量分量的记忆细胞，在转向中权重最高。若偏好θ_h−π/2的CPU4活动高于偏好θ_h+π/2者，智能体左转归巢；反之右转。CPU4经桥接细胞至CPU1的投射起抑制性稳定作用，归一化两记忆正弦波，使均值相同，避免不同TN输入造成不平衡累积、让某一侧占主导。\n这种表示的一个有用附带效应是：寻找活动峰值细胞，便可轻易从群体码提取极坐标，例如用于摇摆舞，同时保留笛卡尔坐标系许多优点[74]。迁飞或暂需固定方向运动的物种，可由CPU4永久或半永久活动隆起维持方向。若能提取曾到访位置并写入CPU4，根据向零状态记忆中加或减已存记忆，可把它作为归巢或外出向量。还可将一串连接已知地标的熟悉路径依次加入记忆，如正常路径积分般相加得总归巢向量，使动物穿越未访问地形走捷径。返巢时残余归巢向量也可能用作误差信号：用残余向量抑制已存向量，可加权结合外出与归巢路径积分估计，产生更准确的摇摆舞。", "status": "translated", "notes": [], "sentence_ids": ["P028-C-S001", "P028-C-S002", "P028-C-S003", "P028-C-S004", "P028-C-S005", "P028-C-S006", "P028-C-S007", "P028-C-S008", "P028-C-S009", "P028-C-S010", "P028-C-S011", "P028-C-S012"], "min_font_pt": 9, "reading_order": 175}, {"id": "P028-D", "page": 28, "bbox": [53.1, 507, 544.1, 749], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 507, 544.1, 749], "source": "A fully holonomic path integrator\nThe described model can successfully capture holonomic movements in a range of ± p/2 deviation of body axis and movement di-\nrection. This is in line with the observation that honeybees maintain a steady head direction aligned with their average flight direction\nduring behavioral experiments. However, bees also perform hovering flights when close to food sources as well as orientation flights\nwhen leaving the nest. During those flight segments, no significant distances are covered. Even though these flight segments are not\nperfectly captured, our model performs with only minor errors when including them in the outbound trajectory. Nevertheless, given\nthat bees perform fully holonomic flight maneuvers, we deemed it desirable to explore the possibility of expanding our model to\nenable integration of those flight segments. In fact, only a single additional assumption must be made to transform our partial holo-\nnomic model into a fully holonomic model, without contradicting anatomical and physiological data. To achieve this, the TB1 activity\nbump, indicating compass direction, must be able to affect CPU4 memory in either an additive or subtractive manner (in the current\nmodel it is purely additive) using the input of all four TN neurons identified in this study (i.e., speed neurons and inverted speed neu-\nrons; Figures 2 and 3). This could be done by the activation from TB1 cells effectively acting as a gating mechanism to either positive\nor negative effects on the memory from opposing TN cells. The implemented results are shown in Figure S7.\nQUANTIFICATION AND STATISTICAL ANALYSIS\nAction potentials were extracted from the recorded voltage traces using threshold based event detection in MATLAB. Only record-\nings with stable baseline were evaluated. Timing of events was then correlated to the recorded stimulus traces by custom designed\nanalysis scripts.\nFor all presented neuron types, numbers of recorded cells can be found in the results section as well as in the figure legends. Within\neach cell type the number of cells always equals the number of bees used.", "translation": "完全全向的路径积分器\n上述模型能成功编码体轴与运动方向偏离±π/2范围内的全向运动，这与行为实验中蜜蜂保持稳定头方向、对准平均飞行方向的观察相符。但蜜蜂接近食源时会悬停，离巢时会定向飞行；这些片段行进距离不大。虽然模型不能完美编码这些片段，把它们纳入外出轨迹仍仅造成小误差。鉴于蜜蜂确实能完全全向飞行，我们仍希望扩展模型以积分这些片段。事实上，只需增加一项假设，即可把部分全向模型变为完全全向模型，且不违背解剖、生理数据：表示罗盘方向的TB1活动隆起，须借助本研究鉴定的全部4个TN（速率及反向速率神经元；图2、3），既能以相加也能以相减影响CPU4记忆（当前模型仅相加）。可令TB1激活有效充当门控，控制相对TN细胞对记忆产生正、负影响。实现结果见图S7。\n定量与统计分析\n用MATLAB阈值事件检测从电位轨迹提取动作电位，仅分析基线稳定的记录，再由定制脚本将事件时间与刺激记录相关联。\n各类神经元的记录数见结果及图注；每种细胞类型中，细胞数始终等于蜂数。", "status": "translated", "notes": [], "sentence_ids": ["P028-D-S001", "P028-D-S002", "P028-D-S003", "P028-D-S004", "P028-D-S005", "P028-D-S006", "P028-D-S007", "P028-D-S008", "P028-D-S009"], "min_font_pt": 9, "reading_order": 176}], "assets": [{"id": "P028-E01", "page": 28, "kind": "equation", "bbox": [235, 157, 390, 170], "source_bbox": [235, 157, 390, 170], "source": "原页28公式组1", "asset": "assets\\equation-28-01.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-089.png"}, {"id": "P028-E02", "page": 28, "kind": "equation", "bbox": [155, 189, 455, 270], "source_bbox": [155, 189, 455, 270], "source": "原页28公式组2", "asset": "assets\\equation-28-02.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-090.png"}], "analysis": []}, {"page": 29, "original": "image-091.jpg", "background": "image-092.jpg", "blocks": [{"id": "P029-BODY", "page": 29, "bbox": [59, 100, 551, 575], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [59, 100, 551, 575], "source": "For optic-flow stimuli each stimulus bout was analyzed independently. Spikes were counted in bins of 0.25 s during stimulation\nintervals and the resulting mean frequencies were plotted for display of individual stimulus responses. To calculate tuning curves,\nthe last 2 s of each stimulus interval was used to compute the mean response frequency for the analyzed condition and plotted\nagainst either stimulus velocity or spatial frequency. Background activity of a neuron was calculated as the mean activity during\n2 s before onset of the first stimulus. For averaging tuning curves, we normalized each individual tuning curve to its maximal value\nand then calculated the mean and standard deviation of each stimulus condition across all recorded neurons of the same type. Mean\nnormalized background activity was calculated accordingly.\nReceptive field mapping was analyzed by finding the number of events during each frame of the display of the moving bar (192\nframes per rotations; 6 s per rotation) and averaging the resulting frequencies over three neighboring frames (resulting bin duration:\nca. 0.1 s). The mean across the two stimulations with identical movement direction was calculated for each bin and the result was low\npass filtered (window-size: 3 bins) to display receptive field responses of individual cells. Filtered data were normalized to peak fre-\nquency and averaged across neurons of the same type. Directional preference was calculated for each azimuth bin by vector addition\nof clockwise and counter-clockwise response strength. The resulting vector was displayed as an arrow, whose length and direction\ncorrespond to the local tuning preference. Mean and individual receptive fields were displayed either as vector maps of local tuning\npreferences projected onto a 32x192 matrix (dimension of LED arena) or as line plots.\nTranslational optic flow with different expansion points was analyzed as for tuning curve analysis of other optic flow stimuli. The\nresulting mean frequencies during each stimulation interval were then displayed in a circular plot against the azimuth of expansion\nof the optic flow. The maximally effective stimulus was calculated by converting the mean spike frequencies of each response to a\ndistribution of azimuth angles (spike frequency = frequency of corresponding azimuth angle in the distribution). The circular mean of\nthis distribution was calculated with the circular statistics package for MATLAB [75].\nPolarized-light stimuli were analyzed by assigning angles (position of the polarizer) to each spike-event. This list of angles was used\nto display data in circular plots (bin size 10(cid:1), converted from spike count to frequency by dividing by bin duration) and to perform\nstatistical analysis in MATLAB. A cell was rated polarization sensitive if the distribution of action potentials during a rotation of the\npolarizer was significantly different from a uniform distribution (Rayleigh test for axial data; alpha level 0.05). Clockwise and\ncounter-clockwise rotations of the polarizer were analyzed separately. Tuning curves were calculated by normalizing each response\nto its peak firing rate, adjusting the minimum firing rate during stimulation to zero, and shifting the curve, so that peak activity coin-\ncided with 0(cid:1) E-vector angle. The width of the tuning curve at half-maximal excitation was taken as the tuning width.\nDATA AND SOFTWARE AVAILABILITY\nAll code used for the described simulation is available at https://github.com/InsectRobotics/path-integration. The neurons have been\ndeposited in the InsectBrainDatabase under the following neuron identification numbers (NINs): NIN-0000061 (TN1-cells left; https://\nwww.insectbraindb.org/neurons/61/), NIN-0000062 (TN1-cells right; https://www.insectbraindb.org/neurons/62/), NIN-0000121\n(TN2-cells, left; https://www.insectbraindb.org/neurons/121/), NIN-0000222 (TN2-cells, right; https://www.insectbraindb.org/\nneurons/222/), NIN-0000100 (TL-cells left; https://www.insectbraindb.org/neurons/100/), NIN-0000221(CPU4-cell; https://www.\ninsectbraindb.org/neurons/221/), and NIN-0000198 and NIN-0000200 (Pontine cell-types; https://www.insectbraindb.org/\nneurons/198/ and https://www.insectbraindb.org/neurons/200/).", "translation": "各段视流刺激独立分析。刺激期间以0.25 s分箱计数脉冲，绘出平均频率以显示单次刺激响应。调谐曲线以各段末2 s平均响应频率，对刺激速率或空间频率作图。背景活动为首次刺激前2 s平均活动。求平均调谐曲线时，先按各个体最大值归一化，再对同类所有记录神经元计算各刺激条件的均值及标准差；归一化背景活动平均值亦同法计算。\n感受野绘制：计数亮条显示每帧中的事件（每圈192帧、6 s），在相邻3帧上平均频率（分箱约0.1 s）。逐箱平均同方向两次刺激，再低通滤波（窗宽3箱），显示单细胞感受野。按峰值归一化滤波数据，再跨同类神经元平均。各方位箱的方向偏好由顺、逆时针响应强度作向量相加求得，以箭头表示，长度、方向对应局部调谐偏好。平均与个体感受野以32×192矩阵（LED场景尺寸）上的局部偏好向量图或折线图表示。\n不同扩张点的平移视流按其他视流调谐曲线同法分析，将各刺激平均频率对视流扩张方位绘于圆图。为求最有效刺激，将响应平均脉冲频率转换为方位角分布（脉冲频率等于该角度在分布中的频数），再用MATLAB圆统计工具包[75]求圆均值。\n偏振刺激：为每个脉冲事件赋予偏振片角位置，用此角列表画圆图（10°分箱，以脉冲数除分箱时长转成频率）并在MATLAB做统计。若偏振片旋转中动作电位分布显著偏离均匀分布，则判细胞偏振敏感（轴向数据Rayleigh检验，α=0.05）。顺、逆时针旋转分开分析。调谐曲线按各响应峰值放电率归一化，将刺激中最小率调至零，再移动曲线，使峰值对应0°电矢量角。半最大兴奋处的宽度即调谐宽度。\n数据与软件可用性\n全部仿真代码见 https://github.com/InsectRobotics/path-integration。神经元存于InsectBrainDatabase，识别号如下：NIN-0000061（左TN1，https://www.insectbraindb.org/neurons/61/）；NIN-0000062（右TN1，/neurons/62/）；NIN-0000121（左TN2，/neurons/121/）；NIN-0000222（右TN2，/neurons/222/）；NIN-0000100（左TL，/neurons/100/）；NIN-0000221（CPU4，/neurons/221/）；NIN-0000198及NIN-0000200（桥接细胞类型，/neurons/198/、/neurons/200/；以上简写路径均位于https://www.insectbraindb.org）。", "status": "translated", "notes": [], "sentence_ids": ["P029-BODY-S001", "P029-BODY-S002", "P029-BODY-S003", "P029-BODY-S004", "P029-BODY-S005", "P029-BODY-S006", "P029-BODY-S007", "P029-BODY-S008", "P029-BODY-S009", "P029-BODY-S010", "P029-BODY-S011", "P029-BODY-S012", "P029-BODY-S013", "P029-BODY-S014", "P029-BODY-S015", "P029-BODY-S016", "P029-BODY-S017", "P029-BODY-S018", "P029-BODY-S019"], "min_font_pt": 9, "reading_order": 177}], "assets": [], "analysis": []}], "width": 602.986, "height": 782.986, "pdf_file": "Stone2017_全文中英对照.pdf"},U=4/3,W=DATA.width*U,H=DATA.height*U;let current=1,expanded=true;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

window.prepareParallelExport=async()=>{document.querySelectorAll('.note').forEach(n=>n.classList.remove('collapsed'));document.querySelectorAll('.pair-section').forEach(s=>s.hidden=false);const pw=W*2+18;let st=document.createElement('style');st.textContent='@page{size:'+pw+'px '+H+'px;margin:0}html,body{margin:0!important;padding:0!important;width:'+pw+'px!important;background:white!important}header,.about,.label,.context,.footnote{display:none!important}.workspace{padding:0!important;overflow:visible!important;width:'+pw+'px!important}.pair-section{display:block!important;min-width:0!important;width:'+pw+'px!important;height:'+H+'px!important;margin:0!important;break-after:page!important;break-inside:avoid!important}.pair-section:last-child{break-after:auto!important}.pair{width:'+pw+'px!important;height:'+H+'px!important;gap:18px!important}.sheet-wrap{width:'+W+'px!important;height:'+H+'px!important}.sheet{transform:none!important;box-shadow:none!important}.map-hit{display:none!important}.block.selected{outline:none!important;background:transparent!important}.note-body{display:inline!important}';document.head.append(st);let m=fitAll();return{width_px:pw,height_px:H,pages:29,overflow_count:m.filter(x=>x.overflow).length}};
const originalMarkup=markup;markup=function(s){return originalMarkup(s).replace(/https?:\/\/[A-Za-z0-9./?=_%#&:+~-]+/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>').replace(/公开代码/g,'<a href="https://github.com/InsectRobotics/path-integration/blob/master/cx_rate.py" target="_blank" rel="noopener">公开代码</a>')};
function addAnalysis(){const origins={analyst_summary:'译者梳理',author_interpretation:'作者假设与解释',analyst_inference:'分析者判断',proposed_check:'阅读建议 · 尚未执行'};for(const pg of DATA.pages){if(!pg.analysis?.length)continue;const section=document.querySelector('.pair-section[data-page="'+pg.page+'"]');const label=section.querySelectorAll('.label b')[1];label.textContent=pg.page===16?'中文译文＋阅读分析':'译者阅读分析';section.querySelectorAll('.label span')[1].textContent='非原文译文 · 有证据定位';for(const s of pg.analysis){const el=document.createElement('div');el.className='block analysis-card '+s.style;el.dataset.id=s.id;el.dataset.font=s.font_pt;el.dataset.min=s.min_font_pt;box(el,s.bbox);const content=document.createElement('div');content.className='analysis-content';content.innerHTML='<h3>'+esc(s.title)+'<span class="origin">'+esc(origins[s.origin])+'</span></h3>'+s.body.split('\n').map(t=>'<p>'+esc(t)+'</p>').join('')+(s.locator?'<div class="locator">'+esc(s.locator)+'</div>':'');if(s.style!=='title'){const b=document.createElement('button');b.className='evidence-jump';b.textContent='查看证据 →';const id=s.source_ids[0];const target=DATA.pages.find(p=>p.blocks.some(b=>b.id===id));b.onclick=()=>{page(target.page);selectBlock(id)};(content.querySelector('.locator')||content).append(b)}el.append(content);section.querySelector('.zh-sheet').append(el)}let detail=section.querySelector('.context');detail.hidden=false;detail.querySelector('summary').textContent='本页译文与阅读分析（分析依据前文证据）';for(const s of pg.analysis){let d=document.createElement('div');d.innerHTML='<h3>'+esc(s.title)+'</h3><p style="white-space:pre-line">'+esc(s.body)+'</p><p>'+esc(s.locator)+'</p>';section.querySelector('.contexts').append(d)}}const btn=document.createElement('button');btn.id='analysis-jump';btn.textContent='阅读分析';btn.onclick=()=>page(17);document.querySelector('.tools').insertBefore(btn,$('#notes'))}
create();addAnalysis();zoom('fit');document.fonts.ready.then(async()=>{await Promise.all([...document.images].map(i=>i.decode()));fitAll();const n=Number(new URLSearchParams(location.hash.slice(1)).get('page'));if(n)page(n);window.viewerReady=true});
</script>

<script id="online-pdf-download">
(()=>{const a=document.getElementById('download-pdf');let busy=false;a.addEventListener('click',async e=>{e.preventDefault();if(busy)return;busy=true;const label=a.textContent;a.textContent='正在准备 PDF…';try{const parts=await Promise.all(['paper.part01','paper.part02'].map(async p=>{const r=await fetch(p);if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()}));const blob=new Blob(parts,{type:'application/pdf'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='Stone2017_全文中英对照.pdf';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(err){alert('PDF 下载未完成，请检查网络后重试。')}finally{a.textContent=label;busy=false;}});})();
</script></body></html>
