箭头为当前航向，黑箭头为记忆目标方向。CPU1比较抑制性TB1与兴奋性CPU4活动；两者投射的一柱偏移使CPU1总输出失衡，启动朝目标转向。桥接细胞活动与CPU4相同（未画），通过抑制反向调谐细胞，对各CPU4群体记忆输出作减法归一化。\n转向信号的数学说明见图S6B–S6D；缩写见图1。另见图S4–S6。", "status": "translated", "notes": [], "sentence_ids": ["P012-CAPTION-S001", "P012-CAPTION-S002", "P012-CAPTION-S003", "P012-CAPTION-S004", "P012-CAPTION-S005", "P012-CAPTION-S006", "P012-CAPTION-S007", "P012-CAPTION-S008", "P012-CAPTION-S009", "P012-CAPTION-S010", "P012-CAPTION-S011", "P012-CAPTION-S012", "P012-CAPTION-S013", "P012-CAPTION-S014", "P012-CAPTION-S015", "P012-CAPTION-S016", "P012-CAPTION-S017", "P012-CAPTION-S018", "P012-CAPTION-S019"], "min_font_pt": 8, "reading_order": 31}], "assets": [], "analysis": []}, {"page": 13, "original": "image-030.jpg", "background": "image-031.jpg", "blocks": [{"id": "P013-CAPTION", "page": 13, "bbox": [59.8, 681, 550.8, 750], "kind": "caption", "font_pt": 8.5, "source_bbox": [59.8, 681, 550.8, 750], "source": "Figure 6. The Biologically Constrained Circuit Successfully Performs Path Integration\n(A) Example trace: the agent is driven on a random outbound journey (variable speed; 1,500 steps), during which the circuit accumulates memory. For return, the\nsteering cells guide the agent back to its origin. Close to the nest, the agent automatically initiates searching behavior, similar to path-integrating insects.\n(B) Activity of all neurons in the circuit over time during the trial in (A). Each cell is represented by one line over time. Cells of the same type are arranged according\nto columnar identity, revealing activity bumps within the protocerebral bridge (PB). Neural noise: 10%; firing rate is normalized to peak rate within each cell type.\nCell indices correspond to columns of the PB according to Figure 5A.\n(legend continued on next page)", "translation": "图6　受生物学约束的回路成功实现路径积分\n(A) 轨迹示例：智能体变速随机外出1,500步，回路同时累积记忆。返回时，转向细胞引导其回到起点；接近巢穴时自动开始搜索，类似使用路径积分的昆虫。\n(B) (A)试验中全部神经元随时间的活动。每条线表示一个细胞，同类细胞按柱身份排列，显示 PB 的活动隆起。神经噪声10%；放电率按各细胞类型峰值归一化。细胞索引对应图5A的 PB 柱。图注续下页。", "status": "translated", "notes": [], "sentence_ids": ["P013-CAPTION-S001", "P013-CAPTION-S002", "P013-CAPTION-S003", "P013-CAPTION-S004", "P013-CAPTION-S005", "P013-CAPTION-S006", "P013-CAPTION-S007"], "min_font_pt": 8, "reading_order": 32}], "assets": [{"id": "P013-FIG6", "kind": "figure", "bbox": [59, 99, 551, 680], "source": "Figure 6（图内英文标签保留）", "uri": "image-032.jpg"}], "analysis": []}, {"page": 14, "original": "image-033.jpg", "background": "image-034.jpg", "blocks": [{"id": "P014-LEFT", "page": 14, "bbox": [53.1, 100, 293.1, 676], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [53.1, 100, 293.1, 676], "source": "be able to address how the CX circuitry has adapted to the\ndemands of specific habitats and illuminate quantitative differ-\nences in the sensory encoding of information underlying naviga-\ntion behavior.\nHead-direction encoding has been firmly established as a\nfunctional feature of the Drosophila PB [8, 38–40], and ring attrac-\ntor dynamics have been experimentally demonstrated to underlie\nthis direction code [38–40]. Our model of a TB1-neuron-based\nring attractor complements these recent models of Drosophila\nring attractors, which are based on recurrent connections\nbetween the CBL and the PB (via E-PG and P-EN neurons\n[39, 52]). Specifically, it suggests a basis for the global inhibition\nacross the PB that was postulated in those models. Whether\nthe ring attractor circuit in the bee also includes homologous\ncounterparts of the recurrent E-PG and P-EN neurons from\nDrosophila (called CL1 and CL2 neurons in other insects) remains\nto be shown, but circuitry to maintain the bump in the temporary\nabsence of external input, and to shift it according to cues for self-\nrotation, would be fully consistent with our model. We simply as-\nsume that external compass input dominates when available, as\nit is not subject to cumulative drift. More importantly, our model\ncircuit provides a first account of how the head-direction code\npresent in the PB can be used to drive behavior. Nevertheless,\nas this recent work shows, there is still much to be discovered\nabout the functional capacities of this circuit.\nThe proposed model of path integration relates to several pre-\nvious hypothetical neural models. The concept of a head-direc-\ntion circuit controlling (speed-dependent) accumulation of activ-\nity on a circular array of units, producing a ‘‘distributed’’ home\nvector, has been used in several computational models, utilizing\nvastly different numbers of directional memory units (from 3 to\n100) [53–58]. As discussed in [5], this encoding can be consid-\nered a redundant or generalized form of Cartesian encoding\n(i.e., using more than 2 axes), particularly if the head-direction\nencoding used across the units is a cosine function of direction.\nCartesian encoding (taking the sine and cosine of the movement\nvector and keeping a running sum of each) was first suggested\ntheoretically as a ‘‘bi-component’’ model [59] and implemented\nin a neural model three decades later [60]. All these models differ\nin how the homing control is achieved. Most similar to the mech-\nanism proposed here is that described in [53], which also acti-\nvates sets of left and right steering cells by the combination of\nthe current direction and a right- or left-shifted memory to deter-\nmine whether right or left rotation by the agent will improve the\nmatch between the current heading and the home vector. How-\never, conceptually, our circuit can be better interpreted in the\nterms proposed in [48]. In that model, the current direction is rep-\nresented as a sinusoidal activity pattern across an array of neu-\nrons. A corresponding memory array accumulates these inputs,\nat a rate corresponding to speed. The resulting memory activity\nis thus also a sinusoid, with the home vector direction repre-", "translation": "能够回答 CX 回路如何适应特定生境，并揭示导航信息感觉编码上的定量差异。\n头方向编码已被确立为果蝇 PB 的一项功能[8,38–40]；实验也证实环形吸引子动力学支撑这一方向码[38–40]。我们基于 TB1 的环形吸引子，补充了近期基于 CBL 与 PB 之间循环连接（经 E-PG、P-EN 神经元[39,52]）的果蝇模型。具体而言，它为这些模型假定的 PB 全局抑制提供了可能基础。蜂的环形吸引子是否也包含果蝇循环连接 E-PG、P-EN 的同源细胞（其他昆虫称 CL1、CL2），仍待证实；但在外部输入短暂缺失时维持活动隆起、并根据自身旋转线索移动隆起的回路，与本模型完全相容。我们只是认为外部罗盘可用时居主导，因为其不产生累积漂移。更重要的是，本模型首次说明 PB 头方向码如何驱动行为。不过近期工作也显示，这一回路的功能潜力仍有大量未知。\n本路径积分模型与若干已有假说性神经模型相关。用头方向回路控制环形单元阵列中依赖速率的活动累积、形成“分布式”归巢向量的思想，已被多种模型采用，方向记忆单元数从3到100不等[53–58]。如[5]所述，这种编码可视为笛卡尔编码的冗余或推广形式，即使用两条以上坐标轴；当各单元头方向编码为方向余弦函数时尤其如此。笛卡尔编码对运动向量求正弦、余弦并分别持续求和，最初作为“双分量”理论模型提出[59]，三十年后由神经模型实现[60]。这些模型的归巢控制方式不同。最接近本文的是[53]：结合当前方向和向左或向右偏移的记忆，激活左右转向细胞群，判断向哪侧旋转更能匹配当前航向与归巢向量。但概念上，我们的回路更适合用[48]解释。其模型以神经元阵列上的正弦活动表示当前方向，相应记忆阵列按速率累积输入；结果仍为正弦，归巢向量方向由", "status": "translated", "notes": [], "sentence_ids": ["P014-LEFT-S001", "P014-LEFT-S002", "P014-LEFT-S003", "P014-LEFT-S004", "P014-LEFT-S005", "P014-LEFT-S006", "P014-LEFT-S007", "P014-LEFT-S008", "P014-LEFT-S009", "P014-LEFT-S010", "P014-LEFT-S011", "P014-LEFT-S012", "P014-LEFT-S013", "P014-LEFT-S014", "P014-LEFT-S015", "P014-LEFT-S016"], "min_font_pt": 9, "reading_order": 33}, {"id": "P014-RIGHT", "page": 14, "bbox": [304.1, 100, 544.1, 676], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [304.1, 100, 544.1, 676], "source": "sented by the phase and home vector length by the amplitude.\nThe readout for steering in that model involves cells that ‘‘have\nreceptive fields on both neuron arrays (current direction and\nmemory) that are displaced relative to one another’’ [48] to\ndetect deviation to the left or right. Strikingly, our model, which\nwas derived from anatomical considerations, essentially differs\nfrom this model only in its use of two memory arrays, receiving\northogonal speed inputs, which enables holonomic path integra-\ntion as described above.\nBesides suggesting functional relevance for anatomical\nfeatures of the insect CX and implementing a model for path inte-\ngration completely constrained by CX anatomy, our model pro-\nduces a range of concrete predictions that open up multiple\nnew lines of structural, physiological, and behavioral research.\nFirst, because the CPU4 columnar cells are the proposed phys-\nical substrate for path integration memory, this suggests mem-\nory capacity is linked to the number of parallel CPU4 neurons\nper CX column. Thus, path-integrating insects should, in princi-\nple, have more CPU4 cells compared to species with different\nnavigational strategies. This is also applicable if males and\nfemales of the same species differ in their behavioral strategy,\nas is frequently the case in bees. Second, as the homing vector\nis hypothesized to be represented by ongoing recurrent neural\nactivity, the path integration memory should be less stable\ncompared to memory laid down by synaptic remodeling (e.g.,\nin the mushroom body) and thus be more prone to experimental\ndisturbance, e.g., via brain cooling at the beginning of a homing\nflight. Third, physiologically, our network predicts that, during\npath integration, the activities of CPU4 cells and pontine cells\nshould increase over time and specific patterns of activity across\nthe CX result from specific outbound flights. Although it would\nnot be trivial to generate the right motivational and behavioral\nconditions, these patterns, and the accumulation of activity,\nare in principle observable by electrophysiology or functional\nimaging. Finally, our model can also be tested in behavioral\nexperiments. Manipulating optic flow to introduce controlled\nbiases during outbound routes (e.g., generating the impression\nof continuous backward flight or excessive flight speed) as well\nas direct manipulations of neuronal activity, e.g., via current in-\njection, can be used to mimic conditions that break our model\nin simulations in predictable ways (Figure S7).\nIn a broader context, the proposed circuit compares the\nanimal’s current heading with its desired heading and initiates\ncompensatory steering commands in case of a mismatch. The\nsame model circuit, with fewer recurrent CPU4 neurons per CX\ncolumn, could store an ongoing direction of movement, allowing\nsteering back to the desired direction in case of disturbance [61,\n62]. Alternatively, CPU4 neurons could permanently encode the\nmigratory heading of long-distance navigators, such as the mon-\narch butterfly. Furthermore, during all behavioral episodes where\nCPU4 neuron activity (e.g., encoding path integration memory)", "translation": "相位表示，长度由振幅表示。该模型中，转向读出细胞在当前方向与记忆两个神经元阵列上具有彼此相对位移的感受野[48]，以检测左右偏差。值得关注的是，由解剖推导的本模型与它实质上仅差在使用两个接收正交速率输入的记忆阵列，从而如前所述实现全向路径积分。\n除解释 CX 解剖的功能意义、实现完全受其解剖约束的路径积分外，模型还给出一系列具体预测，开辟结构、生理和行为研究的新方向。首先，若柱状 CPU4 是路径积分记忆的物质基础，记忆容量便应与每柱并行 CPU4 数量相关。因此，原则上，依赖路径积分的昆虫应比采用其他导航策略的物种有更多 CPU4；同种雌雄行为策略不同（蜂类中常见）时也适用。第二，归巢向量若由持续循环神经活动表示，则路径积分记忆应不如通过突触重塑形成的记忆（如蘑菇体记忆）稳定，更易受实验干扰，例如在归巢飞行开始时冷却脑。第三，生理上，网络预测路径积分期间 CPU4 与桥接细胞活动随时间增加，特定外出飞行在 CX 中产生特定活动模式。虽不易创造适当动机和行为条件，原则上仍可用电生理或功能成像观察这些模式与活动累积。最后，可通过行为实验检验模型：在外出时操纵视流引入受控偏差（如造成持续后飞或过高速率的错觉），以及通过注入电流等直接操控神经活动，模拟那些在仿真中以可预测方式使模型失效的条件（图S7）。\n更广泛地说，这一回路比较当前航向与期望航向，不匹配时发出补偿性转向指令。同样的回路若每柱具有更少的循环连接 CPU4，可以存储当前持续的运动方向，在受扰后转回期望方向[61,62]。或者，CPU4 可永久编码帝王蝶等长距离导航动物的迁飞航向。此外，在 CPU4 活动（如路径积分记忆）", "status": "translated", "notes": [], "sentence_ids": ["P014-RIGHT-S001", "P014-RIGHT-S002", "P014-RIGHT-S003", "P014-RIGHT-S004", "P014-RIGHT-S005", "P014-RIGHT-S006", "P014-RIGHT-S007", "P014-RIGHT-S008", "P014-RIGHT-S009", "P014-RIGHT-S010", "P014-RIGHT-S011", "P014-RIGHT-S012", "P014-RIGHT-S013", "P014-RIGHT-S014"], "min_font_pt": 9, "reading_order": 34}, {"id": "P014-CAPTION", "page": 14, "bbox": [53.1, 681, 544.1, 750], "kind": "caption", "font_pt": 8.5, "source_bbox": [53.1, 681, 544.1, 750], "source": "(C) Same outbound route as in (A) but obstacles present during homing.\n(D and E) Performance of the circuit during longer outbound journeys. After correct homing for up to 5,000-step-long outbound routes (D), the agent begins to\nundershoot during the inbound journey while maintaining the correct heading during longer runs (E). This indicates that memory capacity is exceeded during the\noutbound journey.\n(F) Example trace of robot path integration trial. Line, trajectory of the robot; circles, position estimate based on CPU4 neuron readout. The inset shows the robotic\nplatform for circuit implementation.\nSee also Figures S6 and S7.", "translation": "(C) 外出路径同(A)，但返程有障碍物。\n(D、E) 更长外出行程的表现。外出达5,000步仍可准确归巢(D)；更长行程开始在返程距离上不足，但航向仍正确(E)，说明外出时超出了记忆容量。\n(F) 机器人路径积分试验轨迹。实线为实际轨迹，圆圈为 CPU4 读出的位置估计；插图为机器人平台。另见图S6、S7。", "status": "translated", "notes": [], "sentence_ids": ["P014-CAPTION-S001", "P014-CAPTION-S002", "P014-CAPTION-S003", "P014-CAPTION-S004", "P014-CAPTION-S005", "P014-CAPTION-S006"], "min_font_pt": 8, "reading_order": 35}], "assets": [], "analysis": []}, {"page": 15, "original": "image-035.jpg", "background": "image-036.jpg", "blocks": [{"id": "P015-CAPTION", "page": 15, "bbox": [59.8, 583, 550.8, 750], "kind": "caption", "font_pt": 8.5, "source_bbox": [59.8, 583, 550.8, 750], "source": "Figure 7. The Proposed Path Integration Circuit Is Resilient to Disturbance\n(A) Performance during increasingly longer outbound journeys and increasing neural noise. Closest distance to nest during homing (mean ± SD from 1,000 runs) is\nplotted against length of outbound journey.\n(B) Distribution of angular deviations from true home after initiation of steering (10(cid:1) bins; 1,000 trials) for different noise levels (colors as in A).\n(C) Deviation from the best possible route (straight line) during homing (10% noise). C, distance covered toward the nest after L steps (L, straight-line distance to\nnest); L/C, path tortuosity (average: 1.150).\n(D–I) Responses to disturbances reveal the robustness of the circuit. Plotted is the closest distance to home during homing after a 1,500-step random outbound\nroute against different types of disturbances (mean ± SD). Dashed gray line, 20-step home range used to illustrate successful homing. (D) Stochastic noise in the\nsigmoids of each neuron. The 0.1 level was also used for all remaining trials (blue curves; green curves are without sigmoid noise). (E) Effect of randomly varying\nsynaptic weights. (F) Effect of shifting clockwise and counter-clockwise preference angles of compass signal. The orange line indicates the value found for\nMegalopta compass neurons (Figure 1). (G) Effect of deviation of translational optic flow preference axis from the bee’s body axis in TN2 neurons. The orange line\nindicates the average value obtained in Megalopta TN neurons (Figure 3). (H) Effect of actual speed exceeding capacity of speed neuron (TN2) coding range.\nRight: example routes show that the agent undershoots but maintains the correct heading when speed neurons saturate during outbound route. (I) Effect of\nlow-pass filtering of the speed signal (as found for TN1 neurons). Right: example showing how a smoothed speed signal affects homing.", "translation": "图7　候选路径积分回路能够抵抗扰动\n(A) 外出行程延长、神经噪声增大时的表现：归巢中离巢最近距离（1,000次均值±SD）与外出路径长度的关系。\n(B) 启动转向后，相对真实归巢方向的角偏差分布（10°分箱；1,000次；颜色表示噪声水平，同A）。\n(C) 归巢路径相对最优直线的偏离（10%噪声）。L为至巢直线距离，C为走L步后朝巢推进的距离；L/C为曲折度，均值1.150。\n(D–I) 扰动响应揭示回路稳健性。随机外出1,500步后，归巢最近距离随不同扰动的变化（均值±SD）。灰虚线为表示归巢成功的20步范围。(D)各神经元 sigmoid 中的随机噪声；其余测试亦采用0.1（蓝线；绿线无此噪声）。(E)突触权重随机变化。(F)偏移罗盘顺、逆时针偏好角；橙线为 Megalopta 实测值（图1）。(G)TN2 平移视流偏好轴偏离体轴；橙线为 Megalopta TN 平均值（图3）。(H)实际速率超过TN2编码范围；右侧轨迹显示外出时速率神经元饱和导致返程不足但航向正确。(I)对速率信号低通滤波的影响（如TN1）；右侧示平滑信号如何影响归巢。", "status": "translated", "notes": [], "sentence_ids": ["P015-CAPTION-S001", "P015-CAPTION-S002", "P015-CAPTION-S003", "P015-CAPTION-S004", "P015-CAPTION-S005", "P015-CAPTION-S006", "P015-CAPTION-S007", "P015-CAPTION-S008", "P015-CAPTION-S009", "P015-CAPTION-S010", "P015-CAPTION-S011", "P015-CAPTION-S012", "P015-CAPTION-S013"], "min_font_pt": 8, "reading_order": 36}], "assets": [{"id": "P015-FIG7", "kind": "figure", "bbox": [59, 99, 551, 581], "source": "Figure 7（图内英文标签保留）", "uri": "image-037.jpg"}], "analysis": []}, {"page": 16, "original": "image-038.jpg", "background": "image-039.jpg", "blocks": [{"id": "P016-LEFT", "page": 16, "bbox": [53, 100, 293, 749], "kind": "paragraph", "font_pt": 10, "source_bbox": [53, 100, 293, 749], "source": "does not drive behavior (e.g., on the outward exploratory route),\nit is necessary that memory and steering are decoupled. Our pro-\nposed steering mechanism could meanwhile compare the cur-\nrent heading encoded in the PB with other information arriving\nat the dendritic trees of CPU1 neurons in the CBU. In line with\nthis idea, the CBU receives input from many areas of the insect\nbrain [33, 35, 63], which could deliver information about the\nanimal’s desired heading in different sensory/motivational con-\ntexts. Our model circuit could therefore support any situation\nin which the animal needs to adjust its current direction to\nmatch some ‘‘desired’’ direction, e.g., alignment with a land-\nmark, through the same ‘‘compare the match for left and right\nrotation’’ principle. This implies that the input to CPU1 from\nCPU4 can be switched off (gating the use of the home vector)\nor is affected by other contextual, motivational, or sensory infor-\nmation, most likely within the CBU. Whereas there is no direct\nevidence for this state-dependent (exploring versus homing)\nswitch in active synaptic transmission, there is strong evidence\nfor state-dependent change in neural signaling in the CX in gen-\neral [19, 64], combined with a rich variety of neuromodulator\nexpression in this region [65, 66]. This simple expansion of\nour model could thus also explain behaviors such as steering\ntoward landmarks, choosing between targets, and following\nroutes and may additionally provide a basis for combining\ndiverse directional cues into a single coherent action.\nSTAR+METHODS\nDetailed methods are provided in the online version of this paper\nand include the following:\nd KEY RESOURCES TABLE\nd CONTACT FOR REAGENT AND RESOURCE SHARING\nd EXPERIMENTAL MODEL AND SUBJECT DETAILS\nd METHOD DETAILS\nB Visual stimulation\nB Electrophysiology\nB Histology for light microscopy\nB Block-face electron microscopy\nB Imaging and image processing\nB Simulation Methods\nB Detailed model assumptions\nB Probing the limits of the path integration circuit\nB Testing of the model in an agent simulation\nB Testing of the model in a robotic implementation\nB Mathematical framework\nB A fully holonomic path integrator\nd QUANTIFICATION AND STATISTICAL ANALYSIS\nd DATA AND SOFTWARE AVAILABILITY\nSUPPLEMENTAL INFORMATION\nSupplemental Information includes seven figures and three movies and can be\nfound with this article online at http://dx.doi.org/10.1016/j.cub.2017.08.052.\nAUTHOR CONTRIBUTIONS\nS.H. designed the study, and T.S., S.H., and B.W. developed the concept of\nthe manuscript; S.H. and A.H. performed electrophysiological and anatomical\nwork; S.H. analyzed the physiological data; T.S., N.B.W., B.W., and A.A. car-", "translation": "不驱动行为的阶段（如外出探索），记忆与转向必须解耦。此时我们提出的转向机制可比较 PB 编码的当前航向，与到达 CBU 中 CPU1 树突的其他信息。与此一致，CBU 接收昆虫脑许多区域的输入[33,35,63]，可能传递不同感觉/动机情境中的期望航向。因此，只要动物需调整当前方向以匹配某种“期望”方向（如对准地标），模型便可利用同一“比较左右旋转匹配程度”的原理提供支持。这意味着 CPU4→CPU1 输入可被关闭（门控归巢向量的使用），或受其他情境、动机、感觉信息影响，最可能发生于 CBU。虽然尚无这种依赖状态（探索或归巢）的突触传递开关的直接证据，但 CX 的神经信号随状态改变已有强证据[19,64]，且该区域表达多种神经调质[65,66]。因此，简单扩展本模型便可能解释朝向地标转向、目标选择与路线跟随，并为多种方向线索整合成一致行动提供基础。\nSTAR+METHODS　详细方法\n详细方法见本文在线版本，包括：\n• 关键资源表；试剂与资源共享联系信息；实验模型与研究对象。\n• 方法细节：视觉刺激；电生理；光镜组织学；块面电子显微成像；成像与图像处理；仿真方法；详细模型假设；路径积分回路极限测试；智能体仿真测试；机器人实现测试；数学框架；完全全向路径积分器。\n• 定量与统计分析；数据与软件可用性。\n补充信息\n补充材料含7张图和3个视频，可在本文在线页面获取：http://dx.doi.org/10.1016/j.cub.2017.08.052。\n作者贡献\nS.H.设计研究；T.S.、S.H.、B.W.提出论文构想；S.H.与A.H.完成电生理和解剖工作；S.H.分析生理数据；T.S.、N.B.W.、B.W.、A.A.", "status": "translated", "notes": [], "sentence_ids": ["P016-LEFT-S001", "P016-LEFT-S002", "P016-LEFT-S003", "P016-LEFT-S004", "P016-LEFT-S005", "P016-LEFT-S006", "P016-LEFT-S007", "P016-LEFT-S008", "P016-LEFT-S009", "P016-LEFT-S010", "P016-LEFT-S011", "P016-LEFT-S012"], "min_font_pt": 9, "reading_order": 37}, {"id": "P016-RIGHT", "page": 16, "bbox": [304, 100, 544, 466], "kind": "paragraph", "font_pt": 9.5, "source_bb uld\nlike to acknowledge the facilities and the scientific and technical assistance\nof the Australian Microscopy and Microanalysis Research Facility at the Centre\nfor Microscopy and Microanalysis, The University of Queensland, especially\nRobyn Chapman for technical assistance.\nReceived: May 8, 2017\nRevised: July 24, 2017\nAccepted: August 21, 2017\nPublished: October 5, 2017", "translation": "完成计算回路建模；R.T.完成电镜与块面成像；L.S.设计并完成机器人实验。S.H.、T.S.、B.W.撰文并设计图件；W.W.、E.W.、A.A.、A.H.、N.B.W.、B.W.、R.T.、T.S.、S.H.审阅文稿，对最终形式及内容作出重要贡献。\n致谢\n本研究获得以下资助：S.H.获瑞典研究理事会（VR，621-2012-2213）、玛丽·居里欧洲内部研究基金（327901）及欧盟“地平线2020”研究创新计划下欧洲研究理事会（ERC，714599）资助；A.H.获 Wenner-Gren 基金会支持；Justin Marshall 获澳大利亚研究基金及美国空军科学研究办公室（AFOSR）支持，用于资助R.T.；E.W.获 VR（FA8655-07-C-4011）、AFOSR（2012-02205）及 Knut and Alice Wallenberg 基金会（KAW 2011.0062）支持；B.W.部分获爱丁堡大学信息学院神经信息学与计算神经科学博士培训中心项目 EP/F500385/1、BB/F529254/1，以及英国工程与自然科学研究理事会（EPSRC，EP/F500385/1）、生物技术与生物科学研究理事会（BBSRC，BB/F529254/1）和医学研究理事会（MRC）支持（http://www.anc.ed.ac.uk/dtc/）。本研究使用了爱丁堡计算与数据设施（ECDF，http://www.ecdf.ed.ac.uk）的资源，后者获 eDIKT 计划（http://www.edikt.org.uk）支持。感谢史密森热带研究所（STRI）的后勤支持，特别是 Julia Schuckel 协助捕蜂与搭建记录装置，以及 Jennifer 和 Greg Johnson 对 STRI 的慷慨资助。感谢 Johanna Chavez、Henrik Martenzon、David Szakal 的神经元追踪工作。最后感谢昆士兰大学显微与微分析中心的澳大利亚显微与微分析研究设施所提供的设备、科学和技术协助，特别感谢 Robyn Chapman 的技术帮助。\n收稿：2017年5月8日；修订：2017年7月24日\n接受：2017年8月21日；发表：2017年10月5日", "status": "translated", "notes": [], "sentence_ids": ["P016-RIGHT-S001", "P016-RIGHT-S002", "P016-RIGHT-S003", "P016-RIGHT-S004", "P016-RIGHT-S005", "P016-RIGHT-S006", "P016-RIGHT-S007", "P016-RIGHT-S008"], "min_font_pt": 9, "reading_order": 38}], "assets": [], "analysis": [{"id": "RA01", "display_page": 16, "bbox": [304, 477, 544, 749], "title": "译者阅读分析", "body": "非原文译文 · 阅读分析 1/3\n这篇论文把“蜜蜂如何返巢”拆成三个可连接的问题：感知朝向、累积运动、读出转向。\n核心贡献是提出一套与已知解剖结构相容、能够运行的CX回路，并用新记录和电镜证据约束其中部分环节。\n阅读时最需分清：TN的速率响应及其突触联系有实验支撑；CPU4持续记忆、桥接抑制和行为状态门控仍包含假设。\n下一页：研究主线、机制与证据。\n再下一页：关键假设、边界与核查建议。\n分析框架参考 norman-paper-reading；分析由本翻译流程生成。", "source_ids": ["P007-RIGHT", "P009-RIGHT", "P025-BODY"], "locator": "依据：原文第7、9、25页。", "origin": "analyst_summary", "style": "intro", "font_pt": 10, "min_font_pt": 9.5}]}, {"page": 17, "original": "image-040.jpg", "background": "image-041.jpg", "blocks": [], "assets": [], "analysis": [{"id": "RA02", "display_page": 17, "bbox": [59, 100, 551, 158], "title": "译者阅读分析｜研究主线与证据", "body": "非原文译文 · 阅读分析 2/3　　以下为通读后的解释，不是左侧参考文献的译文。", "source_ids": ["P009-RIGHT", "P010-LEFT"], "locator": "", "origin": "analyst_summary", "style": "title", "font_pt": 11, "min_font_pt": 10}, {"id": "RA03", "display_page": 17, "bbox": [59, 169, 551, 252], "title": "01　研究问题：感觉信号怎样变成归巢向量？", "body": "蜂类可以用天空罗盘确定航向，用视流估计行进量。论文要解释的是：这两类信息在脑内何处汇聚，如何累积成持续更新的归巢向量，又如何直接控制转向。作者以CX的保守结构为约束，将细胞生理、解剖连接与可运行模型接在同一条证据链上。", "source_ids": ["P002-SUMMARY", "P007-RIGHT", "P009-LEFT"], "locator": "定位：原文第2页摘要；第7、9页回路依据。", "origin": "analyst_summary", "style": "card", "font_pt": 10.5, "min_font_pt": 10}, {"id": "RA04", "display_page": 17, "bbox": [59, 263, 551, 376], "title": "02　机制：方向编码 → 分布式记忆 → 转向比较", "body": "输入：TL/CL1提供罗盘信息，TB1形成稳定的方向活动隆起；TN提供左右偏置的视流速率输入。\n累积：CPU4把运动分量存入两组分布式活动。两侧偏好轴约相隔90°，使运动方向不与体轴重合时仍可表示部分全向运动。\n读出：CPU4与CPU1投射的一柱偏移参与形成左右转向差；桥接细胞被赋予抑制性平衡作用。后两项功能解释含模型假设。", "source_ids": ["P009-LEFT", "P009-RIGHT", "P010-LEFT", "P024-B"], "locator": "定位：第9–10页；图5；第23–24页各层定义。", "origin": "analyst_summary", "style": "card", "font_pt": 10.5, "min_font_pt": 10}, {"id": "RA05", "display_page": 17, "bbox": [59, 387, 551, 470], "title": "03　生理证据：找到了什么输入？", "body": "实验观察：罗盘细胞对偏振光呈调谐；两类TN对平移视流响应明显，对旋转视流较弱或无响应；局部感受野支持左右偏置的扩张点偏好。它们为模型提供方向与速率通道的依据，但不能单凭这些记录确认完整路径积分计算已在这些细胞中发生。", "source_ids": ["P003-CAPTION", "P005-LEFT", "P005-RIGHT", "P007-CAPTION"], "locator": "定位：图1–3及其图注；原文第3–7页。", "origin": "analyst_summary", "style": "card", "font_pt": 10.5, "min_font_pt": 10}, {"id": "RA06", "display_page": 17, "bbox": [59, 481, 551, 564], "title": "04　电镜证据：连接成立到哪一步？", "body": "实验观察：熊蜂小结中，TN活性区对面可见候选CPU4轮廓，支持速率输入到候选积分细胞的突触联系。细胞身份结合走行、投射和跨物种形态推断；这加强了“可用神经基础”的论证，却没有直接测出CPU4在完整觅食期间的归巢向量记忆。", "source_ids": ["P007-LEFT", "P007-RIGHT", "P009-CAPTION"], "locator": "定位：第7页；图4I–N及第9页图注。", "origin": "analyst_summary", "style": "card", "font_pt": 10.5, "min_font_pt": 10}, {"id": "RA07", "display_page": 17, "bbox": [59, 575, 551, 658], "title": "05　仿真与机器人：验证计算可行性", "body": "模型在随机外出后能够归巢，并出现近巢搜索；对噪声、参数扰动和一定范围的全向运动保持稳健。机器人随机外出至距起点6–12 m后，最近归巢距离平均16 cm（SD 11.1 cm，n=10）。这支持回路方案的工程与计算可行性，不能单独证明真实蜂脑逐项采用同一机制。", "source_ids": ["P010-RIGHT", "P012-LEFT", "P013-CAPTION", "P015-CAPTION"], "locator": "定位：第10、12页；图6–7。", "origin": "analyst_summary", "style": "card", "font_pt": 10.5, "min_font_pt": 10}, {"id": "RA08", "display_page": 17, "bbox": [59, 669, 551, 743], "title": "读懂数学：正弦活动为何能保存一个向量？", "body": "相同频率的正弦信号相加，仍是同频率正弦：相位表示方向，振幅表示距离。因此速度加权的活动累积可表示向量求和。两组记忆还需正确对齐；结论依赖偏好角、抑制调制和非饱和范围等条件。", "source_ids": ["P027-A", "P027-E", "P028-A"], "locator": "定位：第27–28页数学框架；参照原页公式。", "origin": "analyst_summary", "style": "callout", "font_pt": 10.5, "min_font_pt": 10}]}, {"page": 18, "original": "image-042.jpg", "background": "image-043.jpg", "blocks": [], "assets": [], "analysis": [{"id": "RA09", "display_page": 18, "bbox": [53, 100, 544, 144], "title": "译者阅读分析｜假设、边界与下一步", "body": "非原文译文 · 阅读分析 3/3　　重点区分：实验观察 / 作者解释 / 分析者推断 / 待执行建议。", "source_ids": ["P025-BODY", "P014-RIGHT"], "locator": "", "origin": "analyst_summary", "style": "title", "font_pt": 11, "min_font_pt": 10}, {"id": "RA10", "display_page": 18, "bbox": [53, 154, 291, 300], "title": "关键设计①　用解剖约束连接", "body": "作者假设：光滑与串珠状末梢可指示输入输出极性；极性相反、空间重叠的纤维形成突触。\n作用：将复杂投射模式转成系统连接矩阵，减少任意搭线。\n分析者判断：这是有依据的建模约束，但“允许连接”仍不等于每条连接都已实测；连接强度、符号和状态调制也需分别验证。", "source_ids": ["P009-LEFT", "P024-I", "P025-BODY"], "locator": "定位：第9、24–25页。", "origin": "analyst_inference", "style": "card", "font_pt": 10.5, "min_font_pt": 10}, {"id": "RA11", "display_page": 18, "bbox": [304, 154, 544, 300], "title": "关键设计②　用活动累积记忆", "body": "作者假设：CPU4柱中的循环微回路可维持运动记忆；模型用放电率累积与衰减近似。\n作用：让同一群体持续更新归巢向量，使该向量在返程中逐渐归零。\n证据边界：作者将CPU4记忆、桥接平衡及门控列为较弱支持或预测。尚不能把累积规则当成已确认的细胞机制。", "source_ids": ["P009-RIGHT", "P023-G", "P023-H", "P025-BODY"], "locator": "定位：第9、23、25页。", "origin": "author_interpretation", "style": "card", "font_pt": 10.5, "min_font_pt": 10}, {"id": "RA12", "display_page": 18, "bbox": [53, 308, 544, 420], "title": "可以支持什么，哪些仍待证实？", "body": "已有支持：方向与视流输入通道存在，候选细胞有合理的解剖汇聚，一套受此约束的网络能完成导航计算。\n仍待证实：CPU4是否在行为中持续编码归巢向量；桥接细胞是否以所设定符号平衡记忆；探索/归巢切换是否门控该通路。\n跨物种边界：生理重点来自Megalopta，电镜来自熊蜂，部分连接依据其他昆虫；不能把所有环节当成同一蜂种中的完整实测回路。", "source_ids": ["P007-LEFT", "P007-RIGHT", "P009-RIGHT", "P025-BODY"], "locator": "定位：第7、9页；第25页假设与证据分级。", "origin": "analyst_inference", "style": "card", "font_pt": 10.5, "min_font_pt": 10}, {"id": "RA13", "display_page": 18, "bbox": [53, 428, 544, 540], "title": "适用条件与原文疑点", "body": "模型能力有范围：基本版本依赖前向速率编码及参数条件；完全全向版本需附加机制，不能把“可扩展”当成基本版已覆盖任意飞行。\n公式核对：TN2响应式、CPU1桥接项符号、atan2中间推导等问题已在第23、24、27页句末标注。研究复现应核对发表版本代码及补充材料，避免直接按疑似笔误实现。\n未读范围：文件外的图S1–S7及视频S1–S3本体不在本次完整附件内。", "source_ids": ["P023-C", "P024-B", "P027-E", "P028-D"], "locator": "定位：第23–24、27–28页；正文译注。", "origin": "analyst_inference", "style": "card", "font_pt": 10.5, "min_font_pt": 10}, {"id": "RA14", "display_page": 18, "bbox": [53, 548, 544, 660], "title": "研究启发与优先核查建议（尚未执行）", "body": "可迁移思想：用方向群体码和运动分量维护目标向量，通过当前与期望方向的比较产生转向。\n优先核查：追踪候选CPU4在不同外出路径后的活动，是否出现可预测的相位与振幅，并确认返程更新；需控制速率、航向、感觉输入和行为状态。\n后续判断：记忆预测成立后再检验桥接抑制和门控；否则先检查编码与记忆机制，不仅靠调参维持表现。", "source_ids": ["P014-RIGHT", "P025-BODY", "P027-E"], "locator": "依据：第14页作者预测；第25、27页机制。", "origin": "proposed_check", "style": "card", "font_pt": 10.5, "min_font_pt": 10}, {"id": "RA15", "display_page": 18, "bbox": [53, 668, 544, 749], "title": "建议阅读顺序与分析来源", "body": "先看图5理解回路，再回查图1–4的输入与连接证据，结合图6–7判断验证范围，最后读第25页假设分级和第27–28页数学条件。以上阅读建议由本流程提出；分析框架参考 norman-paper-reading（N同学），分析由本翻译流程生成。来源定位均为本PDF文件页码，不是期刊印刷页码。", "source_ids": ["P012-CAPTION", "P025-BODY", "P027-E", "P028-D"], "locator": "框架来源：github.com/N-tongxue/norman-skill", "origin": "proposed_check", "style": "callout", "font_pt": 10.5, "min_font_pt": 1 ": ["P019-WILD1-S001"], "min_font_pt": 8, "reading_order": 81}, {"id": "P019-WILD2", "page": 19, "bbox": [254, 589.1, 390, 611.3], "kind": "table", "font_pt": 8, "source_bbox": [254, 589.1, 390, 611.3], "source": "Wild caught, Barro Colorado\nIsland, Panama", "translation": "野外捕获：巴拿马巴罗科罗拉多岛", "status": "translated", "notes": [], "sentence_ids": ["P019-WILD2-S001"], "min_font_pt": 8, "reading_order": 82}, {"id": "P019-FEI", "page": 19, "bbox": [254, 646, 390, 668.2], "kind": "table", "font_pt": 8, "source_bbox": [254, 646, 390, 668.2], "source": "FEI (now part of Thermo Fisher\nScientific)", "translation": "FEI（现属Thermo Fisher Scientific）", "status": "translated", "notes": [], "sentence_ids": ["P019-FEI-S001"], "min_font_pt": 8, "reading_order": 83}], "assets": [], "analysis": []}, {"page": 20, "original": "image-046.jpg", "background": "image-047.jpg", "blocks": [{"id": "P020-BOTTOM", "page": 20, "bbox": [53, 484, 544, 750], "kind": "paragraph", "font_pt": 10, "source_bbox": [53, 484, 544, 750], "source": "CONTACT FOR REAGENT AND RESOURCE SHARING\nFurther information and requests for resources and reagents should be directed to and will be fulfilled by the Lead Contact, Stanley\nHeinze (stanley.heinze@biol.lu.se).\nEXPERIMENTAL MODEL AND SUBJECT DETAILS\nAdult bees of the genus Megalopta (species M. genalis and M. centralis) were caught from the wild using light traps (white sheets\nilluminated by a bright light source containing UV wavelengths). Traps were placed ca. 2 m above ground within small canopy open-\nings of the tropical forest on Barro Colorado Island (field station of the Smithsonian Tropical Research Institute), located in the Pan-\nama Canal, Panama. Trappings were carried out during the activity phase of the bees between 4:30 am and 5:30 am in the morning,\ni.e., during early morning twilight. Caught bees were kept individually in 50 mL plastic vials, equipped with two cotton balls, one\nsoaked in honey solution as well as one soaked in water. Vials were kept at room temperature in a dark secondary container (small\namounts of natural light were allowed to reach the bees to ensure continuous circadian entrainment). Bees were used for experiments\nwithin two weeks after capture to ensure healthy condition. With few exceptions used bees were large to medium sized females.\nFemale bumblebees (Bombus terrestris) were obtained from a commercial supplier (Koppert, Berkel en Rodenrijs, the Netherlands) and\nkept at room temperature in a room sized flight cage at Lund University, Sweden. Feeders with honey solution were available at all times.\nMETHOD DETAILS\nVisual stimulation\nFor visual stimulation, we developed a new virtual reality environment combining a 360(cid:1) panoramic LED arena (consisting of 96\nLED-arrays of 8x8 570 nm LEDs, mounted on FlyPanels-G3, controlled by a panels display control unit; IO-Rodeo, Pasadena,\nUSA) with an artificial sky. The arena had an angular resolution of 1.5(cid:1) and covered 55(cid:1) of vertical space (equal parts above and below", "translation": "试剂与资源共享联系信息\n进一步信息以及资源、试剂申请，请联系首要联系人 Stanley Heinze（stanley.heinze@biol.lu.se），由其处理。\n实验模型与研究对象详情\nMegalopta 属成蜂（M. genalis、M. centralis）用灯光诱捕器从野外捕获：以含紫外波段的强光照射白布。诱捕器置于巴拿马运河巴罗科罗拉多岛热带森林小型林冠空隙中，距地面约2 m，该岛为史密森热带研究所野外站。捕捉时间为蜂活动期的清晨4:30–5:30，即晨间曙光时段。每只蜂单独置于50 mL塑料管，配两个棉球，分别蘸蜂蜜溶液和水。试管在室温下放入避光外容器；允许少量自然光进入，以保持昼夜节律同步。为确保健康，捕获后两周内使用。除少数例外，均为大、中型雌蜂。\n雌性地熊蜂（Bombus terrestris）购自荷兰 Koppert（Berkel en Rodenrijs），在瑞典隆德大学室温、房间大小的飞行笼中饲养，始终提供蜂蜜溶液饲喂器。\n方法细节\n视觉刺激\n我们开发了将360°全景LED场景与人工天空结合的新虚拟现实环境。场景由96块8×8、570 nm LED阵列组成，安装于FlyPanels-G3，由显示控制器驱动（IO-Rodeo，美国Pasadena）。角分辨率1.5°，垂直覆盖55°，地平线上下各占一半", "status": "translated", "notes": [], "sentence_ids": ["P020-BOTTOM-S001", "P020-BOTTOM-S002", "P020-BOTTOM-S003", "P020-BOTTOM-S004", "P020-BOTTOM-S005", "P020-BOTTOM-S006", "P020-BOTTOM-S007", "P020-BOTTOM-S008", "P020-BOTTOM-S009", "P020-BOTTOM-S010", "P020-BOTTOM-S011", "P020-BOTTOM-S012"], "min_font_pt": 9, "reading_order": 84}, {"id": "P020-TAB00", "page" kind": "table", "font_pt": 8, "source_bbox": [53.1, 337.3, 240, 349.5], "source": "Rotation stage for polarizer: DT-50", "translation": "偏振片旋转台：DT-50", "status": "translated", "notes": [], "sentence_ids": ["P020-TAB18-S001"], "min_font_pt": 8, "reading_order": 103}, {"id": "P020-TAB19", "page": 20, "bbox": [53.1, 349.6, 240, 361.8], "kind": "table", "font_pt": 8, "source_bbox": [53.1, 349.6, 240, 361.8], "source": "Controller for rotation stage: MoCo-DC", "translation": "旋转台控制器：MoCo-DC", "status": "translated", "notes": [], "sentence_ids": ["P020-TAB19-S001"], "min_font_pt": 8, "reading_order": 104}, {"id": "P020-TAB20", "page": 20, "bbox": [53.1, 361.9, 240, 384.1], "kind": "table", "font_pt": 8, "source_bbox": [53.1, 361.9, 240, 384.1], "source": "Polarizer (custom made, 24cm diameter,\nglass supported BVO-UV linear polarizer)", "translation": "定制偏振片：直径24 cm、玻璃支撑BVO-UV线偏振片", "status": "translated", "notes": [], "sentence_ids": ["P020-TAB20-S001"], "min_font_pt": 8, "reading_order": 105}, {"id": "P020-TAB21", "page": 20, "bbox": [53.1, 384.2, 240, 396.5], "kind": "table", "font_pt": 8, "source_bbox": [53.1, 384.2, 240, 396.5], "source": "Simulation computer, modeling: Dell Precision 7610", "translation": "建模仿真电脑：Dell Precision 7610", "status": "translated", "notes": [], "sentence_ids": ["P020-TAB21-S001"], "min_font_pt": 8, "reading_order": 106}, {"id": "P020-TAB22", "page": 20, "bbox": [53.1, 396.6, 240, 418.7], "kind": "table", "font_pt": 8, "source_bbox": [53.1, 396.6, 240, 418.7], "source": "Dagu Rover 5 chassis (http://www.dagurobot.com/\ngoods.php?id=48)", "translation": "Dagu Rover 5底盘（网址保留于左侧原页）", "status": "translated", "notes": [], "sentence_ids": ["P020-TAB22-S001"], "min_font_pt": 8, "reading_order": 107}, {"id": "P020-TAB23", "page": 20, "bbox": [53.1, 418.8, 240, 441], "kind": "table", "font_pt": 8, "source_bbox": [53.1, 418.8, 240, 441], "source": "Arduino Mega 2560 REV3 (https://store.arduino.cc/\nusa/arduino-mega-2560-rev3)", "translation": "Arduino Mega 2560 REV3（网址见左页）", "status": "translated", "notes": [], "sentence_ids": ["P020-TAB23-S001"], "min_font_pt": 8, "reading_order": 108}, {"id": "P020-TAB24", "page": 20, "bbox": [53.1, 441.1, 240, 453.3], "kind": "table", "font_pt": 8, "source_bbox": [53.1, 441.1, 240, 453.3], "source": "Nexus 5 Android smart-phone\n(cid:1)", "translation": "Nexus 5 Android智能手机", "status": "translated", "notes": [], "sentence_ids": ["P020-TAB24-S001"], "min_font_pt": 8, "reading_order": 109}, {"id": "P020-TAB25", "page": 20, "bbox": [53.1, 453.4, 240, 466], "kind": "table", "font_pt": 8, "source_bbox": [53.1, 453.4, 240, 466], "source": "360(cid:1) lens attachment (http://www.kogeto.com/store/)", "translation": "360°镜头附件（网址见左页）", "status": "translated", "notes": [], "sentence_ids": ["P020-TAB25-S001"], "min_font_pt": 8, "reading_order": 110}, {"id": "P020-TABHEAD0", "page": 20, "bbox": [247, 117.7, 383, 129.7], "kind": "table", "font_pt": 8, "source_bbox": [247, 117.7, 383, 129.7], "source": "SOURCE", "translation": "来源", "status": "translated", "notes": [], "sentence_ids": ["P020-TABHEAD0-S001"], "min_font_pt": 8, "reading_order": 111}, {"id": "P020-TABHEAD1", "page": 20, "bbox": [387, 117.7, 543, 129.7], "kind": "table", "font_pt": 8, "source_bbox": [387, 117.7, 543, 129.7], "source": "IDENTIFIER", "translation": "识别号", "status": "translated", "notes": [], "sentence_ids": ["P020-TABHEAD1-S001"], "min_font_pt": 8, "reading_order": 112}], "assets": [], "analysis": []}, {"page": 21, "original": "image-048.jpg", "background": "image-049.jpg", "blocks": [{"id": "P021-BODY", "page": 21, "bbox": [59, 100, 551, 749], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [59, 100, 551, 749], "source": "the horizon). The artificial sky consisted of a planar array of UV LEDs (365 nm) illuminating a large polarizer (BVO-UV, Boldervision; 88(cid:1)\nof dorsal space) mounted on a custom-built rotation stage (Prototypverkstaden, Lund, Sweden) driven by a Micos DT-50 rotation\nstage (controlled via MoCo controller; Micos). All LED panels as well as the rotation stage were controlled via an integrated, custom\ndesigned MATLAB-based software.\nPolarized-light stimuli were applied by switching the LED illumination of the sky on and rotating the polarizer through 360(cid:1) at con-\nstant speed (60(cid:1)/s or 30(cid:1)/s) clockwise and counter-clockwise.\nOptic-flow stimuli were shown in stereotypical series of individual stimulus bouts separated by darkness. Each bout consisted of\n0.5 s stationary display of the stimulus pattern followed by 3 s of movement at constant velocity, followed by 3 s of darkness. As\npatterns, we used sinus-gratings of different spatial frequencies (ranging from 0.017 cycles/(cid:1) to 0.067 cycles/(cid:1)) at maximal contrast,\nmoving at velocities between 10(cid:1)/s to 160(cid:1)/s. For translational optic flow, the stimulus moved clockwise in one hemisphere and\ncounter-clockwise in the other hemisphere, while the entire panorama moved in one coherent direction during rotational optic flow.\nReceptive fields were mapped using a bright narrow vertical stripe (width: 7.5(cid:1)) that moved around the entire panorama at constant\nspeed (60(cid:1)/s) either clockwise or counter-clockwise. Each stimulus consisted of two clockwise rotations followed by two counter-\nclockwise rotations. The bar was introduced into the arena behind the bee and remained stationary for 0.5 s before movement\ncommenced. Control voltages were recorded for all stimuli, indicating the timing of displayed frames in the virtual reality arena\nand the angular position of the rotation stage controlling the polarizer.\nElectrophysiology\nIntracellular recordings were carried out with sharp-tipped electrodes (resistance 50-150 M) drawn from borosilicate glass capillaries\n(Sutter P-97 puller). Bees were cooled on ice (bumblebees in freezer) until immobile and waxed to a plastic holder. Legs and wings\nwere removed for increased stability of the preparation. The head capsule was opened frontally between the antennal base and the\nocelli, and air-sacks and fat tissue were pushed aside or removed if necessary. The brain surface was shortly exposed to Pronase\n(crystals applied directly), after which the neural sheath was removed with tweezers. A silver wire was placed in the ventral part of\nthe head (near mandibles) as reference electrode. After placing the preparation in the center of our virtual reality arena (vertical orien-\ntation), the recording electrode (tip filled with 4% neurobiotin (Vector Laboratories) in 1M potassium chloride, backed up with 1M\npotassium chloride) was frontally inserted into the brain using the antennal lobes and the vertical lobes of the mushroom body as\nlandmarks (Sensapex micromanipulator, stepping mode). Target areas were the noduli and the central body of the central complex\n(CX). Once cells were impaled and the stimulation protocol was successfully tested, a depolarizing current (1-3 nA) was applied to\niontophoretically inject neurobiotin into the recorded neuron in most experiments.\nRecordings were performed throughout the day on 160 female worker bees (with the exception of very few male Megalopta). With\nfew exceptions, only one cell was recorded and analyzed per bee to ensure a clear correspondence between anatomy and physi-\nology. Whenever the recording was lost before dye injection, the physiology of more than one cell was recorded, but never were\ntwo cells of the exact same type encountered within the same bee in these cases. Therefore, for physiological data the number of\ncells always equals the number of bees used for the displayed cell population. Signals were amplified with a BA-03X amplifier\n(NPI) (Panama setup) or a SEC05-LX amplifier (NPI) (Sweden setup), digitized using CED-1401 micro (Cambridge Electronics Design),\nand recorded with Spike2 software (Cambridge Electronics Design). All recordings were performed at room temperature (20-25(cid:1)C).\nHistology for light microscopy\nNeurobiotin injected brains were processed as follows. Injected brains were removed from the head capsule and fixed in neurobiotin\nfixative (4% paraformaldehyde, 2% saturated picric acid, 0.25% glutaraldehyde) over night at 4(cid:1)C. Brains were transferred to 0.01M\nPBS until further processing. After rinsing the brains for 4x15min in PBS, they were incubated with Streptavidin conjugated to Cy3\n(1:1000, in 0.01M PBT (PBS plus 0.3% Triton X-100)) for 3 days. The brains were then washed (4x20 min PBT, 2x 20 min PBS) and\ndehydrated in an increasing ethanol series. Finally, they were cleared in Methyl salicylate and mounted in Permount (between two\ncoverslips, separated by spacers).\nImmunohistochemical stainings were performed to visualize the boundaries of brain regions, in particular the CX. Antibodies\nagainst the synaptic protein Synapsin (monoclonal, mouse antibodies; obtained from Drs. Erich Buchner and Christian Wegener)\nwere used for this purpose [67]. Brains were dissected and fixed in Zinc-Formaldehyde fixative [68] (overnight at 4(cid:1)C). After washing\nin HEPES-buffered saline (HBS, 8x30 min [68]), the brains were subjected to a permeabilization step (85 min incubation with a fresh\nmixture of DMSO and Methanol (20:80)) and washed 3x 10 min in Tris-HCL buffer. After pre-incubation in normal goat serum (NGS,\n5% in PBT), the brains were incubated with the primary antibody solution (anti-Synapsin, 1:25, in PBT with 1% NGS) for 5-6 days\nat 4(cid:1)C. The brains were washed in PBT (8x 30 min) and incubated with the secondary antibody solution (goat-anti-mouse antibody\nconjugated to Cy5, 1:300, in PBT with 1% NGS) for 4-5 days at 4(cid:1)C. After washing (4x 30 min PBT, 2x 30 min PBS) the brains were\ndehydrated, cleared and mounted as described above.\nBlock-face electron microscopy\nBumblebee brains were dissected in fixative (4% paraformaldehyde, 2% glutaraldehyde, in Cacodylate-buffer) overnight at 4(cid:1)C.\nAfter washing 4x 15 min in 0.01M PBS, the brains were embedded in albumin/gelatin and postfixed overnight in 4% paraformalde-\nhyde. To cut out the region of interest (central-complex noduli), a single thick section (200 mm) was cut from each brain using a\nvibrating blade microtome. These sections were stored in PBS until further processing.", "translation": "（续上页）。人工天空由365 nm紫外LED平面阵列照亮大型偏振片（BVO-UV，Boldervision；覆盖背侧88°视角）构成；偏振片安装在定制旋转台（Prototypverkstaden，瑞典隆德），由Micos DT-50驱动并经MoCo控制器控制。全部LED面板和旋转台由一套定制、集成的MATLAB软件控制。\n偏振光刺激：打开天空LED，以60°/s或30°/s恒速让偏振片顺、逆时针各旋转360°。\n视流刺激按固定序列呈现，各段由黑暗分隔。每段先静止显示图案0.5 s，继而恒速运动3 s，再黑暗3 s。图案为最大对比度的正弦光栅，空间频率0.017–0.067周/度，速率10–160°/s。平移视流时，一侧视野顺时针、另一侧逆时针运动；旋转视流时，整个全景沿同一方向运动。用宽7.5°的狭窄垂直亮条以60°/s绕全景顺、逆时针运动绘制感受野。每次刺激先顺时针两圈，再逆时针两圈；亮条从蜂身后出现，静止0.5 s后开始移动。记录全部刺激的控制电压，以标示虚拟场景每帧呈现时间及偏振片旋转台角位置。\n电生理\n细胞内记录采用硼硅玻璃毛细管拉制的尖电极（Sutter P-97；电阻50–150 MΩ）。蜂在冰上冷却（熊蜂放冷冻箱）至不动，用蜡固定于塑料支架；去除腿、翅以提高稳定性。在触角基部与单眼之间从额面打开头壳，推开或按需去除气囊及脂肪组织。脑表面短暂接触Pronase晶体后，用镊子去除神经鞘。在头腹侧近上颚处置银丝参比电极。制备体竖直置于场景中心后，以触角叶和蘑菇体垂直叶为标志，用Sensapex微操纵器步进式从额面插入记录电极。电极尖端填4% neurobiotin（Vector Laboratories）的1 M KCl溶液，后部填1 M KCl。靶区为CX小结及中央体。刺入细胞且刺激测试成功后，多数实验施加1–3 nA去极化电流，将neurobiotin离子电泳注入所记录神经元。\n记录在全天不同时段完成，使用160只雌性工蜂（仅极少量雄性Megalopta例外）。除少数情况，每蜂仅记录、分析一个细胞，以确保形态与生理明确对应。若注染前丢失记录，则可记录同蜂另一细胞的生理，但这些情况下从未在同蜂中记录到两个完全同型细胞。因此，各展示细胞群的生理数据中，细胞数始终等于蜂数。信号在巴拿马用BA-03X（NPI）、瑞典用SEC05-LX（NPI）放大，经CED-1401 micro（Cambridge Electronic Design）数字化，由Spike2记录。全部记录在20–25°C室温完成。\n光镜组织学\n注入neurobiotin的脑从头壳取出，在固定液（4%多聚甲醛、2%饱和苦味酸、0.25%戊二醛）中4°C过夜，转入0.01 M PBS。PBS洗4×15 min后，在Cy3偶联链霉亲和素（1:1000，0.01 M PBT，即PBS加0.3% Triton X-100）中孵育3天。随后洗涤（PBT 4×20 min，PBS 2×20 min），梯度乙醇脱水，水杨酸甲酯透明，以Permount封装于由垫片分隔的两片盖玻片间。\n免疫组织化学用以显示脑区边界，特别是CX。使用抗突触蛋白Synapsin单克隆小鼠抗体（Erich Buchner、Christian Wegener提供）[67]。脑解剖后在锌-甲醛固定液[68]中4°C过夜；HBS缓冲盐水洗8×30 min[68]，在新鲜DMSO/甲醇20:80混合液中通透85 min，再用Tris-HCl洗3×10 min。先用正常山羊血清（NGS，PBT中5%）预孵育，再以一抗（抗Synapsin 1:25，含1%NGS的PBT）4°C孵育5–6天。PBT洗8×30 min，再以Cy5偶联山羊抗小鼠二抗（1:300，含1%NGS的PBT）4°C孵育4–5天。洗涤（PBT 4×30 min，PBS 2×30 min）后，按上法脱水、透明和封片。\n块面电子显微成像\n熊蜂脑在固定液（4%多聚甲醛、2%戊二醛，二甲胂酸盐缓冲液）中解剖并4°C过夜。0.01 M PBS洗4×15 min后，以白蛋白/明胶包埋，4%多聚甲醛后固定过夜。用振动切片机从每脑切一张200 μm厚切片，取出CX小结所在区域；切片在PBS中保存至后续处理。", "status": "translated", "notes": [], "sentence_ids": ["P021-BODY-S001", "P021-BODY-S002", "P021-BODY-S003", "P021-BODY-S004", "P021-BODY-S005", "P021-BODY-S006", "P021-BODY-S007", "P021-BODY-S008", "P021-BODY-S009", "P021-BODY-S010", "P021-BODY-S011", "P021-BODY-S012", "P021-BODY-S013", "P021-BODY-S014", "P021-BODY-S015", "P021-BODY-S016", "P021-BODY-S017", "P021-BODY-S018", "P021-BODY-S019", "P021-BODY-S020", "P021-BODY-S021", "P021-BODY-S022", "P021-BODY-S023", "P021-BODY-S024", "P021-BODY-S025", "P021-BODY-S026", "P021-BODY-S027", "P021-BODY-S028", "P021-BODY-S029", "P021-BODY-S030", "P021-BODY-S031", "P021-BODY-S032", "P021-BODY-S033", "P021-BODY-S034", "P021-BODY-S035", "P021-BODY-S036", "P021-BODY-S037", "P021-BODY-S038"], "min_font_pt": 9, "reading_order": 113}], "assets": [], "analysis": []}, {"page": 22, "original": "image-050.jpg", "background": "image-051.jpg", "blocks": [{"id": "P022-BODY", "page": 22, "bbox": [53, 100, 544, 647], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [53, 100, 544, 647], "source": "Samples were then rinsed in PBS buffer for 5 min, before osmification (in 2% osmium tetroxide and 1.5% potassium ferricyanide,\naqueous solution) for 1 hr at room temperature. Then, samples were washed in pure water (3 3 5 min) and incubated for 20 min in\nthiocarbohydrazide solution (1% aqueous), washed in pure water (3 3 5 min) and incubated for another 30 min in osmium tetroxide\n(2% aqueous; room temperature). After more rinsing (3 3 5 min) in pure water, samples were transferred into 1% uranyl acetate for\novernight incubation at 4(cid:1)C. Finally, the samples were incubated with lead aspartate (after 3 3 5 min washing in pure water) for 60 min\nat 60(cid:1)C (oven). After more washing (3 3 5 min pure water), the samples were dehydrated in an increasing ethanol series (20%, 50%,\n70% 90%, 2x 100%; 5 min each). Next, the samples were slowly infiltrated with a mixture of Durcupan and ethanol (25%, 50%, 75%,\n2 hr each), before transferring them to 100% Durcupan overnight. After transferring to fresh Durcupan for 2 hr, samples were\nembedded in fresh resin for 48 hr at 60(cid:1)C. Samples were embedded in a thin layer of resin (just enough to cover the sample).\nThey were trimmed and mounted onto aluminum stubs using 2 part conductive silver epoxy.\nImaging and image processing\nElectron-microscopical imaging was carried out using a Zeiss Sigma VP scanning electron microscope equipped with a Gatan 3view.\nLow resolution scans were obtained with a voxel size of 100 3 100 nm (field of view: 400 3 400 mm) in 100 nm steps at 2 kV, medium\nresolution scans were done with a voxel size of 23 3 23 nm (field of view: 95 3 95 mm) in 50 nm steps and at an energy of 2 kV, while high-\nresolution scans were carried out with a voxel-size of 11.5 3 11.5 nm at an energy of 2 kV (field of view: 46 3 46 mm) in 50 nm steps.\nAcquired images of each stack were aligned and several consecutive imaging runs were merged into one continuous stack using\nAmira 5.3 software. After contrast optimization, the image stack was down-sampled to 8 bit image depth. This enabled use of the Skel-\netonize plugin for Amira [50] to perform neuron tracing, as well as to perform image segmentation (Amira segmentation editor).\nNeuron profiles were traced manually by adding short, straight skeleton segments linked by branchpoints. The midline of large\nbranches was automatically fitted to match the image information. The same tracing was carried out in both the high-, medium-\nand low-resolution stacks. For low-resolution stacks only the main neurite and the largest branches of cells were traceable, albeit\nover longer distances. Neuropil boundaries of the noduli were generated after down-sampling the image stack to 1x1x1 mm voxel\nsize. We used the segmentation editor of Amira to manually segment key cross sections of the noduli in all three spatial planes.\nThis provided a 3D scaffold of the noduli that was then used as the basis for generating a surface model of this brain region using\nthe Amira wrapping algorithm. Volumetric reconstruction of selected neuronal fibers was also carried out with the Amira segmenta-\ntion editor. For this purpose, cross sections of neuronal profiles were traced in the highest resolution image-plane (x-y plane) for each\nsection until the 3D shape of the neurite of interest became apparent. The resulting label field was used to generate a surface model of\nthe neurite. Active zones were identified by aggregations of synaptic vesicles adjacent to an electron-dense part of the neuronal\nmembrane. Profiles directly opposite of the active zone were identified as postsynaptic.\nConfocal imaging was carried out with a Zeiss LSM 510 equipped with a 10x objective (Plan Apochromat 10x/0.45, water immer-\nsion, Zeiss) for imaging large neuropil structures and whole brains, as well as a 25x long distance objective (LD LCI Plan-Apochromat\n25 3 /0.8 Imm Corr DIC, Zeiss) for obtaining single-neuron morphologies and high-resolution neuropil data. Neurons were imaged at\na voxel size of 0.3x0.3x0.88 mm. All image stacks together covering the full extent of one cell were aligned to a common reference\nframe (using Amira) and used as input to the skeletonize plugin [69]. Neurons were traced manually and the resulting skeletons were\nfinalized by automatic midline fitting and diameter adjustment (using local brightness information of the image data). Neuropils were\nreconstructed by manual image segmentation of key cross-sections of each structure combined with automatic surface wrapping in\nAmira. This was carried out for neuropils innervated by each neuron (based on background staining) as well as from anti-Synapsin\nantibody labeled preparations.\nReconstructions based on antibody labeling were used to generate a representative reference brain, which then served as a shared\nframe of reference for individual neuron data (neuron atlas). Individual neuron data were registered into this reference brain via manual\naffine registration (nine degrees of freedom). Registration parameters were obtained by registration of individual neuropil models to\ntheir counterparts in the reference brain. For TN-neurons we used the compartments of the CX, as well as the lateral antennal lobe\ntract as reference structures.\nSimulation Methods\nThe proposed path integration network was implemented in Python 2.7 (Including scipy, numpy and matplotlib external libraries).\nAnimation of the model used the following javascript libraries: jQuery, tinycolor, tinygradient. All simulations were carried out on a\nstandard PC (Dell Precision 7610). We used a simple firing rate model for each neuron [70], in which the output firing rate r is a sigmoid\nfunction of the input I:", "translation": "样品先用PBS洗5 min，室温以2%四氧化锇与1.5%铁氰化钾水溶液锇化1 h。纯水洗3×5 min，1%硫代碳酰肼水溶液孵育20 min，再纯水洗3×5 min，室温2%四氧化锇水溶液孵育30 min。再纯水洗3×5 min，转入1%醋酸铀酰4°C过夜。纯水洗3×5 min后，天冬氨酸铅中60°C烘箱孵育60 min。再纯水洗3×5 min，梯度乙醇脱水（20%、50%、70%、90%、100%两次，各5 min）。随后用Durcupan/乙醇混合液渐进浸透（25%、50%、75%，各2 h），转100% Durcupan过夜。换新鲜Durcupan 2 h后，新鲜树脂60°C包埋48 h，树脂层仅需覆盖样品。修块后，以双组分导电银环氧胶固定到铝样品台。\n成像与图像处理\n电镜采用配Gatan 3view的Zeiss Sigma VP扫描电镜。低分辨率扫描面内像素100×100 nm（视野400×400 μm），步长100 nm，2 kV；中分辨率23×23 nm（视野95×95 μm），步长50 nm，2 kV；高分辨率11.5×11.5 nm（视野46×46 μm），步长50 nm，2 kV。\n用Amira 5.3对各堆栈图像配准，将数次连续成像合成一个连续堆栈。优化对比度后降为8位灰度，以使用Amira的Skeletonize插件[50]追踪神经元，并以分割编辑器分割图像。（译注—存疑：此处原文引文[50]是蜂归巢行为研究；同页共聚焦段落将Skeletonize引为[69]，后者为神经元三维重建方法论文，故[50]可能误引，未见勘误。）\n通过添加由分支点连接的短直骨架段手动追踪神经元轮廓；大分枝中线依据图像自动拟合。高、中、低分辨率堆栈采用同样追踪法；低分辨率只能追踪主神经突及最大分枝，但范围更长。将堆栈降采样为1×1×1 μm体素后生成小结神经毡边界。用Amira在三个空间平面手动分割关键截面，形成小结三维支架，再以包裹算法生成表面模型。选定纤维的体积重建也由分割编辑器完成：逐层在最高分辨率的x-y平面勾画截面，直至显出目标神经突三维形态；由标签场生成表面模型。以神经膜电子致密部分旁聚集的突触小泡识别活性区，正对活性区的轮廓判为突触后。\n共聚焦成像用Zeiss LSM 510：10×物镜（Plan Apochromat 10×/0.45水浸）成像大型神经毡与全脑，25×长工作距离物镜（LD LCI Plan-Apochromat 25×/0.8 Imm Corr DIC）获取单神经元形态及高分辨率神经毡数据。神经元体素为0.3×0.3×0.88 μm。用Amira将覆盖一个细胞全范围的各堆栈配准到共同坐标，输入Skeletonize[69]。手动追踪后，依据局部亮度自动拟合中线、调整直径。手动分割各结构关键截面并自动包裹表面，以重建神经毡；既用于由背景染色显示的各神经元支配脑区，也用于抗Synapsin标记制备体。\n由抗体标记重建生成代表性参考脑，作为单神经元数据的共同参照，即神经元图谱。用九自由度手动仿射配准将个体数据配入：以各个体神经毡模型与参考脑相应结构配准，求得参数。TN神经元以CX各区室及外侧触角叶束为参照。\n仿真方法\n路径积分网络用Python 2.7实现（含scipy、numpy、matplotlib），模型动画使用jQuery、tinycolor、tinygradient JavaScript库；仿真在Dell Precision 7610标准PC运行。各神经元采用简单放电率模型[70]，输出放电率r是输入I的sigmoid函数：", "status": "translated", "notes": [{"type": "uncertain", "sentence_id": "P022-BODY-N001-S", "text": "（译注—存疑：此处原文引文[50]是蜂归巢行为研究；同页共聚焦段落将Skeletonize引为[69]，后者为神经元三维重建方法论文，故[50]可能误引，未见勘误。）", "basis": "译注—存疑：此处原文引文[50]是蜂归巢行为研究；同页共聚焦段落将Skeletonize引为[69]，后者为神经元三维重建方法论文，故[50]可能误引，未见勘误。", "sources": []}], "sentence_ids": ["P022-BODY-S001", "P022-BODY-S002", "P022-BODY-S003", "P022-BODY-S004", "P022-BODY-S005", "P022-BODY-S006", "P022-BODY-S007", "P022-BODY-S008", "P022-BODY-S009", "P022-BODY-S010", "P022-BODY-S011", "P022-BODY-S012", "P022-BODY-S013", "P022-BODY-S014", "P022-BODY-S015", "P022-BODY-S016", "P022-BODY-S017", "P022-BODY-S018", "P022-BODY-S019", "P022-BODY-S020", "P022-BODY-S021", "P022-BODY-S022", "P022-BODY-S023", "P022-BODY-S024", "P022-BODY-S025", "P022-BODY-S026", "P022-BODY-S027", "P022-BODY-S028", "P022-BODY-N001-S"], "min_font_pt": 9, "reading_order": 116}, {"id": "P022-AFTER", "page": 22, "bbox": [53.1, 680, 544.1, 710.5], "kind": "paragraph", "font_pt": 9, "source_bbox": [53.1, 680, 544.1, 711], "source": "where parameters a and b control the slope and offset of the sigmoid (see Figure S5 for parameter values and curve shapes). Optional\nGaussian noise e (cid:4) N ð0; s2Þ can be added to the output, which is then clipped to fall between 0 and 1. The input I is given by the\nr r\nweighted sum of activity of neurons that synapse onto neuron j:\nX", "translation": "参数a、b控制sigmoid的斜率和偏移（参数及曲线见图S5）。可对输出加高斯噪声ε_r∼N(0,σ_r²)，再截限到0–1。神经元j的输入I为其突触前神经元活动的加权和：", "status": "translated", "notes": [], "sentence_ids": ["P022-AFTER-S001", "P022-AFTER-S002", "P022-AFTER-S003"], "min_font_pt": 9, "reading_order": 117}], "assets": [{"id": "P022-E01", "page": 22, "kind": "equation", "bbox": [270, 650, 330, 675], "source_bbox": [270, 650, 330, 675], "source": "原页22公式组1", "asset": "assets\\equation-22-01.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-052.png"}, {"id": "P022-E02", "page": 22, "kind": "equation", "bbox": [270, 711, 325, 739], "source_bbox": [270, 711, 325, 739], "source": "原页22公式组2", "asset": "assets\\equation-22-02.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-053.png"}], "analysis": []}, {"page": 23, "original": "image-054.jpg", "background": "image-055.jpg", "blocks": [{"id": "P023-A", "page": 23, "bbox": [59.8, 100, 550.8, 241], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 100, 550.8, 241], "source": "In the current simulation, these weights only take values of 0 (no connection), 1 (excitation) or (cid:3)1 (inhibition) with optional added\nGaussian noise e (cid:4) N ð0; s2 Þ. In the case of added noise, the sign of weights is preserved by clipping any values that fall outside\nw w\nthis range, i.e., excitatory connections cannot become inhibitory and vice versa. Rather than tuning the weights, we tune the sigmoid\nfunction parameters for each neuron type to balance the number and scale of the inputs to each layer (see Figure S5A). Tuning was\ncarried out visually, by attempting to ensure that each layer would cover a full range of firing rates during a batch of typical runs. Due to\nthe robust nature of this network, many combinations of parameters work and there was no need to carry out extensive parameter\ntuning, e.g., through a grid search.\nThe model consists of six layers of neurons, some of which have additional properties to those above (described in more detail\nbelow): the TN and TL (input) layers receive direct sensory input from the agent; the TB1 (compass) layer has self-connection weights\nwith values that can fall between (cid:3)1 and 0; the CPU4 (proposed memory) layer has additional synaptic accumulation; and the CPU1\n(output) layer connects to the agent’s motor system. In the following description of the individual layers of our model, we use q for\nallocentric and 4 for egocentric angles. A superscript in parentheses is used to represent values at a particular time step, and sub-\nscripts are used to differentiate parameters by layer and cell index.", "translation": "本仿真权重仅取0（无连接）、1（兴奋）、−1（抑制），可加高斯噪声ε_w∼N(0,σ_w²)。加噪后通过截限保持权重符号，故兴奋连接不会变抑制，反之亦然。我们不调权重，而调各细胞类型的sigmoid参数，以平衡每层输入数目和尺度（图S5A）。通过目视调节，使各层在一批典型运行中尽量覆盖完整放电率范围。网络稳健，许多参数组合均有效，无需网格搜索等广泛调参。\n模型由六层神经元组成，部分层还有额外性质（下详）：TN、TL输入层直接接收智能体的感觉输入；TB1罗盘层有−1至0的自身连接权重；CPU4候选记忆层有额外突触累积；CPU1输出层连接运动系统。以下各层描述用θ表示世界参照角，φ表示自身参照角；括号上标表示时步，下标区分层与细胞索引。", "status": "translated", "notes": [], "sentence_ids": ["P023-A-S001", "P023-A-S002", "P023-A-S003", "P023-A-S004", "P023-A-S005", "P023-A-S006", "P023-A-S007"], "min_font_pt": 9, "reading_order": 124}, {"id": "P023-B", "page": 23, "bbox": [59.8, 243, 273, 284], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 243, 550.8, 284], "source": "Speed Layer 1 – TN-neurons\nIn our simulation the speed estimate, in terms of forward-to-backward optic flow originating from the diagonally offset preference\nI = ½sinð q + f Þ cosð q + f Þ(cid:5)v\nangles of TN-cells on each hemisphere, is calculated by TN L h TN h TN\nI = ½sinð q (cid:3) f Þ cosð q (cid:3) f Þ(cid:5)v\nTN R h TN h TN", "translation": "速率第1层——TN神经元\n仿真中，速率估计来自两半球TN细胞斜向偏好角对应的前后向视流，计算为：", "status": "translated", "notes": [], "sentence_ids": ["P023-B-S001"], "min_font_pt": 9, "reading_order": 125}, {"id": "P023-C", "page": 23, "bbox": [59.8, 286, 550.8, 331], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 285, 550.8, 329], "source": "where v is the velocity of the agent in Cartesian coordinatesR, q ˛½0; 2pÞ isTtNhe current headTiNng of the agent and 4 is the preference\nh TN\nangle of a TN-neuron, i.e., the point of expansion of optic flow that evokes the biggest response. For our model, a default preference\nangle of f = ð p=4Þ was used. TN2-neurons act as a rectified linear function, meaning they respond in a positive linearly proportional\nTN\nmanner to I , but have no response to negative flow (backward motion) (Figure S5A).\nTN", "translation": "其中v为笛卡尔坐标下的速度，θ_h∈[0,2π)为当前航向，φ_TN为使TN响应最大的视流扩张点偏好角；默认φ_TN=π/4。TN2为整流线性函数，即对I_TN作正向线性比例响应，对负视流（向后运动）不响应（图S5A）。（译注—存疑：下式max(0,2I_TN−1)在0<I_TN≤0.5时也为零，与此处“正向线性比例”描述不完全一致；作者公开代码tn2_output对flow直接截限至0–1。可能涉及公式或输入缩放差异，尚未核实发表时版本。）", "status": "translated", "notes": [{"type": "uncertain", "sentence_id": "P023-C-N001-S", "text": "（译注—存疑：下式max(0,2I_TN−1)在0<I_TN≤0.5时也为零，与此处“正向线性比例”描述不完全一致；作者公开代码tn2_output对flow直接截限至0–1。可能涉及公式或输入缩放差异，尚未核实发表时版本。）", "basis": "译注—存疑：下式max(0,2I_TN−1)在0<I_TN≤0.5时也为零，与此处“正向线性比例”描述不完全一致；作者公开代码tn2_output对flow直接截限至0–1。可能涉及公式或输入缩放差异，尚未核实发表时版本。", "sources": [{"title": "作者公开代码 cx_rate.py（当前master；不等同于已验证的发表时版本）", "url": "https://github.com/InsectRobotics/path-integration/blob/master/cx_rate.py"}]}], "sentence_ids": ["P023-C-S001", "P023-C-S002", "P023-C-N001-S"], "min_font_pt": 9, "reading_order": 126}, {"id": "P023-D", "page": 23, "bbox": [59.8, 349, 550.8, 429], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 349, 550.8, 429], "source": "Optional Gaussian noise ε can be added to the output, after which activity is clipped to fall between 0 and 1, as above.\nr\nHeading Layer 1 – TL-neurons\nThe first direction-related layer consists of 16 inhibitory TL-neurons, which have been shown to be polarization sensitive across a\nrange of insect species [13, 21, 23] and to encode visual landmarks used to compute heading direction in flies (ring neurons [11]).\nEach TL neuron has a preferred direction q , with the 16 neurons representing 8 cardinal directions q ˛ {0, p/4, p/2, 3p/4, p,\nTL TL\n5p/4 3p/2 7p/4} twice over. Collectively they encode the heading of the agent at every time step, by each receiving input activation\ncorresponding to the cosine of the angular difference between the current and their preferred heading:", "translation": "同前，可在输出加高斯噪声ε_r，再将活动截限至0–1。\n航向第1层——TL神经元\n第一方向层含16个抑制性TL。多种昆虫中已显示其偏振敏感性[13,21,23]，果蝇中还编码用于计算航向的视觉地标（环神经元[11]）。每个TL有偏好θ_TL；16个细胞把8个基本方向{0,π/4,π/2,3π/4,π,5π/4,3π/2,7π/4}各表示两次。每个时步，各细胞接收当前航向与其偏好航向角差的余弦输入，合起来编码航向：", "status": "translated", "notes": [], "sentence_ids": ["P023-D-S001", "P023-D-S002", "P023-D-S003", "P023-D-S004", "P023-D-S005"], "min_font_pt": 9, "reading_order": 127}, {"id": "P023-E", "page": 23, "bbox": [59.8, 449, 550.8, 527], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 449, 550.8, 527], "source": "Heading Layer 2 - CL1-neurons\nThe 16 CL1-neurons have a response as described in [71], i.e., they are inhibited by TL-neuron activity, effectively inverting the po-\nlarization response. This is included for completeness but makes no functional difference in our current model.\nHeading Layer 3 – TB1-neurons\nThe 8 TB1-neurons receive excitatory input from each pair of CL1-neurons that share same directional preference, q . The TB1-\nTB1\nlayer also contains mutually inhibitory connections (Figure S5B), with a weighting that reflects stronger inhibition for greater difference\nin their preferred directions [6, 7, 11]:", "translation": "航向第2层——CL1神经元\n16个CL1的响应如[71]：被TL活动抑制，相当于反转偏振响应。纳入此层是为完整性，并不改变当前模型功能。\n航向第3层——TB1神经元\n8个TB1各接收一对相同偏好θ_TB1的CL1兴奋输入。TB1层还有相互抑制连接（图S5B），偏好方向差越大，抑制权重越强[6,7,11]：", "status": "translated", "notes": [], "sentence_ids": ["P023-E-S001", "P023-E-S002", "P023-E-S003", "P023-E-S004"], "min_font_pt": 9, "reading_order": 128}, {"id": "P023-F", "page": 23, "bbox": [59.8, 555, 550.8, 568], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 555, 550.8, 568], "source": "Where q and q are the preferred directions of their respective CL1 inputs. The total input for each TB1 neuron is:\nTB1,i TB1,j", "translation": "θ_TB1,i与θ_TB1,j为相应CL1输入的偏好方向。每个TB1的总输入为：", "status": "translated", "notes": [], "sentence_ids": ["P023-F-S001", "P023-F-S002"], "min_font_pt": 9, "reading_order": 129}, {"id": "P023-G", "page": 23, "bbox": [59.8, 604, 550.8, 678], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 604, 550.8, 678], "source": "where c = 0.33 is a scaling factor for the relative effect of lateral TB1 inhibition compared to the direct CL1 excitation. This layer thus\nacts as a ring attractor [41], which creates a stable sinusoidal encoding of the heading direction, reducing noise from the previous\nlayers, and forming the underpinning for the accurate memory and steering functions in subsequent layers.\nLayer 4 - CPU4-neurons\nThe CPU4-layer consists of 16 neurons. The input for these neurons is an accumulation of heading q (t) of the agent represented by\nh\nthe sinusoidal TB1-response, modulating the speed signal from the TN2-neurons in the noduli, as reported in the current paper. In\naddition, there is a constant memory decay to all CPU4-cells:", "translation": "c=0.33衡量TB1侧抑制相对于CL1直接兴奋的效应。因此该层充当环形吸引子[41]，产生稳定的正弦航向编码，降低前层噪声，为后续准确记忆与转向奠定基础。\n第4层——CPU4神经元\nCPU4层含16个神经元。其输入累积智能体航向θ_h⁽ᵗ⁾（由TB1正弦响应表示），并调制小结TN2的速率信号，如本文所报告。另对全部CPU4施加恒定记忆衰减：", "status": "translated", "notes": [], "sentence_ids": ["P023-G-S001", "P023-G-S002", "P023-G-S003", "P023-G-S004", "P023-G-S005"], "min_font_pt": 9, "reading_order": 130}, {"id": "P023-H", "page": 23, "bbox": [59.8, 709, 550.8, 745], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [59.8, 709, 550.8, 745], "source": "where h = 0.0025 determines the rate of memory accumulation and k = 0.1 the uniform rate of memory loss. All memory cells\nare initialized with a charge of I(0) = 0.5 and as they accumulate are clipped on each time step to fall between 0 and 1. The eight\nTB1-neurons each provide input to two CPU4-neurons, each of which also receives input from a single TN2-cell, from the opposite", "translation": "h=0.0025决定记忆累积速率，k=0.1为均匀记忆损失率。记忆细胞初值I⁽⁰⁾=0.5，每步累积后截限至0–1。8个TB1各输入两个CPU4；每个CPU4还接收来自对侧", "status": "translated", "notes": [], "sentence_ids": ["P023-H-S001", "P023-H-S002", "P023-H-S003"], "min_font_pt": 9, "reading_order": 131}], "assets": [{"id": "P023-E01", "page": 23, "kind": "equation", "bbox": [274, 262, 430, 286], "source_bbox": [274, 262, 430, 286], "source": "原页23公式组1", "asset": "assets\\equation-23-01.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-056.png"}, {"id": "P023-E02", "page": 23, "kind": "equation", "bbox": [260, 331, 355, 344], "source_bbox": [260, 331, 355, 344], "source": "原页23公式组2", "asset": "assets\\equation-23-02.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-057.png"}, {"id": "P023-E03", "page": 23, "kind": "equation", "bbox": [260, 429, 350, 443], "source_bbox": [260, 429, 350, 443], "source": "原页23公式组3", "asset": "assets\\equation-23-03.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-058.png"}, {"id": "P023-E04", "page": 23, "kind": "equation", "bbox": [254, 528, 360, 548], "source_bbox": [254, 528, 360, 548], "source": "原页23公式组4", "asset": "assets\\equation-23-04.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-059.png"}, {"id": "P023-E05", "page": 23, "kind": "equation", "bbox": [245, 570, 380, 598], "source_bbox": [245, 570, 380, 598], "source": "原页23公式组5", "asset": "assets\\equation-23-05.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-060.png"}, {"id": "P023-E06", "page": 23, "kind": "equation", "bbox": [240, 678, 375, 704], "source_bbox": [240, 678, 375, 704], "source": "原页23公式组6", "asset": "assets\\equation-23-06.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-061.png"}], "analysis": []}, {"page": 24, "original": "image-062.jpg", "background": "image-063.jpg", "blocks": [{"id": "P024-A", "page": 24, "bbox": [53.1, 100, 544.1, 157], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 100, 544.1, 157], "source": "hemisphere. As these neurons integrate the velocity (speed and direction) of the agent, activity across this layer at any point in time\nprovides a population encoding of the home vector.\nLayer 5 - Pontine neurons\n16 pontine neurons project contralaterally and connect two CBU columns eight columns apart from one another [30, 33, 35, 45] (see\nFigures S4E, S4F, and S5B). Each cell receives input from one CPU4-column:", "translation": "脑半球的一个TN2输入。由于它们整合智能体的速度（速率与方向），任意时刻该层群体活动都编码归巢向量。\n第5层——桥接神经元\n16个桥接神经元跨向对侧，连接CBU内相隔8柱的两个柱[30,33,35,45]（图S4E、S4F、S5B）。每个细胞接收一个CPU4柱的输入：", "status": "translated", "notes": [], "sentence_ids": ["P024-A-S001", "P024-A-S002", "P024-A-S003", "P024-A-S004"], "min_font_pt": 9, "reading_order": 140}, {"id": "P024-B", "page": 24, "bbox": [53.1, 179, 544.1, 266], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 179, 544.1, 266], "source": "Layer 6 - CPU1-neurons\nThe CPU1-layer has 16 neurons. It consists of two subtypes of neurons, CPU1a and CPU1b that exhibit distinct projection patterns\nbetween the PB and the CBU and are conserved across insect species [30, 31, 33]. Each TB1-neuron provides inhibitory inputs\n(weight = (cid:3)1) to two CPU1-neurons, in the same pattern as TB1-CPU4 connections. Additionally, each CPU4-neuron provides input\nto a CPU1-neuron, but with the offset connectivity pattern shown in Figure 5, which produces the connectivity matrix shown in Fig-\nure S5B. As TB1-input is inhibitory and CPU4-input excitatory, the effective input to CPU1-cells is the difference of the activity in\nthese units, representing the difference between the integrated path and the current heading direction. Finally, CPU1-cells also\nreceive inhibitory input from contralateral pontine neurons so their total input is:", "translation": "第6层——CPU1神经元\nCPU1层有16个神经元，分CPU1a、CPU1b两个亚型；其PB与CBU间投射模式不同，在昆虫中保守[30,31,33]。各TB1抑制两个CPU1（权重−1），模式同TB1–CPU4。各CPU4还输入一个CPU1，但有图5的偏移连接，形成图S5B矩阵。TB1抑制、CPU4兴奋，因此CPU1的有效输入为两者活动差，表示积分路径与当前航向之差。CPU1还接受对侧桥接神经元的抑制输入，总输入如下。（译注—已核实：下式桥接项写为“+”，与本句及图5I的减法抑制不符；按作者所述抑制关系应取负号。公开代码CXRatePontin.cpu1a_output和cpu1b_output亦减去该项；此处只确认符号不一致，不据当前代码重写整式。）", "status": "translated", "notes": [{"type": "verified_error", "sentence_id": "P024-B-N001-S", "text": "（译注—已核实：下式桥接项写为“+”，与本句及图5I的减法抑制不符；按作者所述抑制关系应取负号。公开代码CXRatePontin.cpu1a_output和cpu1b_output亦减去该项；此处只确认符号不一致，不据当前代码重写整式。）", "basis": "译注—已核实：下式桥接项写为“+”，与本句及图5I的减法抑制不符；按作者所述抑制关系应取负号。公开代码CXRatePontin.cpu1a_output和cpu1b_output亦减去该项；此处只确认符号不一致，不据当前代码重写整式。", "sources": [{"title": "作者公开代码 cx_rate.py（当前master；不等同于已验证的发表时版本）", "url": "https://github.com/InsectRobotics/path-integration/blob/master/cx_rate.py"}]}], "sentence_ids": ["P024-B-S001", "P024-B-S002", "P024-B-S003", "P024-B-S004", "P024-B-S005", "P024-B-N001-S"], "min_font_pt": 9, "reading_order": 141}, {"id": "P024-C", "page": 24, "bbox": [53.1, 290, 544.1, 331], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 290, 544.1, 331], "source": "The CPU1-neurons form two sets, connecting to either the right or left motor units (postulated to be located in the lateral accessory\nlobes, the anatomical convergence site of CPU1-neurons). The activation of each set is summed, and the difference determines the\nturning direction and angle of the agent. Currently this is done by multiplying the difference in summed activity by a constant m = 0.5,\nwhich is used to change the heading of the agent by that number of radians:", "translation": "CPU1分成两组，分别连接左右运动单元（假定位于CPU1汇聚的侧附叶）。各组激活求和，再以总活动差决定转向方向和角度。目前将差值乘常数m=0.5，以所得弧度改变智能体航向：", "status": "translated", "notes": [], "sentence_ids": ["P024-C-S001", "P024-C-S002", "P024-C-S003"], "min_font_pt": 9, "reading_order": 142}, {"id": "P024-D", "page": 24, "bbox": [53.1, 372, 544.1, 415], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 372, 544.1, 415], "source": "All connection weight matrices and other model parameters can be seen in Figure S5. In our model, the unit of distance is arbitrary, so\nwe describe everything here in terms of steps in x and y and time steps t, which provides a meaningful measure of accuracy on a hom-\ning task by examining the tortuosity of a homing route, the angular errors, and errors relative to the distance of the outbound path.\nOutbound routes were generated by a filtered noise process, approximating a second order stochastic differential equation (SDE):", "translation": "全部连接权重矩阵和其他参数见图S5。模型距离单位任意，故以x、y方向步数及时步t描述；可据返程曲折度、角误差及相对外出距离的误差，有意义地衡量归巢精度。\n外出路径由滤波噪声过程产生，近似二阶随机微分方程（SDE）：", "status": "translated", "notes": [], "sentence_ids": ["P024-D-S001", "P024-D-S002", "P024-D-S003"], "min_font_pt": 9, "reading_order": 143}, {"id": "P024-E", "page": 24, "bbox": [53.1, 447, 544.1, 459], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 447, 544.1, 459], "source": "where for each time step the change in angular velocity ε was generated by drawing from a von Mises distribution with zero mean:\nu", "translation": "每个时步的角速度变化ε_u抽自零均值von Mises分布：", "status": "translated", "notes": [], "sentence_ids": ["P024-E-S001"], "min_font_pt": 9, "reading_order": 144}, {"id": "P024-F", "page": 24, "bbox": [53.1, 479, 544.1, 513], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 479, 544.1, 513], "source": "where m measures the location and k is the concentration. For our simulations k = 100, with smaller values increasing the tortuosity\nof the outbound route. We used l = 0.4, to minimize excessive spiraling motion. Acceleration for outbound routes is generated by\ndrawing ðT=50Þ evenly spaced values from a uniform distribution:", "translation": "μ为位置参数，κ为集中度。仿真κ=100；越小，外出路径越曲折。λ=0.4，以减少过多盘旋。外出加速度通过在均匀间隔的T/50个位置抽取均匀分布值产生：", "status": "translated", "notes": [], "sentence_ids": ["P024-F-S001", "P024-F-S002", "P024-F-S003", "P024-F-S004"], "min_font_pt": 9, "reading_order": 145}, {"id": "P024-G", "page": 24, "bbox": [53.1, 535, 544.1, 565], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 535, 544.1, 565], "source": "and setting the acceleration between those points using third order spline interpolation, causing the agent to speed up and slow\ndown in a smooth manner, thus imitating natural flight behavior. Velocity of the agent is determined at each time step by a linear\ndrag model:\n(cid:2) (cid:3)", "translation": "再以三次样条插值设置这些点之间的加速度，使智能体平滑加、减速，模仿自然飞行。每时步速度由线性阻力模型确定：", "status": "translated", "notes": [], "sentence_ids": ["P024-G-S001", "P024-G-S002"], "min_font_pt": 9, "reading_order": 146}, {"id": "P024-H", "page": 24, "bbox": [53.1, 612, 544.1, 645], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 612, 544.1, 645], "source": "where F = 0.15 is the default drag. For regular trials a = 0 and a = 0.15 were tuned to cause v to mostly fall below 0 and 1,\nD min max\nallowing the TN cells to capture all speeds without their activity saturating, whereas for inbound paths a constant a = 0.1 was\nused. The agent’s starting position on each simulation is x(0) = 0, y(0) = 0. These are updated iteratively depending on the velocity.", "translation": "默认阻力F_D=0.15。常规试验将a_min=0、a_max=0.15调至v大多落于0与1之下，使TN可编码全部速率而不饱和；返程恒定a=0.1。各次仿真起点x⁽⁰⁾=y⁽⁰⁾=0，随后依速度迭代更新。", "status": "translated", "notes": [], "sentence_ids": ["P024-H-S001", "P024-H-S002", "P024-H-S003"], "min_font_pt": 9, "reading_order": 147}, {"id": "P024-I", "page": 24, "bbox": [53.1, 692, 544.1, 749], "kind": "paragraph", "font_pt": 9.5, "source_bbox": [53.1, 692, 544.1, 749], "source": "Detailed model assumptions\nBeyond the experimental data, two fundamental assumptions underlie the model: 1) Input and output regions of CX-cell types (cell\npolarity) can be reliably inferred from morphologically distinct fiber terminals (smooth versus blebbed). 2) Overlapping fibers with\nopposite polarity are synaptically connected. Combined, this generates systematic connections between all major CX cell-types\nthat are dictated directly by their interhemispheric projection patterns. Each of those connections is detailed below together with", "translation": "详细模型假设\n除实验数据外，模型有两项基本假设：①可据光滑、串珠状末梢的形态可靠推断CX细胞输入输出极性；②极性相反、分枝重叠的纤维形成突触。这使跨半球投射模式直接规定各主要细胞类型之间的系统连接。以下逐项列出连接及其", "status": "translated", "notes": [], "sentence_ids": ["P024-I-S001", "P024-I-S002", "P024-I-S003"], "min_font_pt": 9, "reading_order": 148}], "assets": [{"id": "P024-E01", "page": 24, "kind": "equation", "bbox": [269, 157, 335, 176], "source_bbox": [269, 157, 335, 176], "source": "原页24公式组1", "asset": "assets\\equation-24-01.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-064.png"}, {"id": "P024-E02", "page": 24, "kind": "equation", "bbox": [250, 269, 375, 286], "source_bbox": [250, 269, 375, 286], "source": "原页24公式组2", "asset": "assets\\equation-24-02.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-065.png"}, {"id": "P024-E03", "page": 24, "kind": "equation", "bbox": [200, 332, 410, 367], "source_bbox": [200, 332, 410, 367], "source": "原页24公式组3", "asset": "assets\\equation-24-03.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-066.png"}, {"id": "P024-E04", "page": 24, "kind": "equation", "bbox": [230, 418, 370, 444], "source_bbox": [230, 418, 370, 444], "source": "原页24公式组4", "asset": "assets\\equation-24-04.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-067.png"}, {"id": "P024-E05", "page": 24, "kind": "equation", "bbox": [250, 461, 350, 474], "source_bbox": [250, 461, 350, 474], "source": "原页24公式组5", "asset": "assets\\equation-24-05.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-068.png"}, {"id": "P024-E06", "page": 24, "kind": "equation", "bbox": [270, 516, 340, 529], "source_bbox": [270, 516, 340, 529], "source": "原页24公式组6", "asset": "assets\\equation-24-06.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-069.png"}, {"id": "P024-E07", "page": 24, "kind": "equation", "bbox": [225, 564, 395, 605], "source_bbox": [225, 564, 395, 605], "source": "原页24公式组7", "asset": "assets\\equation-24-07.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-070.png"}, {"id": "P024-E08", "page": 24, "kind": "equation", "bbox": [255, 649, 360, 679], "source_bbox": [255, 649, 360, 679], "source": "原页24公式组8", "asset": "assets\\equation-24-08.png", "status": "retained", "reason": "数学公式保留原页符号；原文疑点另附句末译注", "uri": "image-071.png"}], "analysis": []}, {"page": 25, "original": "image-072.jpg", "background": "image-073.jpg", "blocks": [{"id": "P025-BODY", "page": 25, "bbox": [59, 100, 551, 749], "kind": "paragraph", "font_pt": 10, "source_bbox": [59, 100, 551, 749], "source": "the evidence that directly supports these connections. Assumptions strongly supported by evidence are marked with ***, assump-\ntions with weaker support are marked with **, while assumptions with little support (i.e., predictions) are marked with *.\n***Connectivity – assumption 1: TB1-neurons form a ring attractor network by mutually inhibitory connections onto one\nanother, whose synaptic weights increase with distance of each TB-neuron pair\nEvidence. TB1-cells have no input fibers in PB-columns that neighbor their output fibers, i.e., neighboring TB1-cells cannot connect\nto one another. Second, density of input fibers is highest in columns most distant from output fibers. Third, in locusts, responses of\nCPU1-cells (likely postsynaptic to TB1) are maximally out of phase with TB1-cells, indicating that TB1-cells are likely inhibitory. Also,\nlocust TB1-cells contain the neuropeptide Allatostatin [7], that has been shown to possess inhibitory receptors.\n***Connectivity – assumption 2: TB1-cells synapse onto CPU1 and CPU4-cells in regions of overlapping arborizations\nEvidence. Both TB1- and CPU1-cells contribute to the mapping of polarized light tunings in locusts, with CPU1-cells out of phase\nfrom TB1-cell output columns [7]. Additionally, anatomical polarities of CPU1- and TB1-cells are very pronounced and CPU1-cells\nadditionally show clear postsynaptic potentials when recorded from the PB [72]. Moreover, the TB1-output fibers are the most prom-\ninent columnar output arborizations of the PB conserved across insects [7, 20, 31–33]. This leaves these cells as the most likely pre-\nsynaptic cells to all columnar cells with input in the PB, including CPU4-cells. In locusts, CPU4-cells are conditionally polarization\nsensitive, with the PB being the most likely source of this information [19]. The only other cell type with major outputs in the PB (likely\npresynaptic to TB1) are CL1a-neurons [19, 20, 30, 33]. While a network involving CL1a to CPU1 and CPU4 connections with similar\noverall properties is thinkable, it would be more complex and require more subsequent assumptions.\n**Connectivity – assumption 3: CPU4-cells synapse onto CPU1-cells in a way that is reflected in their arborization\npatterns\nEvidence. In the CBU the polarity of CPU1-cells is postsynaptic, while CPU4 anatomy clearly indicates presynaptic terminals [30–33].\nPolarity predicted by anatomical means (clear varicose versus smooth terminals) in locust and monarch butterfly CX has proven cor-\nrect across species in all cases by mapping of presynaptic marker proteins in Drosophila (compare e.g., [30] and [32]). This makes the\nCPU1-cells (together with the highly similar CPU2 cells) the only potential target cells for CPU4-outputs that exist across all species.\nThe only cell type that is equally likely to receive input from the CPU4-cells are pontine cells, which provide direct connections be-\ntween ipsi- and contralateral columns within the CBU [30, 33–35, 45]. As these cells likely also target the CPU1-neurons, there is\neither a direct connection between CPU4- and CPU1-cells, an indirect connection between them, or a combination. In fact, our model\nbecomes most robust, if both of these connections are used, which also represents the most parsimonious interpretation of the\nanatomical data: All overlapping arborizations with the correct polarity are equally likely to correspond to synaptic connections.\n*Memory – assumption 1:
