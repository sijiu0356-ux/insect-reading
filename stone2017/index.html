<script>
const DATA={"title": "蜜蜂脑中一个受解剖结构约束的路径积分模型", "overview": "研究问题：蜂脑如何结合视觉罗盘和视流完成路径积分？方法：Megalopta细胞内记录、熊蜂块面电镜、受解剖约束的放电率网络、智能体及机器人测试。证据：罗盘/速率信息在CX汇聚，TN与候选CPU4存在突触接触；回路可积分部分全向运动并产生转向。边界：CPU4持续活动记忆、桥接抑制与状态门控仍是不同强度的假设；模型成功不等于逐条突触及其生理机制已证实。已读本文件29页正文、图注、资源表和完整STAR Methods，核对75条参考文献信息。文件外7张补充图与3段视频未作为完整附件取得，未声称已读。", "pages": [{"page": 1, "original": "image-001.jpg", "background": "image-002.jpg", "blocks": [{"id": "P001-TITLE", "page": 1, "bbox": [53, 98, 545, 144], "kind": "heading", "font_pt": 19, "source_bbox": [53, 98, 545, 144], "source": "An Anatomically Constrained Model for Path\nIntegration in the Bee Brain", "translation": "蜜蜂脑中一个受解剖结构约束的路径积分模型", "status": "translated", "notes": [], "sentence_ids": ["P001-TITLE-S001"], "min_font_pt": 9, "reading_order": 1}, {"id": "P001-HIGHLIGHTS", "page": 1, "bbox": [53, 153, 343, 320], "kind": "paragraph", "font_pt": 11, "source_bbox": [53, 153, 343, 320], "source": "Highlights\nd Central complex neuroarchitecture suffices as a path\nintegration circuit\nd Compass heading and forward speed information converge\nin the bee central complex\nd Columnar noduli neurons plausibly encode a distributed\nmemory of the home vector\nd The circuit additionally compares current and desired\nheadings to initiate steering", "translation": "研究亮点\n• 中央复合体的神经架构足以构成路径积分回路。\n• 罗盘航向与前进速率信息在蜜蜂中央复合体汇聚。\n• 小结中的柱状神经元可能编码归巢向量的分布式记忆。\n• 该回路还比较当前航向与期望航向，以启动转向。", "status": "translated", "notes": [], "sentence_ids": ["P001-HIGHLIGHTS-S001", "P001-HIGHLIGHTS-S002", "P001-HIGHLIGHTS-S003", "P001-HIGHLIGHTS-S004"], "min_font_pt": 9, "reading_order": 2}, {"id": "P001-AUTHOR", "page": 1, "bbox": [355, 153, 546, 256], "kind": "metadata", "font_pt": 10, "source_bbox": [355, 153, 546, 256], "source": "Authors\nThomas Stone, Barbara Webb,\nAndrea Adden, ..., Luca Scimeca,\nEric Warrant, Stanley Heinze\nCorrespondence\nstanley.heinze@biol.lu.se", "translation": "作者\nThomas Stone、Barbara Webb、Andrea Adden、……、Luca Scimeca、Eric Warrant、Stanley Heinze\n通讯联系\nstanley.heinze@biol.lu.se", "status": "translated", "notes": [], "sentence_ids": ["P001-AUTHOR-S001"], "min_font_pt": 8, "reading_order": 3}, {"id": "P001-BRIEF", "page": 1, "bbox": [355, 267, 546, 418], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [355, 267, 546, 418], "source": "In Brief\nStone et al. present the first fully\nbiologically constrained model of path\nintegration in the insect brain. This\ncombines newly identified speed and\ncompass neuron convergence with\nknown anatomical features of the central\ncomplex and provides a novel functional\ninterpretation of this neuropil’s role\nacross all orientation behaviors.", "translation": "内容简述\nStone 等人提出首个完全受生物学约束的昆虫脑路径积分模型。它将新发现的速率神经元与罗盘神经元的信息汇聚，与已知中央复合体解剖特征相结合，为该神经毡在各种定向行为中的作用提供了新的功能解释。", "status": "translated", "notes": [], "sentence_ids": ["P001-BRIEF-S001", "P001-BRIEF-S002"], "min_font_pt": 9, "reading_order": 4}], "assets": [], "analysis": []}, {"page": 2, "original": "image-003.jpg", "background": "image-004.jpg", "blocks": [{"id": "P002-TITLE", "page": 2, "bbox": [53, 99, 545, 145], "kind": "heading", "font_pt": 19, "source_bbox": [53, 99, 545, 145], "source": "An Anatomically Constrained Model\nfor Path Integration in the Bee Brain", "translation": "蜜蜂脑中一个受解剖结构约束的路径积分模型", "status": "translated", "notes": [], "sentence_ids": ["P002-TITLE-S001"], "min_font_pt": 9, "reading_order": 5}, {"id": "P002-AUTHOR", "page": 2, "bbox": [53, 153, 545, 255], "kind": "metadata", "font_pt": 9, "source_bbox": [53, 153, 545, 255], "source": "Thomas Stone,2 Barbara Webb,2 Andrea Adden,1 Nicolai Ben Weddig,2,5 Anna Honkanen,1 Rachel Templin,3\nWilliam Wcislo,4 Luca Scimeca,2 Eric Warrant,1 and Stanley Heinze1,6,*\n1Lund Vision Group, Department of Biology, Lund University, Lund, Sweden\n2School of Informatics, University of Edinburgh, Edinburgh, UK\n3Queensland Brain Institute, University of Queensland, Brisbane, Australia\n4Smithsonian Tropical Research Institute, Panama City, Panama\n5Present address: Department for Bionics, Hochschule Bremen, Bremen, Germany\n6Lead Contact\n*Correspondence: stanley.heinze@biol.lu.se\nhttp://dx.doi.org/10.1016/j.cub.2017.08.052", "translation": "Thomas Stone²、Barbara Webb²、Andrea Adden¹、Nicolai Ben Weddig²˒⁵、Anna Honkanen¹、Rachel Templin³、William Wcislo⁴、Luca Scimeca²、Eric Warrant¹、Stanley Heinze¹˒⁶˒*\n¹ 瑞典隆德大学生物学系，隆德视觉研究组，隆德；² 英国爱丁堡大学信息学院，爱丁堡\n³ 澳大利亚昆士兰大学昆士兰脑研究所，布里斯班；⁴ 巴拿马史密森热带研究所，巴拿马城\n⁵ 现地址：德国不来梅应用科学大学仿生学系，不来梅；⁶ 首要联系人\n* 通讯：stanley.heinze@biol.lu.se\nhttp://dx.doi.org/10.1016/j.cub.2017.08.052", "status": "translated", "notes": [], "sentence_ids": ["P002-AUTHOR-S001"], "min_font_pt": 8, "reading_order": 6}, {"id": "P002-SUMMARY", "page": 2, "bbox": [53, 276, 293, 681], "kind": "paragraph", "font_pt": 11, "source_bbox": [53, 276, 293, 681], "source": "SUMMARY\nPath integration is a widespread navigational strat-\negy in which directional changes and distance\ncovered are continuously integrated on an outward\njourney, enabling a straight-line return to home.\nBees use vision for this task—a celestial-cue-based\nvisual compass and an optic-flow-based visual\nodometer—but the underlying neural integration\nmechanisms are unknown. Using intracellular elec-\ntrophysiology, we show that polarized-light-based\ncompass neurons and optic-flow-based speed-en-\ncoding neurons converge in the central complex of\nthe bee brain, and through block-face electron micro-\nscopy, we identify potential integrator cells. Based on\nplausible output targets for these cells, we propose a\ncomplete circuit for path integration and steering in\nthe central complex, with anatomically identified neu-\nrons suggested for each processing step. The result-\ning model circuit is thus fully constrained biologically\nand provides a functional interpretation for many pre-\nviously unexplained architectural features of the cen-\ntral complex. Moreover, we show that the receptive\nfields of the newly discovered speed neurons can\nsupport path integration for the holonomic motion\n(i.e., a ground velocity that is not precisely aligned\nwith body orientation) typical of bee flight, a feature\nnot captured in any previously proposed model of\npath integration. In a broader context, the model\ncircuit presented provides a general mechanism for\nproducing steering signals by comparing current\nand desired headings—suggesting a more basic\nfunction for central complex connectivity, from which\npath integration may have evolved.", "translation": "摘要\n路径积分是一种广泛存在的导航策略：在外出过程中持续整合方向变化和已行进距离，从而能够直线返回巢穴。蜜蜂依靠视觉完成这项任务，包括以天体线索为基础的视觉罗盘和以视流为基础的视觉里程计，但其背后的神经整合机制尚不清楚。我们通过细胞内电生理记录发现，基于偏振光的罗盘神经元和基于视流的速率编码神经元在蜜蜂脑的中央复合体汇聚，并通过块面电子显微成像识别出潜在的积分细胞。根据这些细胞可能的输出靶标，我们提出中央复合体内一个完整的路径积分与转向回路，并为每一处理步骤指定了经解剖识别的候选神经元。因此，这一模型回路完全受到生物学约束，并为中央复合体中许多以往未获解释的结构特征提供了功能解释。此外，我们表明，新发现的速率神经元的感受野能够支持蜜蜂飞行中典型的全向运动——即对地速度方向并不与身体朝向严格一致的运动——的路径积分；以往提出的路径积分模型均未涵盖这一特征。从更广泛的角度看，该模型回路通过比较当前航向与期望航向，提供了产生转向信号的通用机制。这提示中央复合体连接结构可能具有一种更基础的功能，而路径积分可能是在此基础上演化而来。", "status": "translated", "notes": [], "sentence_ids": ["P002-SUMMARY-S001", "P002-SUMMARY-S002", "P002-SUMMARY-S003", "P002-SUMMARY-S004", "P002-SUMMARY-S005", "P002-SUMMARY-S006", "P002-SUMMARY-S007", "P002-SUMMARY-S008"], "min_font_pt": 9, "reading_order": 7}, {"id": "P002-INTRO", "page": 2, "bbox": [53, 692, 293, 749], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [53, 692, 293, 749], "source": "INTRODUCTION\nAnimals with a fixed nest use diverse sensory cues to ensure that\nthey can return home after extended foraging trips. One wide-\nspread yet sophisticated strategy for carrying out this task is", "translation": "引言\n有固定巢穴的动物利用多种感觉线索，确保长途觅食后仍能返巢。完成这一任务的一种广泛存在而又精巧的策略是", "status": "translated", "notes": [], "sentence_ids": ["P002-INTRO-S001", "P002-INTRO-S002"], "min_font_pt": 9, "reading_order": 8}, {"id": "P002-RIGHT", "page": 2, "bbox": [304, 276, 544, 749], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [304, 276, 544, 749], "source": "path integration [1, 2]: the animal continuously integrates the\ndistance covered in each direction over the duration of the\noutbound foraging trip to generate a homeward-pointing vector\nthat allows a straight-line return to the nest. This ‘‘allothetic’’ path\nintegration, i.e., maintenance of an estimate of location relative\nto a world-based frame of reference (hereafter referred to as\npath integration for brevity), uses a combination of different\nself-generated motion cues in most animals. In bees, however,\nvisual information alone is key to this task [1], making them\nuniquely accessible for identifying the neural components\ninvolved. Celestial skylight cues, such as polarized light, are\nused as a compass reference [3], whereas image motion across\nthe retina (optic flow), caused by the movement of the bee\nthrough its environment, is used for estimating distance (visual\nodometer) [1, 4]. Across the planet, bee species perform this\nbehavior in a large variety of sensory environments, suggesting\nthat the underlying neural mechanisms are both robust and\nconserved. However, despite rich behavioral data, the neural ba-\nsis of path integration in bees, or insects in general, is unknown,\nalthough several hypothetical circuits have been proposed\n(reviewed and compared in [5]). One region of the insect brain\nthat plays a prominent role in orientation behaviors is the central\ncomplex (CX), a conglomerate of highly conserved brain com-\npartments [6]. In migratory locusts and fruit flies, this region\nhouses an ordered array of compass neurons, which encode\nheading based on celestial visual cues in the locust [7] and based\non a combination of visual and self-motion cues in Drosophila [8].\nAdditionally, the activity of individual CX neurons can reliably\npredict intended movement directions in freely walking cock-\nroaches, indicating direct involvement in steering [9]. These\nand similar findings place the CX on the boundary between\nhigher order sensory processing and behavioral planning. We\nhere provide a biologically constrained, computational model\nof the CX that combines novel physiological findings with highly\nconserved anatomical properties of CX neurons found across in-\nsects to provide a coherent account of how path integration and\nhomeward steering could be implemented in this neuropil.\nRESULTS\nVisual Compass Sensing in the Bee CX\nIntegrating an outbound foraging path requires sensing of\ndirection and speed, and in most arthropods, the directional", "translation": "路径积分[1,2]：动物在外出觅食的整个过程中，持续整合在各个方向上行进的距离，生成一个指向巢穴的向量，从而直线返巢。这种“依赖外部参照的”（allothetic）路径积分，即在以世界为参照的坐标系中维持对自身位置的估计（下文简称路径积分），在多数动物中会结合多种由自身运动产生的线索。然而对蜜蜂而言，仅视觉信息就对这项任务起着关键作用[1]，因此特别适于研究其中的神经组成。偏振光等天空光线索被用作罗盘参照[3]；蜜蜂穿行环境时导致的视网膜像运动，即视流，则用于估计距离，构成视觉里程计[1,4]。全球各地的蜂类在多样的感觉环境中表现出这种行为，提示其神经机制既稳健又保守。但尽管行为数据丰富，蜜蜂乃至一般昆虫路径积分的神经基础仍不清楚，虽已有若干假说回路提出（综述及比较见[5]）。\n在昆虫脑中，中央复合体（central complex，CX）是对定向行为十分重要的区域，由一组高度保守的脑区构成[6]。在迁飞蝗虫和果蝇中，这一区域包含有序排列的罗盘神经元：蝗虫利用天体视觉线索编码航向[7]，果蝇则结合视觉和自身运动线索[8]。此外，在自由行走的蟑螂中，单个 CX 神经元的活动能够可靠预测预期运动方向，表明其直接参与转向[9]。这些及类似发现将 CX 置于高阶感觉处理与行为规划的交界处。我们在此提出一个受生物学约束的 CX 计算模型，将新的生理学发现与昆虫共有的高度保守的 CX 神经元解剖特征相结合，系统说明这一神经毡可能如何实现路径积分与归巢转向。\n结果\n蜜蜂 CX 中的视觉罗盘感知\n对外出觅食路径进行积分，需要感知方向和速率；在多数节肢动物中，方向", "status": "translated", "notes": [], "sentence_ids": ["P002-RIGHT-S001", "P002-RIGHT-S002", "P002-RIGHT-S003", "P002-RIGHT-S004", "P002-RIGHT-S005", "P002-RIGHT-S006", "P002-RIGHT-S007", "P002-RIGHT-S008", "P002-RIGHT-S009", "P002-RIGHT-S010", "P002-RIGHT-S011", "P002-RIGHT-S012"], "min_font_pt": 9, "reading_order": 9}], "assets": [], "analysis": []}, {"page": 3, "original": "image-005.jpg", "background": "image-006.jpg", "blocks": [{"id": "P003-CAPTION", "page": 3, "bbox": [395, 100, 551, 464], "kind": "caption", "font_pt": 8.5, "source_bbox": [395, 100, 551, 464], "source": "Figure 1. Compass Neurons of the Bee\nCentral Complex\n(A) Brain of the sweat bee Megalopta genalis (body\nlength: 1–2 cm; photo: A. Narendra). Highlight/\ninset shows compass regions.\n(B) 3D reconstructions of polarized-light-sen-\nsitive compass neurons based on intracellular\ninjections.\n(C) Schematic stimulus: rotating, large polarizer,\nilluminated with an array of UV LEDs (artificial sky).\n(D) Recording trace from individual TL neuron\nduring polarizer rotation (bottom: membrane\nvoltage; top: sliding-average mean activity).\n(E) Tuning of two TL neurons (one on each brain\nhemisphere) to polarized light angle for clockwise\n(blue; 360(cid:1)–0(cid:1)) and counter-clockwise (orange;\n0(cid:1)–360(cid:1)) filter rotations (binned mean activity; in-\ndividual rotations). Black circles, background firing\nrate.\n(F) Distribution of tuning angles for clockwise\nrotations (CW) and counter-clockwise (CCW)\nrotations.\n(G) Distribution of difference angles between\nCW and CCW tunings (mean ± SD is indicated\nnumerically).\n(H) Tuning curves of all recorded compass neu-\nrons (n = 10); normalized to peak activity, minimum\nactivity set to zero, peak activity shifted to 0(cid:1),\ntuning width measured at half-maximal excitation.\nBlack curves, population mean. Mean width ± SD\nis indicated for each graph.\nAbbreviations: CBL, lower division of the central\nbody; CBU, upper division of the central body;\nGA, gall; LAL, lateral accessory lobes; LBU, lateral\nbulb; MBU, medial bulb; NO, noduli; PB, proto-\ncerebral bridge. Scale bars represent 100 mm,\nexcept for the brain in (A), where they represent\n200 mm. See also Figure S4.", "translation": "图1　蜜蜂中央复合体的罗盘神经元\n(A) 汗蜂 Megalopta genalis 的脑（体长1–2 cm；照片：A. Narendra）。高亮区/插图显示罗盘相关脑区。\n(B) 根据细胞内注射重建的偏振光敏感罗盘神经元三维形态。\n(C) 刺激示意：紫外 LED 阵列（人工天空）照亮旋转的大型偏振片。\n(D) 偏振片旋转时单个 TL 神经元的记录；下方为膜电位，上方为滑动平均活动。\n(E) 两个 TL 神经元（两侧脑各一个）在偏振片顺时针（蓝色；360°→0°）和逆时针（橙色；0°→360°）旋转时对偏振角的调谐（分箱平均活动；各次旋转）。黑圈为背景放电率。\n(F) 顺时针（CW）与逆时针（CCW）旋转时调谐角的分布。\n(G) CW 与 CCW 调谐角之差的分布；数值为均值±标准差（SD）。\n(H) 全部罗盘神经元（n=10）的调谐曲线：按峰值归一化，最小值设零，峰值移至0°，以半最大兴奋处宽度定义调谐宽度。黑线为群体平均，各图标示平均宽度±SD。\n缩写：CBL，中央体下分区；CBU，中央体上分区；GA，瘤状体；LAL，侧附叶；LBU，外侧球；MBU，内侧球；NO，小结；PB，前脑桥。比例尺为100 μm，(A)中的脑为200 μm。另见图S4。", "status": "translated", "notes": [], "sentence_ids": ["P003-CAPTION-S001", "P003-CAPTION-S002", "P003-CAPTION-S003", "P003-CAPTION-S004", "P003-CAPTION-S005", "P003-CAPTION-S006", "P003-CAPTION-S007", "P003-CAPTION-S008", "P003-CAPTION-S009", "P003-CAPTION-S010", "P003-CAPTION-S011", "P003-CAPTION-S012", "P003-CAPTION-S013", "P003-CAPTION-S014"], "min_font_pt": 8, "reading_order": 10}, {"id": "P003-LEFT", "page": 3, "bbox": [59, 627, 300, 749], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [59, 627, 300, 749], "source": "information is obtained from external celestial compass cues.\nTo build a realistic model of path integration based on the bee\nCX, we thus first needed to identify visual compass neurons\nin bees. In locusts and butterflies, polarized light information\nis relayed to the CX via a highly conserved neural pathway\n[10, 11], which, in locusts, has been shown to produce an or-\ndered array of compass neurons, suited to encode heading in\na global reference frame due to the fixed relation between E-vec-\ntor angle and solar azimuth [7]. In flies, homologous cells also\nencode head direction, suggesting that mapping of directional\nspace in the CX is a shared feature across insects [8, 12]. These", "translation": "信息来自外部天体罗盘线索。因此，要建立基于蜜蜂 CX 的现实路径积分模型，我们首先需要在蜜蜂中鉴定视觉罗盘神经元。在蝗虫和蝴蝶中，偏振光信息经一条高度保守的神经通路传至 CX[10,11]；蝗虫研究表明，该通路形成有序排列的罗盘神经元，由于电矢量角与太阳方位角之间有固定关系，适于在全局参照系中编码航向[7]。果蝇中的同源细胞也编码头部朝向，提示 CX 对方向空间的映射是昆虫的共有特征[8,12]。这些", "status": "translated", "notes": [], "sentence_ids": ["P003-LEFT-S001", "P003-LEFT-S002", "P003-LEFT-S003", "P003-LEFT-S004", "P003-LEFT-S005"], "min_font_pt": 9, "reading_order": 11}, {"id": "P003-RIGHT1", "page": 3, "bbox": [395, 495, 551, 627], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [395, 495, 551, 627], "source": "cells encode head direction based on vi-\nsual landmark cues but are also updated\nby self-motion cues in the absence of\nvision [8], a finding recently confirmed in\ncockroach head-direction cells [13]. As\nbees possess specialized eye regions\nfor perceiving polarized light [14, 15] and\nuse a polarized-light-based compass\nduring foraging, we first ask whether\npolarized-light-based compass neurons\nalso exist in the bee CX (Figure 1). For\nphysiological recordings, we focused on", "translation": "细胞依据视觉地标编码头部朝向；无视觉输入时，也可由自身运动线索更新[8]。近期蟑螂头方向细胞的研究证实了这一点[13]。蜂类复眼具有感知偏振光的特化区域[14,15]，觅食时使用偏振光罗盘，因此我们首先检验蜜蜂 CX 是否也有此类罗盘神经元（图1）。生理记录聚焦于", "status": "translated", "notes": [], "sentence_ids": ["P003-RIGHT1-S001", "P003-RIGHT1-S002", "P003-RIGHT1-S003", "P003-RIGHT1-S004"], "min_font_pt": 9, "reading_order": 12}, {"id": "P003-RIGHT2", "page": 3, "bbox": [310, 627, 551, 749], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [310, 627, 551, 749], "source": "the CX of the tropical nocturnal bee Megalopta genalis [16] (Fig-\nure 1A). These bees forage at times of the day when polarized\nskylight provides the single most reliable directional cue in their\nrainforest habitat, and they possess all optical specializations\ntypical for polarized light perception [15]. Bees were captured\nwith light traps directly from their natural habitat in Panama dur-\ning foraging flights and tested within two weeks of capture. We\nsuccessfully recorded from 160 Megalopta bees to test re-\nsponses of CX neurons to linearly polarized light (Figures 1B–\n1H) by continuously rotating an artificial sky above the animal\n(Figures 1C–1E). We found strong sinusoidal modulations of", "translation": "热带夜行蜂 Megalopta genalis 的 CX[16]（图1A）。它们觅食的时段，偏振天空光是雨林生境中唯一最可靠的方向线索；其视觉系统具备偏振光感知的典型光学特化[15]。我们用灯光诱捕器在巴拿马自然生境中捕获觅食飞行的蜂，并在两周内测试。我们成功记录了160只 Megalopta 蜂，通过在其上方连续旋转人工天空（图1C–1E），检测 CX 神经元对线偏振光的响应（图1B–1H）。我们发现十个神经元的", "status": "translated", "notes": [], "sentence_ids": ["P003-RIGHT2-S001", "P003-RIGHT2-S002", "P003-RIGHT2-S003", "P003-RIGHT2-S004", "P003-RIGHT2-S005"], "min_font_pt": 9, "reading_order": 13}], "assets": [{"id": "P003-FIG1", "kind": "figure", "bbox": [59, 99, 389, 626], "source": "Figure 1（图内英文标签保留）", "uri": "image-007.jpg"}], "analysis": []}, {"page": 4, "original": "image-008.jpg", "background": "image-009.jpg", "blocks": [{"id": "P004-CAPTION", "page": 4, "bbox": [53.1, 609, 544.1, 750], "kind": "caption", "font_pt": 8.5, "source_bbox": [53.1, 609, 544.1, 750], "source": "Figure 2. Neurons of the Bee Central Complex Are Sensitive to Translational Optic Flow\n(A) Schematic illustration of recording setup. The bee was placed inside a 360(cid:1) LED arena that was used to display rotational (clockwise and counter-clockwise)\nand translational (forward and backward) optic flow.\n(B) 3D reconstructions of TN1 (left) and TN2 neurons (right) registered into a common reference brain (additional morphologies in Figure S2). Left: neurons\nembedded in whole brain. Right: neurons with central complex only. Note that both cell types exist in both brain hemispheres. VLNP, ventrolateral neuropils; for\nremaining abbreviations, see Figure 1.\n(C and D) Voltage traces from intracellularly recorded cells responding to front-to-back (top) and back-to-front (bottom) translational optic flow. First green line,\ngrating presented; second green line, motion onset; red line, motion stop. TN1 neuron (C) and TN 2 neuron (D) are shown.\n(E and G) Activity of TN neurons in response to different stimulus velocities ((cid:3)90(cid:1)/s to 90(cid:1)/s [blue to red]; values: ± 10(cid:1)/s, ± 30(cid:1)/s, ± 60(cid:1)/s, and ± 90(cid:1)/s). Vertical\nlines are as in (C). (E) Same neuron as in (C). (G) Same neuron as in (D).\n(F and H) Normalized mean activity during the final 2 s of each stimulus bout of TN1 neurons (F; n = 5) and TN2 neurons (H; n = 3). Colored circles, mean; gray\ncircles, individual data points; solid line, background activity (±SD, gray lines).\n(I and K) Responses to rotational optic flow at different spatial frequencies of the same neurons as (E) for (I) and (G) for (K).\n(legend continued on next page)", "translation": "图2　蜜蜂中央复合体神经元对平移视流敏感\n(A) 记录装置。蜂位于360° LED 场景内，接受旋转视流（顺、逆时针）与平移视流（前、后向）。\n(B) TN1（左）与 TN2（右）的三维重建，配准至同一参考脑（更多形态见图S2）。左为全脑，右仅示中央复合体。两类细胞在两侧脑均存在。VLNP为腹外侧神经毡；其余缩写见图1。\n(C、D) 细胞内记录的细胞对从前向后（上）、从后向前（下）平移视流的电位响应。第一条绿线表示光栅呈现，第二条为运动开始，红线为运动停止。(C) TN1；(D) TN2。\n(E、G) 对−90°/s至90°/s（蓝至红；±10、±30、±60、±90°/s）刺激的活动，竖线同(C)。(E)细胞同(C)，(G)同(D)。\n(F、H) 各刺激末2 s归一化平均活动，TN1见(F)，n=5；TN2见(H)，n=3。彩圈为平均，灰圈为个体，实线为背景活动（灰线±SD）。\n(I、K) 不同空间频率旋转视流响应；(I)细胞同(E)，(K)同(G)。图注续下页。", "status": "translated", "notes": [], "sentence_ids": ["P004-CAPTION-S001", "P004-CAPTION-S002", "P004-CAPTION-S003", "P004-CAPTION-S004", "P004-CAPTION-S005", "P004-CAPTION-S006", "P004-CAPTION-S007", "P004-CAPTION-S008", "P004-CAPTION-S009", "P004-CAPTION-S010", "P004-CAPTION-S011", "P004-CAPTION-S012", "P004-CAPTION-S013", "P004-CAPTION-S014", "P004-CAPTION-S015"], "min_font_pt": 8, "reading_order": 14}], "assets": [{"id": "P004-FIG2", "kind": "figure", "bbox": [53, 99, 545, 607], "source": "Figure 2（图内英文标签保留）", "uri": "image-010.jpg"}], "analysis": []}, {"page": 5, "original": "image-011.jpg", "background": "image-012.jpg", "blocks": [{"id": "P005-LEFT", "page": 5, "bbox": [59.8, 100, 299.8, 704], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [59.8, 100, 299.8, 704], "source": "firing frequency in response to this stimulus (i.e., polarized light\ntuning) in ten neurons. The neurons showed an average tuning\nwidth of 50(cid:1) and a difference in tuning between clockwise and\ncounter-clockwise rotations of 53(cid:1) on average, with anticipatory\ntuning optima, i.e., during clockwise rotations, the optimum was\nshifted counter-clockwise with respect to the average tuning and\nvice versa for counter-clockwise rotations (Figures 1E–1H). This\nphenomenon has been found in compass neurons of other spe-\ncies and, in locusts, has been proposed to aid correct compass\nencoding during fast body rotations [17]. None of the cells tested\n(5 out of 10 cells) responded strongly to large-field motion cues\npresented in a 360(cid:1) light emitting diode (LED) arena and showed\nno or only weak responses to a bright bar moving around the bee\n(tested in 9 out of 10 cells), demonstrating that the recorded neu-\nrons are selectively encoding polarized-light-based compass\ncues (Figure S1). Seven compass neurons were analyzed\nanatomically. All arborized in the lower division of the central\nbody (ellipsoid body in flies; Figure 1B), a part of the CX tightly\nassociated with compass encoding in migratory insects and a\nkey component of the Drosophila head-direction network\n[8, 10, 11]. Indeed, both identified neuron types with compass-\nlike activity in Megalopta (63 TL and 13 CL1 neurons) are either\nhomologous to the GABAergic (inhibitory) ring neurons or to the\nE-PG neurons that comprise the head-direction system of the\nDrosophila CX. These cells make up an estimated 5%–10% of\nall CX neurons, and identical neurons have been described in\ndetail in locusts [18, 19], monarch butterflies [10], and dung bee-\ntles [20] with physiological responses to polarized light that are\nhighly similar to those in Megalopta. Additionally, we identified\nbee counterparts of all remaining locust compass neurons,\noccupying the protocerebral bridge (PB) (TB1 neurons; anatom-\nically identified) and the upper division of the central body (CBU;\nfan-shaped body in flies) (CPU1 neurons; anatomy and physi-\nology) (Figures 1B and S4). Together, these findings strongly\nsuggest that the CX serves as an internal compass in bees\nas well.\nOptic Flow Sensing in the Bee CX\nThe second requirement for path integration is an odometer,\nwhich for the bee requires neurons that encode translational in-\nformation from optic flow to converge with visual compass infor-\nmation [4]. Recent evidence from Drosophila and cockroaches\nshows that the CX houses neurons sensitive to large-field motion\ncues [21–23]. During intracellular recordings from CX neurons,\nwe presented large-field optic flow stimuli (high-contrast sinew-\nave gratings moving at different speeds) to bees located in the\ncenter of a 360(cid:1) LED arena (Figure 2A). Two types of CX neurons\nresponded strongly to translational optic flow, whereas they\nwere invariant to compass stimuli (tested in 5 of 14 recordings;\nFigure S1). Both selectively provided input to two CX compart-\nments called the noduli and were named noduli tangential neu-\nrons (TN neurons). They had extensive input branches in the\nlateral regions of the central brain in one brain hemisphere and", "translation": "放电频率随这一刺激呈强烈的正弦调制，即偏振光调谐。平均调谐宽度为50°；顺时针与逆时针旋转之间的调谐角差平均为53°，且最优调谐具有预期性：顺时针旋转时，最优角相对平均调谐角向逆时针偏移，逆时针旋转时反之（图1E–1H）。其他物种的罗盘神经元也有这一现象，蝗虫研究认为它可能帮助快速身体旋转时维持正确的罗盘编码[17]。接受测试的细胞（10个中的5个）均不对360°发光二极管（LED）场景中的大视场运动产生强响应；对绕蜂运动的明亮条带也不响应或仅弱响应（测试了10个中的9个）。这表明所记录神经元选择性编码偏振光罗盘线索（图S1）。\n我们对七个罗盘神经元进行了形态分析，均在中央体下分区分枝（果蝇的椭球体；图1B）。这一区域与迁飞昆虫的罗盘编码密切相关，也是果蝇头方向网络的重要组成[8,10,11]。事实上，在 Megalopta 中鉴定的两类具有罗盘式活动的神经元（6个 TL 和1个 CL1 神经元）分别与果蝇 CX 头方向系统的 GABA 能抑制性环神经元或 E-PG 神经元同源。这些细胞估计占全部 CX 神经元的5%–10%；蝗虫[18,19]、帝王蝶[10]和蜣螂[20]中已有同类细胞的详细描述，其偏振光生理响应与 Megalopta 十分相似。此外，我们也在蜂类中找到了其他所有蝗虫罗盘神经元的对应类型，分别分布于前脑桥（PB；TB1 神经元，经解剖鉴定）与中央体上分区（CBU，即果蝇扇形体；CPU1 神经元，有解剖及生理证据）（图1B、S4）。这些结果共同强烈提示，CX 在蜂类中也充当内部罗盘。\n蜜蜂 CX 中的视流感知\n路径积分的第二项要求是里程计。对蜂类而言，需要编码平移视流信息的神经元与视觉罗盘信息汇聚[4]。果蝇和蟑螂的近期证据表明，CX 包含对大视场运动敏感的神经元[21–23]。在 CX 神经元细胞内记录期间，我们向处于360° LED 场景中心的蜂呈现大视场视流刺激，即以不同速率运动的高对比度正弦光栅（图2A）。两类 CX 神经元强烈响应平移视流，却不受罗盘刺激影响（14次记录中测试了5次；图S1）。两类细胞均选择性向称为小结的两个 CX 区室提供输入，故称小结切向神经元（TN 神经元）。它们在单侧中央脑的外侧区域具有广泛的输入分枝，并以密集的", "status": "translated", "notes": [], "sentence_ids": ["P005-LEFT-S001", "P005-LEFT-S002", "P005-LEFT-S003", "P005-LEFT-S004", "P005-LEFT-S005", "P005-LEFT-S006", "P005-LEFT-S007", "P005-LEFT-S008", "P005-LEFT-S009", "P005-LEFT-S010", "P005-LEFT-S011", "P005-LEFT-S012", "P005-LEFT-S013", "P005-LEFT-S014", "P005-LEFT-S015", "P005-LEFT-S016", "P005-LEFT-S017", "P005-LEFT-S018"], "min_font_pt": 9, "reading_order": 15}, {"id": "P005-RIGHT", "page": 5, "bbox": [310.8, 100, 550.8, 704], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [310.8, 100, 550.8, 704], "source": "innervated large parts of the ipsilateral nodulus with dense,\nblebbed fibers (Figures 2B and S2; Movie S1). The two types\ndiffered in the location, extent, and shape of their input fiber pro-\njection fields (Figures 2B and S2; Movie S1). Physiologically, TN2\ncells were excited by simulated forward flight (Figures 2D, 2G,\nand 2H), increasing firing approximately linearly with stimulus ve-\nlocity up to a sustained peak activity of approximately 150 im-\npulses/s at a stimulus velocity of 90(cid:1)/s. This grating velocity\nmatches the preferred optic flow of Megalopta in flight tunnels\nand their ground speed of 20 cm/s [24], which is significantly\nslower than that of other bees [24]. This cell type could thus serve\nas a neural speed indicator and may correspond to cockroach\nneurons that increase activity with increasing walking speed of\nthe animal [9, 25], resembling speed cells in the rat entorhinal\ncortex [26]. In contrast, TN1 cells were inhibited by simulated for-\nward flight but were strongly excited by simulated backward\nflight (peak activities of up to 200 impulses/s; Figures 2C, 2E,\nand 2F). In approximately half the neurons of that type, the neural\nresponse outlasted the stimulus by a few seconds (Figures 2C\nand 2E), a characteristic that could constitute a low-pass filter,\nproviding the bee’s odometer with a smooth optic-flow-based\nspeed signal in a discontinuous, complex environment of fast-\nchanging spatial density (e.g., forests).\nBoth cell types responded more weakly or not at all to rota-\ntional optic flow (Figures 2I–2L), even at higher velocities up to\n160(cid:1)/s, despite identical grating parameters (contrast, velocity,\nand spatial frequency), suggesting that the response must be\ndetermined by antagonistic directional tuning within different re-\ngions of the neuron’s receptive fields. By mapping receptive\nfields with a narrow, bright bar moving around the bee, we\nthus analyzed the local directional tuning preferences of each\ncell (Figure 3A). TN neurons responded strongly to this stimulus\nand received information from the entire panorama (Figure 3B).\nLike many optic lobe cells (e.g., [27, 28]), the neurons possess\npreferred and anti-preferred motion directions within their recep-\ntive fields, and several of these regions with opposite directional\ntuning tiled the visual space around the animal (Figures 3C–3F).\nFour different receptive field signatures could be distinguished.\nEach of them had a characteristic pattern of local tuning prefer-\nences that allowed us to predict four different optimal expansion\npoints for translational optic flow that were offset from the body\naxis between 25(cid:1) and 75(cid:1) either to the right or to the left (average\nbehind the bee: 135(cid:1); average in front of the bee: 48(cid:1); Figures\n3C–3G). The preference in optic flow expansion direction toward\neither the right or the left side of the body axis was determined by\nthe hemisphere in which each TN cell was located. As only a sub-\nset of the recorded optic-flow-processing neurons could be\ncharacterized anatomically (7 out of 14), we used these charac-\nteristic receptive field structures to infer neural identity of the\nnon-dye-injected recordings.\nThe predicted point of expansion for translational optic flow\nbased on local tuning preferences was directly tested and\nconfirmed in one recording (Figure 3H). Based on the average", "translation": "串珠状纤维支配同侧小结的大部分区域（图2B、S2；视频S1）。两类细胞的输入纤维投射区在位置、范围和形状上有所不同（图2B、S2；视频S1）。生理上，TN2 细胞被模拟前向飞行兴奋（图2D、2G、2H），放电随刺激速率近似线性增加；刺激为90°/s时，持续峰值约150脉冲/s。这一光栅速率与 Megalopta 在飞行隧道中偏好的视流及20 cm/s的对地速率相符[24]，后者明显低于其他蜂类[24]。因此该细胞可能充当神经速率指示器，或对应于蟑螂中随步行速率增加而提高活动的神经元[9,25]，类似大鼠内嗅皮层的速率细胞[26]。相反，TN1 细胞受模拟前飞抑制，却被模拟后飞强烈兴奋，峰值达200脉冲/s（图2C、2E、2F）。约一半该类细胞的响应会在刺激结束后持续数秒（图2C、2E）；这一特性可能构成低通滤波器，在空间密度快速变化且不连续的复杂环境（如森林）中，为视觉里程计提供平滑的视流速率信号。\n在光栅参数（对比度、速率、空间频率）相同的条件下，两类细胞对旋转视流的响应更弱或完全不响应（图2I–2L），即使速率高达160°/s也是如此。这提示响应取决于神经元感受野不同区域的拮抗性方向调谐。我们让狭窄亮条绕蜂运动来绘制感受野，从而分析各细胞的局部方向偏好（图3A）。TN 神经元强烈响应该刺激，并接收整个全景的信息（图3B）。与许多视叶细胞类似（如[27,28]），其感受野内既有偏好运动方向，也有反偏好方向；若干具有相反调谐的区域拼接覆盖动物周围视觉空间（图3C–3F）。\n我们区分出四种感受野特征。各自的局部调谐模式，使我们预测出平移视流的四个最优扩张点：相对体轴向左或右偏移25°–75°（蜂后方平均135°，前方平均48°；图3C–3G）。视流扩张方向偏向体轴左侧还是右侧，取决于 TN 细胞所在脑半球。仅部分记录的视流神经元能够完成解剖鉴定（14个中7个），因此我们利用这些特征性感受野结构推断未注染记录的神经元身份。\n对一次记录进行直接测试，证实了根据局部调谐预测的平移视流扩张点（图3H）。根据感受野分析得到的平均", "status": "translated", "notes": [], "sentence_ids": ["P005-RIGHT-S001", "P005-RIGHT-S002", "P005-RIGHT-S003", "P005-RIGHT-S004", "P005-RIGHT-S005", "P005-RIGHT-S006", "P005-RIGHT-S007", "P005-RIGHT-S008", "P005-RIGHT-S009", "P005-RIGHT-S010", "P005-RIGHT-S011", "P005-RIGHT-S012", "P005-RIGHT-S013", "P005-RIGHT-S014", "P005-RIGHT-S015", "P005-RIGHT-S016", "P005-RIGHT-S017", "P005-RIGHT-S018"], "min_font_pt": 9, "reading_order": 16}, {"id": "P005-CAPTION", "page": 5, "bbox": [59.8, 709, 550.8, 750], "kind": "caption", "font_pt": 8.5, "source_bbox": [59.8, 709, 550.8, 750], "source": "(J and L) Mean responses to rotational optic flow of TN neurons. (J) Same neurons as shown in (F). Responses were tested only in four out of five cells from (F) and\nare shown only for cells located in the right brain hemisphere (n = 3), as preferences for clockwise and counter-clockwise rotations were inverted for left-side cells.\n(L) is the same as (J), but for neurons shown in (H).\nSee also Figures S1–S3.", "translation": "(J、L) TN 神经元对旋转视流的平均响应。(J) 与(F)为同组细胞，仅测试了其中5个中的4个；这里只显示右侧脑细胞（n=3），因为左侧细胞的顺、逆时针偏好相反。(L) 同(J)，但对应(H)中的神经元。另见图S1–S3。", "status": "translated", "notes": [], "sentence_ids": ["P005-CAPTION-S001", "P005-CAPTION-S002", "P005-CAPTION-S003", "P005-CAPTION-S004"], "min_font_pt": 8, "reading_order": 17}], "assets": [], "analysis": []}, {"page": 6, "original": "image-013.jpg", "background": "image-014.jpg", "blocks": [{"id": "P006-CAPTION", "page": 6, "bbox": [53.1, 717, 544.1, 755], "kind": "caption", "font_pt": 8.5, "source_bbox": [53.1, 717, 544.1, 755], "source": "Figure 3. Receptive Fields of Optic-Flow-Sensitive Neurons Define Encoded Movement Space\n(A) Top: stimulus for receptive-field mapping was a green bar moving around the bee at constant speed. Bottom: schematic display of flattened arena used for\ngraphs in (C)–(F).\n(legend continued on next page)", "translation": "图3　视流敏感神经元的感受野界定所编码的运动空间\n(A) 上：用于感受野绘制的绿条以恒定速率绕蜂运动。下：供(C–F)作图使用的展开 LED 场景示意。图注续下页。", "status": "translated", "notes": [], "sentence_ids": ["P006-CAPTION-S001", "P006-CAPTION-S002", "P006-CAPTION-S003"], "min_font_pt": 8, "reading_order": 18}], "assets": [{"id": "P006-FIG3", "kind": "figure", "bbox": [53, 99, 545, 714], "source": "Figure 3（图内英文标签保留）", "uri": "image-015.jpg"}], "analysis": []}, {"page": 7, "original": "image-016.jpg", "background": "image-017.jpg", "blocks": [{"id": "P007-LEFT", "page": 7, "bbox": [59.8, 100, 299.8, 571], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [59.8, 100, 299.8, 571], "source": "values resulting from the receptive field analysis, we thus extrap-\nolated that this set of cells most likely encodes four cardinal di-\nrections of movement (Figure 3I), thereby forming a basis for en-\ncoding holonomic movements (i.e., movements during which the\nbody axis is not aligned with the movement direction) in the bee’s\nflight path.\nWe additionally recorded and characterized an example of a\nTN2 neuron in the bumblebee Bombus terrestris (Figure S3).\nThe detailed morphology of bumblebee TN cells in the noduli\nwas examined by block-face electron microscopy, which re-\nvealed that, indeed, there are only two large tangential input neu-\nrons per nodulus (i.e., four individual neurons per brain) that\nresembled Megalopta TN1 and TN2 neurons. Each of them\npossessed many hundreds of synaptic outputs (active zones)\nassociated with large pools of synaptic vesicles (Figures 4I and\n4J), showing that TN neurons provide input to the noduli. The\nidentical morphology in two distantly related species suggests\nthat these cells have evolved more than 100 million years ago\n[29] and might be part of the core network of the bee CX.\nA Plausible Substrate for Integration of Speed and\nDirection\nTo reveal the postsynaptic partners of the speed cells, we carried\nout additional block-face electron microscopy of the bumblebee\nnoduli. Through tracing neurites in low- and medium-resolution\nimages (Figures 4E and 4G), we found between 16 and 19\ncolumnar neurons for each of the 8 CX bundles (per hemisphere)\nthat showed overlapping arborization domains with TN cells (Fig-\nures 4F and 4H). These fibers follow an identical trajectory as\ncolumnar CPU4 neurons that were co-stained with TN cells re-\ncorded in Megalopta (Figure 4A), closely resembling identical\ncells from other species [30–33]. These cells are characterized\nby three arborization regions: one in the PB, one in the contralat-\neral nodulus, and a third branch in the CBU (fan-shaped body in\nflies). As only the most medial parts of the PB were included in\neven the largest image stack (low-resolution stack), we were\nonly able to trace 19 out of 141 neurons to their origin in the\nPB (19 of 35 in the medial two bundles). Whereas the fine\nbranches in the PB were either below the resolution of the data\nor outside the imaged region, we identified fibers in the CBU in\nmost cells (122 of 141; 18 of 18 for two bundles), whereas all cells\ninnervated the noduli. With the exception of two CL2 neurons per", "translation": "数值，我们由此推断，这组细胞最可能编码四个基本运动方向（图3I），从而为蜂飞行轨迹中的全向运动（体轴与运动方向不一致的运动）提供编码基础。\n我们还在地熊蜂 Bombus terrestris 中记录并表征了一个 TN2 神经元（图S3）。通过块面电子显微成像检查熊蜂小结内 TN 细胞的精细形态，发现每个小结确实仅有两个大型切向输入神经元（每个脑共四个），形态类似 Megalopta 的 TN1 和 TN2。每个细胞均有数百个突触输出活性区，并伴有大量突触小泡（图4I、4J），说明 TN 神经元向小结提供输入。两个亲缘关系较远物种中相同的形态提示，这些细胞可能在一亿多年前就已演化形成[29]，并可能属于蜂 CX 的核心网络。\n速率与方向整合的一种可能神经基础\n为确定速率细胞的突触后伙伴，我们进一步对熊蜂小结进行了块面电镜成像。在低、中分辨率图像中追踪神经突（图4E、4G），发现每个脑半球8条 CX 纤维束的每一束包含16–19个柱状神经元，其分枝范围与 TN 细胞重叠（图4F、4H）。这些纤维的走行与 Megalopta 中与已记录 TN 细胞共同染色的柱状 CPU4 神经元一致（图4A），并高度类似其他物种的同类细胞[30–33]。其特征是有三个分枝区：PB、对侧小结和 CBU（果蝇的扇形体）。即使最大的低分辨率图像堆栈也只覆盖 PB 最内侧区域，因此141个神经元中仅19个能追踪至 PB 起源处（最内侧两束35个中的19个）。PB 内细枝低于分辨率或位于成像范围外；但多数细胞可在 CBU 中识别到纤维（141个中122个；两束各18个均找到），而全部细胞都支配小结。除每束的两个 CL2 神经元", "status": "translated", "notes": [], "sentence_ids": ["P007-LEFT-S001", "P007-LEFT-S002", "P007-LEFT-S003", "P007-LEFT-S004", "P007-LEFT-S005", "P007-LEFT-S006", "P007-LEFT-S007", "P007-LEFT-S008", "P007-LEFT-S009", "P007-LEFT-S010", "P007-LEFT-S011", "P007-LEFT-S012"], "min_font_pt": 9, "reading_order": 19}, {"id": "P007-RIGHT", "page": 7, "bbox": [310.8, 100, 550.8, 571], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [310.8, 100, 550.8, 571], "source": "bundle, which project to the lower division of the central body\n(CBL) instead of the CBU and originate in a different part of the\nnoduli, all cells in the traced CX bundles are thus most likely\nCPU4 neurons. Using this reasoning for the higher-resolution da-\ntasets (only covering one nodulus) to infer CPU4 neuron identity,\nwe found strong evidence that TN cells and CPU4 cells are not\nonly in close proximity but indeed form synaptic contacts (Fig-\nures S4I–S4N).\nAs CPU4 cells have input terminals in the noduli as well as in\nthe PB, they are ideally suited to integrate speed signals from\nthe noduli with compass signals from the PB. Unfortunately,\nnot much is known about the function of these cells in any\nspecies: preliminary recordings in Megalopta have revealed\nresponses to translational optic flow in CPU4 cells (data not\nshown), whereas in locusts, these cells show context-dependent\nresponses to compass stimuli [19].\nCrucially, the third projection area of CPU4 neurons provides\noutput to the CBU, which houses the dendrites of the columnar\nCPU1 neurons. These cells are the largest columnar neurons of\nthe CX and have been described anatomically in many species\n[20, 30–35] (they comprise the ‘‘horizontal fiber system’’ in\nDrosophila) [31, 35]. Functionally, they have been studied in lo-\ncusts, butterflies, and dung beetles and consistently respond\nto visual compass stimuli. The latter was confirmed in Megalopta\nby preliminary recordings (Figure S3). Based on their anatomical\nand physiological properties [7, 20, 30, 33], CPU1 cells have\nbeen suggested to be postsynaptic to neurons of the PB and\nare likely to provide a main output pathway from the insect CX.\nAcross all species examined to date, CPU1 cells converge in a\npremotor control region, the lateral accessory lobe (LAL) [7, 20,\n30–33]. This brain region contains neurons descending to the\nthoracic motor centers, and detailed work in the moth Bombyx\nmori has shown that it is involved in generating steering com-\nmands in response to pheromone pulses [36, 37]. This potential\ndirect role of CX output cells in initiating steering responses was\nrecently confirmed in cockroaches, in which neural activity in the\nCX directly influences reflex circuits in the thorax for steering [9].\nThus, in principle, the bee CX contains all elements for a path\nintegration circuit that has the potential to integrate speed and\ncompass signals and relays this information to motor control\ncenters. We now present a detailed proposal for how this\ncomputation could take place.", "translation": "起源于小结另一部分、投射到中央体下分区（CBL）而非 CBU 外，被追踪 CX 纤维束内的其余细胞因此极可能都是 CPU4 神经元。将这一推理用于仅覆盖单侧小结的高分辨率数据，以推断 CPU4 身份，我们获得了强证据：TN 与 CPU4 细胞不仅空间接近，而且确有突触接触（图S4I–S4N）。（译注—存疑：此处原文引图为S4I–S4N，但相应电镜突触接触面板见主图4I–4N；据本文件图4图注判断，可能为图号笔误，未见作者勘误。）\nCPU4 细胞在小结和 PB 均有输入末梢，因此十分适合将小结的速率信号与 PB 的罗盘信号整合。遗憾的是，各物种中对这些细胞的功能都知之甚少。Megalopta 的初步记录显示 CPU4 对平移视流有响应（数据未展示）；蝗虫中则表现出依赖情境的罗盘刺激响应[19]。\n关键在于，CPU4 的第三个投射区向 CBU 输出，而柱状 CPU1 神经元的树突位于该处。CPU1 是 CX 中最大的柱状神经元，在许多物种中均有解剖描述[20,30–35]（在果蝇中构成“水平纤维系统”[31,35]）。蝗虫、蝴蝶和蜣螂的功能研究一致显示它们响应视觉罗盘刺激。Megalopta 的初步记录也证实这一点（图S3）。基于解剖和生理特征[7,20,30,33]，CPU1 被认为可能位于 PB 神经元突触后，并可能构成昆虫 CX 的主要输出通路。所有已研究物种中，CPU1 均汇聚于前运动控制区——侧附叶（LAL）[7,20,30–33]。该区包含下行至胸部运动中枢的神经元；家蚕 Bombyx mori 的详细研究表明，其参与响应信息素脉冲而产生转向指令[36,37]。近期蟑螂研究也支持 CX 输出细胞直接启动转向：CX 活动可直接影响胸部负责转向的反射回路[9]。\n因此，原则上蜜蜂 CX 包含路径积分回路所需的全部要素，能够整合速率和罗盘信号，并传至运动控制中枢。下文给出这一计算过程可能如何实现的详细方案。", "status": "translated", "notes": [{"type": "uncertain", "sentence_id": "P007-RIGHT-N001-S", "text": "（译注—存疑：此处原文引图为S4I–S4N，但相应电镜突触接触面板见主图4I–4N；据本文件图4图注判断，可能为图号笔误，未见作者勘误。）", "basis": "译注—存疑：此处原文引图为S4I–S4N，但相应电镜突触接触面板见主图4I–4N；据本文件图4图注判断，可能为图号笔误，未见作者勘误。", "sources": []}], "sentence_ids": ["P007-RIGHT-S001", "P007-RIGHT-S002", "P007-RIGHT-S003", "P007-RIGHT-S004", "P007-RIGHT-S005", "P007-RIGHT-S006", "P007-RIGHT-S007", "P007-RIGHT-S008", "P007-RIGHT-S009", "P007-RIGHT-S010", "P007-RIGHT-S011", "P007-RIGHT-S012", "P007-RIGHT-S013", "P007-RIGHT-S014", "P007-RIGHT-S015", "P007-RIGHT-N001-S"], "min_font_pt": 9, "reading_order": 20}, {"id": "P007-CAPTION", "page": 7, "bbox": [59.8, 576, 550.8, 750], "kind": "caption", "font_pt": 8.5, "source_bbox": [59.8, 576, 550.8, 750], "source": "(B) Typical neural response to a moving bar of a TN1 neuron. Top: sliding average of spike rate. Bottom: spike train. Ramps indicate movement of bar, either\nclockwise (cw) or counter-clockwise (ccw).\n(C) Mean normalized activity (thick curve) during receptive field mapping of TN1 neurons shown with individual response curves. Yellow traces, cw movement;\ngreen traces, ccw movement. Responses of neurons in right (n = 6) and left brain hemispheres (n = 2) are approximately mirror symmetric but directionally inverted\n(e.g., green curve on the right mirrors and yellow curve on the left). Different parts of the receptive fields are preferentially tuned to cw or ccw movement, with null\npoints with no observable tuning indicated by red lines.\n(D) Flow fields indicating local directional tuning preferences of TN1 neurons, mapped onto spatial extent of the LED arena. Grey arrows indicate that the tuning\ncould result from any position along the vertical axis of the arena (elevation range covered by the bar stimulus).\n(E and F) As in (C) and (D) but for TN2 neurons. Responses are inverted compared to TN1 neurons (left: n = 2; right: n = 3).\n(G) Calculated null points (red) without directional tunings displayed in a circular diagram for both cell types and both brain hemispheres. Blue lines indicate the\naverage null point assuming axial symmetry of responses (i.e., frontal null point is opposite of posterior one), predicting an optimal point of optic flow expansion.\nArrows around the circle are based on flow fields in (D) and (F). In TN2 cells of the left brain hemisphere, a range of angles without clear tuning preference occurred\nand is indicated in red, with null crossings of tuning preferences shown as dotted lines.\n(H) Responses to translational optic flow with different expansion points (45(cid:1) intervals) of one of the neurons in (C) (from left brain hemisphere). Resulting preferred\nexpansion point (black arrow) matches predictions from (G) (blue arrow). Red circle, background activity.\n(I) Idealized preferred expansion points of TN neurons from both brain hemispheres, which were used as a basis for modeling.\nSee also Figures S2 and S3.", "translation": "(B) TN1 神经元对移动亮条的典型响应。上为放电率滑动平均，下为脉冲序列；斜坡表示亮条顺时针(cw)或逆时针(ccw)运动。\n(C) TN1 感受野绘制时的平均归一化活动（粗线）及各细胞曲线。黄色为cw，绿色为ccw。左右脑细胞（右n=6，左n=2）的响应近似镜像，但方向相反，例如右侧绿线与左侧黄线镜像对应。不同区域偏好cw或ccw；红线为未见方向调谐的零点。\n(D) TN1 局部方向偏好的流场，映射至 LED 场景范围。灰箭头表示调谐可来自场景垂直轴上的任意位置（亮条覆盖的仰角范围）。\n(E、F) 同(C、D)，但为 TN2 神经元，响应与 TN1 相反（左n=2，右n=3）。\n(G) 两类细胞、两侧脑的无方向调谐零点（红）圆图。蓝线是在假定响应轴对称（前、后零点相对）时的平均零点，可预测最优视流扩张点。圆周箭头依据(D、F)。左脑 TN2 有一段无明确偏好的角度区间，以红色表示；偏好零交叉以虚线表示。\n(H) (C)中一个左脑神经元对不同扩张点（间隔45°）的平移视流的响应。实际偏好（黑箭头）符合(G)的预测（蓝箭头）。红圈为背景活动。\n(I) 两侧 TN 神经元用于建模的理想化偏好扩张点。另见图S2、S3。", "status": "translated", "notes": [], "sentence_ids": ["P007-CAPTION-S001", "P007-CAPTION-S002", "P007-CAPTION-S003", "P007-CAPTION-S004", "P007-CAPTION-S005", "P007-CAPTION-S006", "P007-CAPTION-S007", "P007-CAPTION-S008", "P007-CAPTION-S009", "P007-CAPTION-S010", "P007-CAPTION-S011", "P007-CAPTION-S012", "P007-CAPTION-S013", "P007-CAPTION-S014", "P007-CAPTION-S015", "P007-CAPTION-S016", "P007-CAPTION-S017", "P007-CAPTION-S018"], "min_font_pt": 8, "reading_order": 21}], "assets": [], "analysis": []}, {"page": 8, "original": "image-018.jpg", "background": "image-019.jpg", "blocks": [{"id": "P008-CONT", "page": 8, "bbox": [440, 739, 552, 750], "kind": "metadata", "font_pt": 8, "source_bbox": [440, 739, 552, 750], "source": "(legend on next page)", "translation": "（图注见下一页）", "status": "translated", "notes": [], "sentence_ids": ["P008-CONT-S001"], "min_font_pt": 8, "reading_order": 22}], "assets": [{"id": "P008-FIG4", "kind": "figure", "bbox": [59, 99, 551, 735], "source": "Figure 4（图内英文标签保留）", "uri": "image-020.jpg"}], "analysis": []}, {"page": 9, "original": "image-021.jpg", "background": "image-022.jpg", "blocks": [{"id": "P009-LEFT", "page": 9, "bbox": [59.8, 100, 299.8, 551], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [59.8, 100, 299.8, 551], "source": "A Proposed Circuit for Path Integration\nThe model presented in Figure 5 combines data from the current\nstudy with anatomical constraints based on the assumptions\nthat, first, input and output regions of CX cell types (cell polarity)\ncan be reliably inferred from morphologically distinct fiber termi-\nnals (smooth versus blebbed) (compare, e.g., [7, 30, 33] with [31,\n32]) and, second, that overlapping fibers with opposite polarity\nare synaptically connected. Effectively, this excludes impossible\nconnections and assumes all other connections exist, which is\nmost likely an oversimplification, but, in the absence of sufficient\ndirect connectivity data, allows us to generate systematic, plau-\nsible connections between all major CX cell types. These are\ndictated directly by their interhemispheric projection patterns\n(Figures 5B–5E and S4E), which have been observed consis-\ntently across a range of insects [30, 31, 33] (see below and\nSTAR Methods for further details of the evidence for each\nassumed circuit element). In the following, we propose a func-\ntional interpretation of these data that constitutes a complete\nmodel for path integration.\nThe PB (Figure 5A) receives input from columnar cells of the\nellipsoid body/lower division of the central body (CL1, Figure 5F)\n[38, 39], characterized as compass neurons in flies [8], locusts\n[19], butterflies [10], beetles [20], and bees (this work). Our model\nassumes that each of the eight multiglomerular TB1 neurons in\nthe PB directly receives this input and, in accordance with data\nfrom flies [8, 38–40], is tuned to one specific azimuth direction,\nand together, they tile the azimuth around the animal with a res-\nolution of 45(cid:1) (Figures 5A and 5B). The proposed mutual connec-\ntions of TB1 neurons onto one another follow a specific pattern\nsuggested by the distribution of their dendrites (Figure 5B),\nwhich is conserved at least across locusts, butterflies, beetles,\nand bees [7, 20, 33]: TB1 cells have no input fibers in PB columns\nthat neighbor their output fibers, whereas the density of input fi-\nbers is highest in columns most distant from output fibers. TB1\ncells are most likely inhibitory [7], and thus, their cross-connec-\ntivity could form a ring attractor [41], which allows potentially\nnoisy directional inputs to produce a stable single ‘‘bump’’ of ac-\ntivity—more explicitly, we propose the circuit stabilizes as a sinu-\nsoidal activity pattern with its peak in the direction of strongest\ndirectional input. The ring attractor hypothesis is consistent", "translation": "一个候选路径积分回路\n图5的模型将本研究数据与解剖约束结合，并基于两项假设：第一，可从形态不同的纤维末梢（光滑或串珠状）可靠推断 CX 细胞类型的输入、输出区域，即细胞极性（例如比较[7,30,33]与[31,32]）；第二，极性相反且空间重叠的纤维形成突触连接。这实际上排除了不可能的连接，并假设其他连接均存在，极可能是一种过度简化；但在缺乏充分直接连接数据时，它让我们能够系统地为各主要 CX 细胞类型建立合理连接。这些连接由跨半球投射模式直接决定（图5B–5E、S4E），且在多类昆虫中一致可见[30,31,33]（各项回路假设的详细证据见下文和 STAR Methods）。接下来我们提出这些数据的功能解释，组成一个完整的路径积分模型。\nPB（图5A）接收椭球体/中央体下分区柱状 CL1 细胞（图5F）的输入[38,39]；CL1 已在果蝇[8]、蝗虫[19]、蝴蝶[10]、甲虫[20]和蜂（本研究）中被表征为罗盘神经元。模型假设 PB 中8个多小球 TB1 神经元分别直接接收这一输入；依据果蝇数据[8,38–40]，每个细胞调谐于一个特定方位，共同以45°分辨率覆盖动物周围方位（图5A、5B）。\n我们提出 TB1 之间的相互连接遵循其树突分布所暗示的特定模式（图5B），这一模式至少在蝗虫、蝴蝶、甲虫和蜂中保守[7,20,33]：TB1 在邻接自身输出纤维的 PB 柱中没有输入纤维，输入密度则在离输出最远的柱中最高。TB1 极可能具有抑制性[7]，因此这种交叉连接可能构成环形吸引子[41]，使有噪声的方向输入产生稳定的单一活动“隆起”。更具体地说，我们提出回路稳定为正弦活动模式，峰值位于方向输入最强处。环形吸引子假说也与近期", "status": "translated", "notes": [], "sentence_ids": ["P009-LEFT-S001", "P009-LEFT-S002", "P009-LEFT-S003", "P009-LEFT-S004", "P009-LEFT-S005", "P009-LEFT-S006", "P009-LEFT-S007", "P009-LEFT-S008", "P009-LEFT-S009", "P009-LEFT-S010"], "min_font_pt": 9, "reading_order": 23}, {"id": "P009-RIGHT", "page": 9, "bbox": [310.8, 100, 550.8, 551], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [310.8, 100, 550.8, 551], "source": "with both recent observations and recent models of PB activity\nin Drosophila [38–40, 42]. Thus, in our model, the activity of the\nTB1 neurons represents the current head direction of the bee.\nThrough their output fibers, each TB1 neuron is proposed to\ninhibit two types of columnar neurons, CPU4 and CPU1 cells\n(Figures 5C and 5E). As described earlier in this paper, CPU4\ncells, occurring in 18 copies per CX column, also receive input\nfrom TN ‘‘speed’’ neurons in the noduli. We hypothesize that all\nCPU4 neurons of each columnar bundle form recurrent microcir-\ncuits between the PB and the noduli to provide a basis for an ac-\ntivity-based memory, in a manner similar to that theorized in,\ne.g., [43, 44]. The possibility of a recurrent circuit is supported\nby the mixed appearance (combined input and output regions)\nof terminals of CPU4 neurons in both the noduli and the PB in\nconfocal images (Figures 4B and 4C) and EM data that confirm\nboth types of synapses in these neurons in the noduli, including\nsynapses interconnecting likely CPU4 cells. Nevertheless, given\nthe lack of substantial physiological data from CPU4 neurons in\nany species, we emphasize that this role as memory units is\npurely speculative but generates a concrete prediction: by\ncontinuously integrating the speed information from optic flow\nin proportion to the input from TB1 neurons, these units could\nencode the distance traveled in each compass direction, i.e.,\nserve as direction-locked odometers.\nNote that, by combining excitatory TN speed input with inhib-\nitory TB1 direction signals, the proposed CPU4 memory will in-\ncrease proportionally to the bee’s speed in columns opposite\nto the current flight heading (Figure 5H) and moreover will be\nshifted by +45(cid:1) in one hemisphere and (cid:3)45(cid:1) in the other, corre-\nsponding to the offset in optimal optical flow expansion\nobserved in left and right TN cells (Figure 3I) with which they\noverlap (the noduli connections are contralateral only; Figures\n4A and 4F). If the animal’s motion is not directly aligned with its\nhead direction, the rate of accumulation in each hemisphere\nwill differ but will, in a distributed form, represent the inverse of\nthe actual motion, i.e., the correct home vector (Figure S6).\nIn the CBU, the anatomy suggests that the CPU4 cells connect\nto CPU1 cells both directly (Figures 5C and 5D) and indirectly via\npontine cells (Figures 5E, S4E, and S4F). Pontine cells have been\nfound in the CX across many species and connect single", "translation": "果蝇 PB 活动的观察和模型一致[38–40,42]。因此，本模型中 TB1 的活动代表蜂当前的头部朝向。\n我们提出，每个 TB1 经输出纤维抑制 CPU4 和 CPU1 两类柱状细胞（图5C、5E）。前文已述，每个 CX 柱约有18个 CPU4，它们还在小结接收 TN“速率”神经元输入。我们假设每个柱状束的全部 CPU4 在 PB 与小结之间组成循环微回路，为基于活动的记忆提供基础，类似[43,44]中的理论。共聚焦图像中 CPU4 在小结和 PB 的混合型末梢（同时有输入、输出区；图4B、4C），以及电镜确认小结内这些细胞具有两类突触、可能的 CPU4 之间也有连接，均支持循环回路的可能性。但由于任何物种中都缺乏充分的 CPU4 生理数据，我们强调其作为记忆单元的作用纯属推测。不过这一假设给出了明确预测：这些单元若按 TB1 输入的比例，持续整合视流速率信息，就可以编码各罗盘方向上行进的距离，亦即充当方向锁定的里程计。\n注意，结合兴奋性 TN 速率输入与抑制性 TB1 方向信号后，候选 CPU4 记忆会在与当前飞行航向相反的柱中，按蜂速率成比例增加（图5H）；此外，一侧半球偏移+45°，另一侧偏移−45°，对应于与其重叠的左右 TN 细胞的最优视流扩张偏移（图3I；小结连接仅为对侧连接，图4A、4F）。若动物运动方向不与头部朝向一致，两侧累积速率不同，但两者以分布式方式表示实际运动的反向，即正确的归巢向量（图S6）。\nCBU 解剖提示，CPU4 可直接（图5C、5D）或经桥接细胞间接连接 CPU1（图5E、S4E、S4F）。许多物种的 CX 均发现桥接细胞，它们连接左右脑半球中单个", "status": "translated", "notes": [], "sentence_ids": ["P009-RIGHT-S001", "P009-RIGHT-S002", "P009-RIGHT-S003", "P009-RIGHT-S004", "P009-RIGHT-S005", "P009-RIGHT-S006", "P009-RIGHT-S007", "P009-RIGHT-S008", "P009-RIGHT-S009", "P009-RIGHT-S010", "P009-RIGHT-S011", "P009-RIGHT-S012"], "min_font_pt": 9, "reading_order": 24}, {"id": "P009-CAPTION", "page": 9, "bbox": [59.8, 556, 550.8, 750], "kind": "caption", "font_pt": 8.5, "source_bbox": [59.8, 556, 550.8, 750], "source": "Figure 4. Speed Neurons Are Presynaptic to Proposed Integrator Cells\n(A) 3D reconstruction of six CPU4 cells (colored) simultaneously stained with a single TN1 neuron (gray) from Megalopta genalis, shown together with 3D surface\nreconstruction of central complex (CX) neuropils (CBU, upper division of the central body; PB, protocerebral bridge; NO, noduli). The eight central-complex\ncolumns are numbered in the PB.\n(B–D) Maximal intensity projections of intracellularly filled CPU4 neuron arborizations in the PB (Bi and Bii), noduli (Ci and Cii), and the CBU (Di and Dii); two\nexamples shown for each neuropil. Polarity of cells is clearly presynaptic in CBU but inconclusive in PB and noduli, suggesting mixed terminals.\n(E) Single section from low-resolution (voxel size: 100 3 100 3 100 nm) block-face electron-microscopic image stack of the bumblebee CX.\n(F) 3D tracing of all neurons innervating the right nodulus (based on image stack in E). Colors correspond to confocal data in (A) and indicate columnar identity.\nFiber trajectories and arborizations in the CBU match the confocal data and allow identification of all 16–19 traceable cells per column as likely CPU4 cells.\n(G) Single section from medium-resolution (voxel size: 23 3 23 3 50 nm) data stack from the bumblebee.\n(H) CPU4 neurons from each CX column possess overlapping projection fields within one nodulus, a prerequisite for possible microcircuits within the noduli.\nShown are three to five cells from each bundle.\n(I and J) Single sections from high-resolution image stack (voxel size: 11.5 3 11.5 3 50 nm) revealing synaptic vesicles associated with active zones (arrowheads)\nwithin both types of TN cells directly opposite of likely CPU4 cells (colored as in H); TNx (I), TNy (J); TNx and TNy, as identity cannot be established as TN1 or TN2\nbased solely on noduli fibers.\n(K) Surface reconstruction of one terminal branch of each TN neuron (gray; TNx and TNy, as identity cannot be established as TN1 or TN2 based solely on noduli\nfibers). Clearly identifiable active zones are highlighted in magenta. Three columnar neurons postsynaptic to TN cells (colors according to bundle identity) are also\nreconstructed and were traced to their bundle of origin.\n(L–N) Detailed 3D views of contact points of CPU4 and TN cells (arrowheads); (L) green cell shown in (I); (M), red cell shown in (J); (N), yellow cell shown in (J).\nThe scale bars represent (A, E, and F) 50 mm, (B–D, G, and H) 20 mm, (K) 2 mm, and (I, J, and L–N) 1 mm.", "translation": "图4　速率神经元位于候选积分细胞的突触前\n(A) Megalopta genalis 中同时染色的6个 CPU4（彩色）与一个 TN1（灰色）三维重建，以及 CX 神经毡表面（CBU，中央体上分区；PB，前脑桥；NO，小结）。PB 中标出8个 CX 柱。\n(B–D) 细胞内填充 CPU4 在 PB（Bi、Bii）、小结（Ci、Cii）和 CBU（Di、Dii）的分枝最大强度投影；各区各举两例。CBU 末梢明确为突触前，PB 和小结中则无法明确判定，提示混合型末梢。\n(E) 熊蜂 CX 低分辨率块面电镜堆栈单层，体素100×100×100 nm。\n(F) 根据(E)追踪全部支配右小结神经元的三维形态。颜色与(A)相应，表示柱身份。走行与 CBU 分枝符合共聚焦数据，每柱16–19个可追踪细胞因此被识别为可能的 CPU4。\n(G) 熊蜂中分辨率堆栈单层，体素23×23×50 nm。\n(H) 各 CX 柱 CPU4 在同一小结的投射区重叠，这是局部微回路的空间前提。各束显示3–5个细胞。\n(I、J) 高分辨率堆栈单层（11.5×11.5×50 nm），显示两类 TN 活性区（箭头）附近的突触小泡；其正对可能的 CPU4（颜色同H）。TNx见(I)，TNy见(J)；仅凭小结纤维无法确定其为 TN1 还是 TN2。\n(K) 各 TN 的一个末梢分枝表面重建（灰色；TNx、TNy命名原因同上）。明确的活性区为洋红色。另重建了3个 TN 突触后柱状神经元，并追至起源纤维束，颜色按束身份。\n(L–N) CPU4 与 TN 接触点三维细节（箭头）；(L)为(I)绿色细胞，(M)为(J)红色，(N)为(J)黄色。\n比例尺：(A、E、F)50 μm；(B–D、G、H)20 μm；(K)2 μm；(I、J、L–N)1 μm。", "status": "translated", "notes": [], "sentence_ids": ["P009-CAPTION-S001", "P009-CAPTION-S002", "P009-CAPTION-S003", "P009-CAPTION-S004", "P009-CAPTION-S005", "P009-CAPTION-S006", "P009-CAPTION-S007", "P009-CAPTION-S008", "P009-CAPTION-S009", "P009-CAPTION-S010", "P009-CAPTION-S011", "P009-CAPTION-S012", "P009-CAPTION-S013", "P009-CAPTION-S014", "P009-CAPTION-S015", "P009-CAPTION-S016", "P009-CAPTION-S017", "P009-CAPTION-S018"], "min_font_pt": 8, "reading_order": 25}], "assets": [], "analysis": []}, {"page": 10, "original": "image-023.jpg", "background": "image-024.jpg", "blocks": [{"id": "P010-LEFT", "page": 10, "bbox": [53, 100, 293, 749], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [53, 100, 293, 749], "source": "columns of the CBU between the right and left brain hemi-\nspheres [30, 33–35, 45–47]. CPU1 cells also appear to get direct\ninput from TB1 cells in the PB (Figure 5F). Importantly, CPU4 and\nCPU1 neurons do not follow the same projection pattern: neu-\nrons of both types originating in one PB column make connec-\ntions in different columns of the CBU, offset by one column\nto either the right or the left [30, 31, 33]. We propose that\nthis allows CPU1 neurons to effectively compare the current\nheading (inhibitory TB1 activity) and the desired heading\n(CPU4-encoded home vector) and thereby generate a steering\ncommand (Figure 5I).\nThe functional principle of the model circuit can be best under-\nstood by using a force-directed graph layout to reveal the under-\nlying logic of the complex cross-hemisphere and column-shifted\nconnections between TB1, CPU4, and CPU1 neurons (Fig-\nure 5G). We emphasize that this connectivity pattern was entirely\nderived from anatomy and not proposed specifically to support\nthe function we now suggest. All right-hemisphere CPU1 cells\n(light blue) will be activated by the difference between the current\nheading (green TB1 input) and the home vector (yellow CPU4\ninput) shifted leftward by 90(cid:1) relative to the TB1 input. This shift\nis due to the 45(cid:1) columnar offset of CPU4 to CPU1 projections\nplus the 45(cid:1) offset (relative to zero) of the preferred expansion\npoint of TN neuron input to CPU4 cells in that hemisphere. Simi-\nlarly, the left hemisphere CPU1 cells (dark blue) will be activated\nby the difference between the current heading (green TB1) and a\n90(cid:1) rightward-shifted home vector (orange CPU4). Thus, the cir-\ncuit as a whole ‘‘evaluates’’ whether a left or right rotation would\nproduce a better match between the current heading and the\nmemory (Figure S6). Due to the separate path integration in\neach hemisphere, it would be possible for the output amplitude\nof one hemisphere to exceed the other as a result of non-sym-\nmetric holonomic flight rather than a better directional match\nto memory. However, the two outputs for corresponding direc-\ntions are normalized by subtractive inhibition from the cross-\nconnecting pontine neurons (Figures 5I, S4E, and S4F). Thus,\nthe relative output of left and right CPU1 cells provides the steer-\ning signal needed to align the animal with its home vector. As\npath integration is assumed to be always operating, during a re-\nturn route, the memory in CPU4 cells will gradually become equal\nin all directions, and when the home location is reached, there\nwill no longer be a difference in output from the steering cells.\nWe note here that the steering principle we have described, a\nconsequence of the CPU4-CPU1 columnar offset, could be a\ngeneral purpose mechanism by which the CX compares an ani-\nmal’s current heading to its desired heading to generate an\nappropriate correction. We return to this point in the discussion.\nDemonstrating the Robustness of the Model through\nSimulation\nWe implemented a computational model of this anatomically\nplausible circuit using rate-based neurons and tested it in an\nagent simulation (Figures 6 and 7; Movie S2; in the STAR\nMethods and Figure S6, we also mathematically demonstrate\nthe function by adapting a known algorithmic framework [48]).\nTested with random outbound routes, the agent homes directly\nto within a few steps of its starting location, where it automati-\ncally produces an emergent search pattern (Figure 6A; Movie\nS2). The homing ability is not affected by biologically relevant", "translation": "CBU 柱[30,33–35,45–47]。CPU1 似乎还在 PB 直接接收 TB1 输入（图5F）。重要的是，CPU4 与 CPU1 的投射模式不同：起源于同一 PB 柱的这两类神经元在不同 CBU 柱形成连接，向右或左相差一个柱[30,31,33]。我们提出，这让 CPU1 能有效比较当前航向（抑制性 TB1 活动）与期望航向（CPU4 编码的归巢向量），由此生成转向指令（图5I）。\n使用力导向图展示 TB1、CPU4、CPU1 之间复杂跨半球、跨柱偏移连接的底层逻辑，最易理解模型回路的功能原理（图5G）。我们强调，这一连接模式完全源于解剖结构，并非为支持此处提出的功能而专门设计。所有右半球 CPU1（浅蓝）受到当前航向（绿色 TB1 输入）与相对 TB1 输入向左偏移90°的归巢向量（黄色 CPU4 输入）之差的激活。90°来自 CPU4→CPU1 投射的45°柱偏移，加上该半球 TN→CPU4 输入偏好扩张点相对零位的45°偏移。类似地，左半球 CPU1（深蓝）比较当前航向（绿色 TB1）与右移90°的归巢向量（橙色 CPU4）。因此，整个回路“评估”向左还是向右旋转能让当前航向与记忆更匹配（图S6）。\n两侧脑半球各自积分路径，因而某侧输出幅度可能因不对称全向飞行而超过另一侧，并非因为其方向与记忆更匹配。但跨半球桥接神经元的减法性抑制会归一化对应方向的两个输出（图5I、S4E、S4F）。因此，左右 CPU1 的相对输出提供使动物对准归巢向量的转向信号。由于假设路径积分始终运行，返回途中 CPU4 记忆在所有方向上逐渐趋于相等；到达巢穴时，转向细胞的输出便不再存在差异。\n这里指出，由 CPU4–CPU1 柱偏移产生的上述转向原理，可能是 CX 比较当前与期望航向、生成适当校正的通用机制。讨论部分将再谈及此点。\n通过仿真展示模型稳健性\n我们用基于放电率的神经元实现这一解剖上合理的回路，并在智能体仿真中测试（图6、7；视频S2；STAR Methods 和图S6还改编已有算法框架[48]，从数学上证明其功能）。在随机外出路径测试中，智能体直接返回距起点数步以内，继而自动涌现搜索轨迹（图6A；视频S2）。其归巢能力不受蜂类典型的、生物学上相关幅度的", "status": "translated", "notes": [], "sentence_ids": ["P010-LEFT-S001", "P010-LEFT-S002", "P010-LEFT-S003", "P010-LEFT-S004", "P010-LEFT-S005", "P010-LEFT-S006", "P010-LEFT-S007", "P010-LEFT-S008", "P010-LEFT-S009", "P010-LEFT-S010", "P010-LEFT-S011", "P010-LEFT-S012", "P010-LEFT-S013", "P010-LEFT-S014", "P010-LEFT-S015", "P010-LEFT-S016", "P010-LEFT-S017", "P010-LEFT-S018", "P010-LEFT-S019"], "min_font_pt": 9, "reading_order": 26}, {"id": "P010-RIGHT", "page": 10, "bbox": [304, 100, 544, 749], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [304, 100, 544, 749], "source": "amounts of holonomic movements that are typically produced\nduring bee flight (±45(cid:1)) [49, 50]. These simulation results match\nthe theoretical expectations. During the outbound route, the\nshifting head-direction bump of TB1 activity leads to accumula-\ntion of two sinusoidal activity patterns in the CPU4 neuron pop-\nulations in each brain hemisphere (Figure 6B), which then control\nsteering in the correct direction on the return trip. While homing,\nthe continuously operating integrator rebalances the memory\nactivity and, in the absence of a stopping criterion, produces\nthe observed search patterns. Due to the continuous memory\nupdate, the agent can also deal with forced deviations on its\nhomeward path (Figure 6C). The search patterns and response\nto deviations resemble behavioral data from ants [51]. The mem-\nory capacity depends on assumptions about the rate of accumu-\nlation and decay, but for the settings used here, routes of up to\n5,000 steps still produce accurate return paths (Figure 6D),\nwhereas very long routes (>20,000 steps) start to saturate the\nmemory, although this still allows recovery of a correct heading\ndirection while undershooting in distance (Figure 6E).\nTo test whether the presented circuit can function in a real-\nworld environment, we implemented the same model on a ro-\nbotic platform (Figure 6F; Movie S3), using camera-perceived\noptic flow and inertial-rotation-based compass estimation as in-\nputs. The robot successfully performs path integration under\nthese realistic conditions: after a random outbound journey tak-\ning the robot 6–12 m away from the origin, the CX circuit guided it\nback to within an average of 16 cm of home (SD 11.1 cm; n = 10).\nIn repeated tests, the network is robust to added noise\nof 10%–20%, generating highly accurate homing until the\noutbound route extends beyond the capacity of the memory\ncells (Figure 7A). Using a criterion from bee experiments, the\n‘‘disappearance direction,’’ we see that the direction in which\nthe agent sets out for home is tightly constrained around 0(cid:1) (Fig-\nure 7B), and the route taken is quite direct (Figure 7C). In addition\nto varying the neural activity noise and the route distance (Fig-\nures 7A and 7D), we tested how robust the model is to perturba-\ntions of several model parameters. For each test, n = 2,000 hom-\ning tasks were completed for each parameter value: 1,000 trials\nat default neural activity noise (10%) and 1,000 at no noise. The\nhoming accuracy was assessed by the minimum distance from\nhome achieved by the agent.\nFirst, we tested the effects of varying the connection weights\nbetween cells (Figure 7E). Fixed noise on the weights is less likely\nto balance out over time than additive noise at each time step,\ncausing an intrinsic bias and making it more detrimental to the\nsystem. However, despite a weight noise variance of up to 5%,\nthe network was still able to achieve good homing behavior. To\ntest whether the rotation-dependent offset in the preference\nangle of the compass input neurons (TL and CL; Figure 1G) af-\nfects the circuit, we mimicked the experimental data in the model\nby gradually increasing the difference angle between rotation di-\nrections. As in the experimental results, peak activity would al-\nways pre-empt the preference angle. In these tests, there was\nnot a strong effect over the range tested, although performance\nimproved somewhat with a small tuning shift (compared to no\nshift), similar to the one observed in the bee neurons (Figure 7F).\nThis could be due to counteracting lag from the signal propa-\ngating through the model, especially due to the dynamics of\nthe TB1 ring attractor.", "translation": "全向运动（±45°）影响[49,50]。这些仿真结果符合理论预期。外出途中，TB1 头方向活动隆起不断移动，使两侧半球的 CPU4 群体累积两个正弦活动模式（图6B），随后在返回时控制正确转向。归巢过程中，持续运转的积分器重新平衡记忆活动；由于没有停止判据，便产生所见的搜索轨迹。持续更新的记忆也使智能体能应对返程中的强制偏离（图6C）。搜索轨迹和偏离响应类似蚂蚁行为数据[51]。记忆容量取决于累积与衰减速率的假设；在本研究设置下，长达5,000步的外出路径仍能产生准确返程（图6D），而极长路径（>20,000步）开始使记忆饱和，此时航向仍正确，但归巢距离不足（图6E）。\n为检验该回路能否用于真实环境，我们在机器人平台实现了同一模型（图6F；视频S3），输入为摄像头感知的视流及基于惯性旋转的罗盘估计。机器人在这些实际条件下成功完成路径积分：随机外出到距起点6–12 m后，CX 回路引导它返回到距巢穴平均16 cm处（SD 11.1 cm；n=10）。\n反复测试表明，网络可抵抗10%–20%的附加噪声，在外出路径超出记忆细胞容量前维持高度准确的归巢（图7A）。使用蜂行为实验的“消失方向”指标，智能体开始返巢的方向紧密集中于0°附近（图7B），路径也相当直接（图7C）。除神经活动噪声与路径长度（图7A、7D）外，我们还测试若干参数扰动。每个参数值完成2,000次归巢任务：默认神经活动噪声（10%）下1,000次，无噪声1,000次。以智能体到巢穴的最小距离评价精度。\n首先改变细胞间连接权重（图7E）。权重上的固定噪声比每步附加噪声更难随时间抵消，会造成内在偏差，危害更大。不过权重噪声方差高达5%时，网络仍可较好归巢。为检验罗盘输入神经元（TL、CL）偏好角随旋转方向的偏移（图1G）是否影响回路，我们逐渐增大两个旋转方向的角差以模拟实测数据。与实验一样，峰值活动始终提前于偏好角。在测试范围内影响不大；相较无偏移，与蜂神经元类似的小幅调谐偏移略有改善（图7F）。这可能是因为其抵消了信号传播的滞后，尤其是 TB1 环形吸引子动力学造成的滞后。", "status": "translated", "notes": [], "sentence_ids": ["P010-RIGHT-S001", "P010-RIGHT-S002", "P010-RIGHT-S003", "P010-RIGHT-S004", "P010-RIGHT-S005", "P010-RIGHT-S006", "P010-RIGHT-S007", "P010-RIGHT-S008", "P010-RIGHT-S009", "P010-RIGHT-S010", "P010-RIGHT-S011", "P010-RIGHT-S012", "P010-RIGHT-S013", "P010-RIGHT-S014", "P010-RIGHT-S015", "P010-RIGHT-S016", "P010-RIGHT-S017", "P010-RIGHT-S018", "P010-RIGHT-S019", "P010-RIGHT-S020", "P010-RIGHT-S021"], "min_font_pt": 9, "reading_order": 27}], "assets": [], "analysis": []}, {"page": 11, "original": "image-025.jpg", "background": "image-026.jpg", "blocks": [{"id": "P011-CONT", "page": 11, "bbox": [440, 739, 552, 750], "kind": "metadata", "font_pt": 8, "source_bbox": [440, 739, 552, 750], "source": "(legend on next page)", "translation": "（图注见下一页）", "status": "translated", "notes": [], "sentence_ids": ["P011-CONT-S001"], "min_font_pt": 8, "reading_order": 28}], "assets": [{"id": "P011-FIG5", "kind": "figure", "bbox": [59, 99, 551, 735], "source": "Figure 5（图内英文标签保留）", "uri": "image-027.jpg"}], "analysis": []}, {"page": 12, "original": "image-028.jpg", "background": "image-029.jpg", "blocks": [{"id": "P012-LEFT", "page": 12, "bbox": [53.1, 100, 293.1, 543], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [53.1, 100, 293.1, 543], "source": "As we have used idealized values of lateral offset in the\npreferred angle of optic flow expansion for the model speed neu-\nrons (TN) (Figure 3I), we tested the effects of perturbations in the\nangular offsets by systematically changing the preference angle\nof optic flow expansion. An angle of 0(cid:1) is equivalent to assuming\nthat the speed cells in each brain hemispheres respond optimally\nto a point of expansion directly in front, which would result in the\ntwo CPU4 neuron populations integrating the path identically.\nFor noise-free experiments, the agent homed with similarly\ngood performance at all preference angles smaller than 45(cid:1).\nFor trials with neural noise, the best angle was around 45(cid:1), cor-\nresponding to the experimentally measured average value in bee\nTN neurons (Figure 3G). In both tests, as angles exceeded 60(cid:1),\nhoming ability decreased smoothly (Figure 7G). For paths with\nrandom holonomic motion, the inaccuracy this introduces tends\nto cancel out, and we do not see a substantial difference in re-\nsults (Figure 7G). However, if we force the agent to move contin-\nuously in one direction while facing another direction, this encod-\ning produces predictable and substantial error in the home\nvector, which does not occur for the (biologically observed) 90(cid:1)\nseparation of expansion preference direction (Figures S7D–S7F).\nNext, we increased the speed of the agent so that the TN neu-\nrons would reach saturation, i.e., be unable to correctly repre-\nsent the highest speeds. Acceleration was increased up to three\ntimes the default value, which had been set to provide a full range\nof neural activity. Initially, barely any drop in path integration per-\nformance was noticeable, because only a small proportion of\nmotion occurs at the highest speeds. As speed increased\nbeyond 1.53, we saw a degradation of performance and the\nagent undershoots during homing (Figure 7H). Finally, TN input\nwas smoothed to mimic the sustained responses shown in Fig-\nure 2E, which also lead to a gradual decline in homing precision\n(Figure 7I).\nThe main conclusion from these tests is that the properties of\nthe model are robust. Failure can arise if the limits of the network\nare exceeded in terms of noise tolerance and memory or if cell\ntuning curves are shifted too far from their ideal preference an-\ngles, but small changes of any parameter do not cause cata-\nstrophic failures of the model. The use of rate-based neurons,\nand the assumption that CPU4 activity can simply accumulate,", "translation": "模型速率神经元（TN）的偏好视流扩张角采用了理想化侧向偏移（图3I），因此我们系统改变偏好角，测试角偏移扰动。0°意味着两侧速率细胞都对正前方扩张点响应最强，两个 CPU4 群体便会以同样方式积分路径。无噪声时，所有小于45°的偏好角均有相近的良好归巢表现；有神经噪声时，最优约45°，对应蜂 TN 的实测平均值（图3G）。两类测试中，角度超过60°后归巢能力平缓下降（图7G）。随机全向运动路径中的这类误差往往相互抵消，因此结果未见明显差异（图7G）。但若强制智能体始终朝着一个方向、持续向另一方向运动，该编码会产生可预测且显著的归巢向量误差；扩张偏好方向相隔90°（生物学观察值）时不会出现这一问题（图S7D–S7F）。\n接着提高智能体速率，使 TN 饱和，即无法正确表示最高速率。加速度最高增至默认值三倍；默认值原本设为可覆盖完整神经活动范围。最初路径积分表现几乎不下降，因为最高速运动只占很小比例；当速率增至1.5倍以上时，表现恶化，归巢距离不足（图7H）。最后对 TN 输入平滑，以模拟图2E的持续响应，同样导致精度逐渐下降（图7I）。\n这些测试的主要结论是模型性质稳健。当噪声、记忆需求超出网络极限，或调谐曲线偏离理想角过远时可能失败，但任一参数的小变化均不导致灾难性失效。采用放电率神经元、以及假定 CPU4 活动可以简单累积，", "status": "translated", "notes": [], "sentence_ids": ["P012-LEFT-S001", "P012-LEFT-S002", "P012-LEFT-S003", "P012-LEFT-S004", "P012-LEFT-S005", "P012-LEFT-S006", "P012-LEFT-S007", "P012-LEFT-S008", "P012-LEFT-S009", "P012-LEFT-S010", "P012-LEFT-S011", "P012-LEFT-S012", "P012-LEFT-S013"], "min_font_pt": 9, "reading_order": 29}, {"id": "P012-RIGHT", "page": 12, "bbox": [304.1, 100, 544.1, 543], "kind": "paragraph", "font_pt": 10.5, "source_bbox": [304.1, 100, 544.1, 543], "source": "are clearly abstractions; in future work, we need to verify that\nuse of spiking neurons does not limit the practical performance\n(e.g., accuracy and memory limit), although we are confident\nthat the basic principle of operation will carry over.\nDISCUSSION\nWe have presented a biologically constrained circuit model for\npath integration that combines a previously well-described com-\npass network with speed-sensing neurons reported here for the\nfirst time and which makes concrete predictions about synaptic\nconnectivity consistent with all available functional and anatom-\nical data across insect species.\nSeveral highly conserved structural features of the insect CX\ngain relevance through our model. The anatomically inspired\neight-fold encoding of compass directions has the advantage\nthat geometric operations, such as taking sine and cosine, can\nbe obtained by making a single column shift of activity in oppo-\nsite directions, providing a first suggestion as to why the CX\nacross most insects consists of 2 3 8 vertical slices. The distinct\nsensory pathway transmitting translational optic flow information\nto the CX reveals a function for the CX noduli, a region present in\nall flying insects but of hitherto unknown function. The conserved\ncomplex pattern of dendritic and axonal fibers in the multiglo-\nmerular TB1 neurons is the core of the ring attractor circuit.\nThe characteristic connectivity schemes of different types of\ncolumnar neurons (CPU4 and CPU1) fully account for the func-\ntions necessary for memory and steering. Finally, the functionally\nundescribed CX pontine cells, the last remaining cell class of\nthe CX that is also present in all species examined [30, 33–35,\n45–47], are crucial in maintaining the balance between outputs\nof the two hemispheres.\nFurthermore, with the TN speed neurons, we have functionally\ncharacterized a new component of the CX circuitry. The identical\nmorphology of these cells in two distantly related species sug-\ngests that these cells have evolved more than 100 million years\nago [29] and might be part of the core network of the bee CX.\nAs both species inhabit vastly different sensory environments,\nour recordings from Megalopta provide the basis for future inves-\ntigations comparing multiple species physiologically. These will", "translation": "显然都是抽象化。今后仍须验证使用脉冲神经元是否会限制实际表现（如精度、记忆上限）；不过我们相信基本工作原理仍适用。\n讨论\n我们提出一个受生物学约束的路径积分回路模型，将已有详细描述的罗盘网络与本文首次报告的速率感知神经元结合起来，并对突触连接提出具体预测，与各类昆虫现有功能及解剖数据相符。\n模型赋予昆虫 CX 的若干高度保守结构以功能意义。基于解剖的八重罗盘方向编码具有一项优势：将活动向相反方向各移一个柱，便能完成求正弦、余弦等几何运算。这首次提示为何多数昆虫 CX 具有2×8个垂直分片。将平移视流传入 CX 的独立感觉通路，揭示了飞行昆虫共有而此前功能不明的小结的作用。多小球 TB1 中保守而复杂的树突、轴突纤维模式，是环形吸引子回路核心。CPU4、CPU1 两类柱状神经元特有的连接方案，完整对应记忆与转向所需功能。最后，CX 中此前尚无功能描述、且所有已研究物种均有的剩余一类细胞——桥接细胞[30,33–35,45–47]——对维持两侧半球输出平衡至关重要。\n此外，我们通过 TN 速率神经元，功能性表征了 CX 回路的一个新组成。两个亲缘关系较远物种中相同的形态提示，这类细胞可能在一亿多年前演化形成[29]，并可能属于蜂 CX 的核心网络。这两个物种生活的感觉环境差异很大，因此 Megalopta 的记录为今后的跨物种生理比较奠定了基础。这些研究将", "status": "translated", "notes": [], "sentence_ids": ["P012-RIGHT-S001", "P012-RIGHT-S002", "P012-RIGHT-S003", "P012-RIGHT-S004", "P012-RIGHT-S005", "P012-RIGHT-S006", "P012-RIGHT-S007", "P012-RIGHT-S008", "P012-RIGHT-S009", "P012-RIGHT-S010", "P012-RIGHT-S011", "P012-RIGHT-S012", "P012-RIGHT-S013", "P012-RIGHT-S014"], "min_font_pt": 9, "reading_order": 30}, {"id": "P012-CAPTION", "page": 12, "bbox": [53.1, 548, 544.1, 750], "kind": "caption", "font_pt": 8.5, "source_bbox": [53.1, 548, 544.1, 750], "source": "Figure 5. Deduction of Circuit Model from Anatomically Plausible Connections in the Central Complex\n(A) 3D reconstruction of the Megalopta genalis central complex (CX); posterior view. The enlargement shows a schematic protocerebral bridge (PB) with columnar\norganization highlighted. Proposed head-direction tuning of direction cells is indicated for each column (based on data from flies) [8].\n(B) Projection pattern of TB1 neurons in the PB; direction tuning indicated as arrows; green columns, output fibers; yellow columns, input fibers.\n(C–E) Schematic interhemispheric projection patterns of CPU4 neurons (C), CPU1 neurons (D), and pontine neurons (E).\n(F) Principal connections of all cell types included in the proposed path integration circuit. Shown are all connections of one TB1 direction cell irrespective of\ncolumnar identity of individual cells (only two out of six connections to other TB1 cells are shown).\n(G) Ring-like topology of proposed path integration circuit, obtained using a force-directed graph. Neurons are arranged in three layers: direction cells (TB1),\nmemory cells (CPU4), and steering cells (CPU1), with connections matching the interhemispheric projection patterns in (B)–(E). Only one CPU4 cell per column is\ndrawn (representing the entire columnar population). Connections between TB1 neurons form a ring attractor network (solid lines, connections of one cell; dashed\nlines, remaining cells; line thickness, connection strength). CPU1 neurons receive inputs from CPU4 neurons with a rightward (yellow) or leftward (orange) shift\nrelative to their TB1 input. Arrows, directional tuning (TB neurons) and integrated direction preference (CPU4 cells). Pontine neurons were omitted for clarity.\n(H) Illustration for memory acquisition during outbound journey. Width of lines indicates activation strength. Memory accumulates opposite to outbound heading\ndirection and is encoded as two partial vectors (each generated by the CPU4 cell population on one brain hemisphere).\n(I) Illustration of how memory is combined with current heading to generate an imbalance between the right and left CPU1 neuron population activity. The activity\nin each cell is indicated by the height of the bars above the cell indices. Current heading, green arrow (bottom); target direction encoded by memory (black arrow).\nActivities of TB1 (inhibitory) and CPU4 cells (excitatory) are compared by CPU1 cells. Due to the one-column shift between CPU1 and CPU4 projections, this\nresults in an imbalance in the combined CPU1 output that initiates turning toward the target. Pontine neurons have the identical activity as CPU4 cells (not shown)\nand normalize the memory output from each CPU4 population by subtractive inhibition of neurons with opposite directional tunings.\nFor a more mathematical explanation of how the steering signal is generated, see Figures S6B–S6D. For abbreviations, see Figure 1. See also Figures S4–S6.", "translation": "图5　由中央复合体中解剖上合理的连接推导回路模型\n(A) Megalopta genalis CX三维重建，后视。放大示意突出 PB 柱结构；各柱标示基于果蝇数据[8]提出的头方向调谐。\n(B) PB内TB1投射模式：箭头为方向调谐，绿色柱为输出纤维，黄色柱为输入纤维。\n(C–E) CPU4(C)、CPU1(D)、桥接神经元(E)的跨半球投射。\n(F) 候选路径积分回路中全部细胞类型的主要连接。展示一个TB1方向细胞的全部连接，不考虑各细胞柱身份；与其他TB1的6条连接仅画2条。\n(G) 力导向图得到的环形拓扑。神经元分方向(TB1)、记忆(CPU4)、转向(CPU1)三层，连接符合(B–E)的投射。每柱仅画一个CPU4代表该柱群体。TB1构成环形吸引子：实线为一个细胞的连接，虚线为其余连接，粗细为强度。CPU1接收相对TB1输入向右（黄）或向左（橙）偏移的CPU4输入；箭头为TB方向调谐或CPU4积分方向偏好。为清楚起见省略桥接细胞。\n(H) 外出记忆获取：线宽为激活强度，记忆在外出航向相反处累积，编码为两个部分向量，各由一侧CPU4群体产生。\n(I) 记忆结合当前航向使左右CPU1群体失衡。细胞上方柱高表示活动；底部绿
